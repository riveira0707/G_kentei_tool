const allTerms = [
  { name: "人工知能", desc: "定義：人間の知的能力を人工的に実現する技術・研究分野\nポイント：統一された定義は存在しない、研究者や時代で定義が異なる\nレベル分類：①制御プログラム ②古典的AI ③機械学習 ④深層学習\n区別：AI＝知能（ソフト）、ロボット＝身体（ハード）", stars: 5 },
  { name: "機械学習", desc: "定義：AIを実現する手法の一つ、データからルールを自動学習\nパラダイムシフト：人間がルールを教える → 機械がデータから学ぶ\n大別：教師あり学習・教師なし学習・強化学習の3種類\n意義：知識獲得のボトルネックを解消\n包含関係：AI ＞ 機械学習 ＞ ディープラーニング（最頻出）", stars: 5 },
  { name: "ディープラーニング", desc: "定義：機械学習の一手法、多層ニューラルネットワークを用いる\n最大の特徴：特徴表現学習を実現、人間による特徴量設計が不要\n歴史：2012年 AlexNet が第三次AIブームの起爆剤\n試験ポイント：「DLは機械学習に含まれる」は○、「AIと同義」は×", stars: 5 },
  { name: "AI効果", desc: "定義：AIが実現すると、もはやAIと呼ばれなくなる現象\n事例：チェスAIが人間を超えた途端「ただの探索だ」と言われる\n試験ポイント：「AIの定義が変遷する理由」として出題", stars: 4 },
  { name: "エージェント", desc: "定義：環境を認識し自律的に行動する主体\n仕組み：センサーで感知、アクチュエータで環境に働きかける\n事例：自動運転車、ゲームAI、チャットボット\nキーワード：環境と相互作用する", stars: 3 },
  { name: "強いAIと弱いAI", desc: "弱いAI：特定タスクのみ実行、現在実現しているAIはすべてこれ。翻訳AI、囲碁AI\n特徴：見かけ上知的だが、理解はしていない（中国語の部屋が示す）\n強いAI（AGI）：人間のような汎用的知能・意識を持つ。現時点では未実現\n試験鉄板：現在実現しているのは弱いAI", stars: 5 },
  { name: "チューリングテスト", desc: "定義：機械が人間と区別できないほど自然に会話できれば知能があるとみなす\n判定方法：審査員がテキストチャットで人間か機械か区別できるか\nポイント：内容の正しさではなく「人間らしく振る舞えるか」で判定\n歴史：1950年 アラン・チューリングが提唱", stars: 5 },
  { name: "中国語の部屋", desc: "定義：チューリングテストへの反論、ジョン・サールによる思考実験\n内容：中国語が分からない人がマニュアル通りに返答する\n外からは理解しているように見えるが、本人は理解していない\n核心：正しく答えられることと理解することは同じではない\n意味：弱いAIの限界を示す", stars: 5 },
  { name: "フレーム問題", desc: "定義：現実で起きる無限の可能性の中から、何を考慮すべきか判断が困難な問題\n本質：有限の計算資源で無限の事象を扱えない\n歴史：第一次AIブーム終焉の最大原因\n試験ポイント：「性能が上がれば解決する」は×、本質的に無限の問題", stars: 5 },
  { name: "シンボルグラウンディング問題", desc: "定義：記号と現実世界の意味をどう結びつけるかの問題\n例：AIは「リンゴ」という文字列を処理できても、実体と結びついていない\nジレンマ：辞書を引いてもまた別の記号しか出てこず無限ループ\n意味：身体性を持たないAIの根本的限界\n解決策の例：CLIPのようなマルチモーダル", stars: 5 },
  { name: "身体性", desc: "考え方：知能は身体を持ち環境と相互作用することで発達する\n位置づけ：フレーム問題・シンボルグラウンディング問題へのアプローチ\n核心：身体を持たず記号だけでは真の理解に至らない", stars: 4 },
  { name: "知識獲得のボトルネック", desc: "定義：エキスパートシステム最大の弱点\n内容：人間の専門知識をIF-THENルールに落とし込むのが困難でコストが大きい\n理由：専門家は暗黙知で判断しており、単純なルールにできない\n歴史：第二次AIブーム終焉の直接的原因\nキーワード：人間がルールを教えるアプローチの限界", stars: 5 },
  { name: "トイ・プロブレム", desc: "定義：おもちゃのように単純化された問題\n事例：迷路、8パズル、ハノイの塔、ブロック積み\n課題：単純な問題は解けるが、現実の複雑な問題には対応できない\n試験ポイント：「トイ・プロブレムは解けるが現実は解けない」がAIの限界", stars: 4 },
  { name: "ルールベース機械翻訳", desc: "定義：人間が作成した文法ルールと辞書に基づく古典的な機械翻訳手法\n課題：大量のルール作成が必要、知識獲得のボトルネックにより衰退", stars: 3 },
  { name: "統計的機械翻訳", desc: "定義：大量の対訳データから統計的に翻訳パターンを学習する\n意義：ルールベースのボトルネックを解消\n位置づけ：現在はニューラル機械翻訳に置き換わったが橋渡しとなった技術", stars: 3 },
  { name: "シンギュラリティ", desc: "定義：技術的特異点。AIが人間の知能を超え、自らより賢いAIを作り始める転換点\n予測：カーツワイルは2045年と予測（あくまで予測、確定ではない）\n試験ポイント：「AIが人間を支配する日」ではなく「技術進歩が爆発的に加速する点」", stars: 4 },
  { name: "ダートマス会議", desc: "歴史：1956年夏、米ダートマス大学で開催\n意義：「AI」という言葉が初めて使われた歴史的会議。ジョン・マッカーシーらが主催\n位置づけ：第一次AIブームの始まり。年号とマッカーシーがセットで出題", stars: 4 },
  { name: "ローブナーコンテスト", desc: "定義：チューリングテストの大会。最も人間らしく会話できたAIに賞\n課題：表面的な会話テクニックで審査員を騙すことも可能\n批判：知能の本質的な評価にはならない", stars: 2 },
  { name: "探索木", desc: "定義：問題の状態空間を木構造で表現\n要素：ノード＝状態、枝＝行動\n位置づけ：全ての探索の前提となる最重要基礎概念\nキーワード：状態空間を木で表現", stars: 5 },
  { name: "幅優先探索", desc: "考え方：浅い階層から順に全て調べる、同じ深さを全て見てから次の深さへ\nデータ構造：キュー（FIFO）を使用\n長所：最短経路を保証する\n短所：メモリを大量に消費し爆発しやすい\nキーワード：浅い順、キュー、最短保証だがメモリ大", stars: 5 },
  { name: "深さ優先探索", desc: "考え方：一本の道を可能な限り深く進み、行き止まりでバックトラックする\nデータ構造：スタック（LIFO）を使用\n長所：メモリ効率が良い\n短所：最短経路は保証されない", stars: 4 },
  { name: "ブルートフォース", desc: "定義：総当たり・しらみつぶし・力任せの探索\n内容：全ての可能性を試す\n長所：確実\n短所：組合せ爆発が起き非効率", stars: 3 },
  { name: "モンテカルロ法", desc: "定義：乱数を大量に用いて近似解を推定する手法\n仕組み：ランダムに試行を繰り返し、結果の平均から解を推定\n応用例：MCTSとしてAlphaGoにも応用\nキーワード：乱数、試行繰り返し、近似解", stars: 4 },
  { name: "Mini-Max法", desc: "用途：二人零和ゲームの定石\n考え方：相手の最善手を考慮し、自分の利益を最大化する\nルール：自分はMax、相手はMinと仮定\n事例：三目並べ、チェス、将棋などゲームAIの基礎", stars: 4 },
  { name: "αβ法", desc: "定義：Mini-Max法を効率化する枝刈り手法\n仕組み：探索不要な枝を早めに刈り、少ない計算量でMini-Maxと同じ結果を得る\n用語：α＝自分の最善手の下限、β＝相手の最善手の上限\nキーワード：枝刈りで高速化、結果はMini-Maxと同じ", stars: 4 },
  { name: "SHRDLU", desc: "歴史：1972年に開発された自然言語理解システム\n内容：積み木の世界という限定された仮想世界で、自然言語の指示に従いブロックを操作\n意味：限定環境だから動いた、トイ・プロブレムの事例", stars: 3 },
  { name: "STRIPS", desc: "用途：ロボットの行動計画を記述する手法\n構成：前提条件・行動・効果の3つで記述\n目的：初期状態から目標状態への手順を自動導出\n位置づけ：自動計画の基礎", stars: 3 },
  { name: "ハノイの塔", desc: "内容：探索・推論の例題として頻出のパズル。3本の棒と複数の円盤\nルール：小さい円盤の上に大きい円盤を置けない\n最少手数：2ⁿ − 1\n意味：組合せ爆発と再帰の例", stars: 3 },
  { name: "is-a has-a part-of", desc: "位置づけ：知識表現の最も基本的な関係性\nis-a：継承「カナリア is-a 鳥」\nhas-a：所有「鳥 has-a 翼」\npart-of：部分「タイヤ part-of 車」", stars: 5 },
  { name: "意味ネットワーク", desc: "表現方法：概念＝ノード、関係＝リンクで表現するグラフ構造\n例：[カナリア]--is-a-->[鳥]--has-a-->[翼]\n特徴：継承推論が可能", stars: 4 },
  { name: "オントロジー", desc: "定義：概念化の明示的仕様\n位置づけ：意味ネットワークの発展形、体系的・形式的・明示的\n事例：WordNet、Gene Ontology\n意味：知識グラフの基礎", stars: 4 },
  { name: "エキスパートシステム", desc: "目標：専門家の知識をIF-THENルール化して推論するシステム\n構成：知識ベース ＋ 推論エンジン", stars: 1 },
  { name: "DENDRAL", desc: "歴史：1965年、世界初のエキスパートシステム\n分野：化学。質量分析の結果から分子構造を推定\n試験ポイント：最初のエキスパートシステム＝化学", stars: 5 },
  { name: "MYCIN", desc: "歴史：1972年、感染症診断を行うエキスパートシステム\n仕組み：約600個のIF-THENルールに加え、信頼度(Certainty Factor)を導入\n試験ポイント：MYCIN＝医療、信頼度", stars: 5 },
  { name: "ワトソン", desc: "開発：IBM\n歴史：2011年、クイズ番組Jeopardy!で人間王者に勝利\n仕組み：自然言語で質問応答、大量の非構造データから推論\n位置づけ：ディープラーニング以前のNLPの金字塔", stars: 3 },
  { name: "東ロボくん", desc: "開発：NII、2016年。偏差値57.8、東大には不合格\n示した課題：膨大な知識を蓄積しても読解力を実現するのは困難\n意味：シンボルグラウンディング問題の事例", stars: 2 },
  { name: "ELIZA", desc: "歴史：1966年、世界初のチャットボット\n仕組み：パターンマッチングで定型文を返す\n特徴：理解しているように見えるだけ、中国語の部屋の事例", stars: 3 },
  { name: "Question-Answering", desc: "定義：質問に対して答えを返すタスク\n進化の流れ：ELIZA → ワトソン → LLM", stars: 3 },
  { name: "Cycプロジェクト", desc: "歴史：1984年に開始、常識をすべて手入力しようとした試み\n例：「水は濡れている」といった常識文を人間が入力\n結果：40年経っても未完、知識獲得のボトルネックの象徴", stars: 3 },
  { name: "セマンティックWeb", desc: "提唱者：ティム・バーナーズ＝リー\n構想：Webに意味を持たせる\n基盤技術：RDF、OWL → 知識グラフへとつながる", stars: 3 },
  { name: "データマイニング", desc: "定義：大量データから知識を自動発見する技術\n意味：Cycのような手入力から、知識を自動発見する方向への転換\n事例：ビールとおむつが一緒に買われるという発見", stars: 3 },
  { name: "ウェブマイニング", desc: "定義：Web上のデータから知識を発見する技術\n3種類：テキストマイニング、リンクマイニング、利用状況マイニング\n応用例：PageRankなど", stars: 2 },
  { name: "インタビューシステム", desc: "目的：専門家から知識を聞き出す作業を支援するツール\n評価：知識獲得のボトルネックを解消しようとした試みだが、根本解決には至らなかった", stars: 2 },
  { name: "ビッグデータ", desc: "定義：Volume・Velocity・Varietyの3V\n背景：ビッグデータ＋計算機性能向上＋アルゴリズム進化で注目\nきっかけ：2010年代のスマホ・SNSによる大量データ蓄積、ImageNet1400万枚がブレイクのきっかけ", stars: 5 },
  { name: "次元の呪い", desc: "定義：特徴量の次元が増えると必要なデータ量が指数関数的に増大し、学習が困難になる現象\n例：1次元では10個で十分だが、10次元では10¹⁰個必要になる\n対策：PCAによる次元削減、特徴量選択、正則化\n試験ポイント：特徴量を闇雲に増やすと精度が低下する", stars: 4 },
  { name: "スパムフィルタ", desc: "定義：迷惑メールを自動判定する代表的な機械学習の例\n仕組み：ベイズ分類を用い、単語の出現確率で判定\n例：「Viagra」が多いとスパム確率が高い\nルールベースとの違い：ルールベースは人間がルールを記述、機械学習は自動学習でゆらぎに対応可能", stars: 4 },
  { name: "レコメンデーションエンジン", desc: "定義：ユーザに合った商品・コンテンツを推薦する仕組み\n手法：\n協調フィルタリング：似たユーザの行動から推薦「これを買った人はこれも買う」\nコンテンツベース：コンテンツの内容から似たものを推薦\n事例：Amazon、Netflix、YouTube", stars: 4 },
  { name: "統計的自然言語処理", desc: "定義：大量のテキストから統計的に言語を処理する\n歴史の流れ：ルールベース → 統計的 → ニューラルへ\n例：Google翻訳が統計的からニューラルへ移行した", stars: 4 },
  { name: "人間の神経回路", desc: "生物学的モデル：ニューロンがシナプスで結合し、発火して信号を伝達する\n歴史：1943年 McCulloch & Pitts が数理モデルを提案", stars: 2 },
  { name: "ネオコグニトロン", desc: "提唱者：福島邦彦、1979年、日本発\n構造：S細胞（特徴抽出）＋ C細胞（位置許容）の階層構造\n意義：畳み込みの原型となり、CNNの直接の祖先", stars: 3 },
  { name: "LeNet", desc: "提唱者：Yann LeCun、1998年\n構造：畳み込み層 ＋ プーリング層 ＋ 全結合層\n応用：手書き数字MNISTの認識、郵便番号読み取り、銀行の小切手認識で実用化\n意義：CNN実用化の始まり、誤差逆伝播で学習", stars: 4 },
  { name: "ImageNet", desc: "定義：1400万枚、2万カテゴリの大規模画像データセット\n意義：大量データがブレイクスルーに必須であることを示した\n位置づけ：ILSVRCの基盤データ", stars: 5 },
  { name: "ILSVRC", desc: "定義：ImageNetを用いた画像認識コンペティション（2010-2017）\n歴史：2012年 AlexNetが誤り率26%→15%に圧勝し革命が起きた。2015年 ResNetは人間の認識精度を超えた\n親：ImageNetを基盤とした大会", stars: 5 },
  { name: "アルファ碁", desc: "開発：DeepMind\n技術構成：プロ棋譜による教師あり学習 ＋ 強化学習による自己対局 ＋ モンテカルロ木探索\n成果：李世ドルに4勝1敗\n意義：探索空間が膨大な囲碁を攻略、社会的インパクトが非常に大きい", stars: 5 },
  { name: "生成AI", desc: "定義：画像・文章・音声などを新たに生成するAI\n代表モデル：\nGAN（2014年 Goodfellow：敵対的生成）\nDiffusion（Stable Diffusion、DALL-E 2など）\nLLM（ChatGPT、GPT-3/4、BERTなど）\n位置づけ：ディープラーニングの応用例、大量データ・大規模モデルで実現\n事例：Midjourneyによる画像生成、ChatGPTによる文章生成\n課題：著作権、フェイクニュース", stars: 5 },

{ name: "回帰問題", desc: "連続値を予測。例：家の広さから価格を予測\n出力が数値。誤差関数はMSE", stars: 5 },
  { name: "分類問題", desc: "離散的なラベルを予測。例：スパムか否か\n出力がクラス。誤差関数は交差エントロピー", stars: 5 },
  { name: "多クラス分類", desc: "3つ以上のクラスに分類\n例：手書き数字0-9の10クラス分類\nソフトマックス関数を使うのが主流", stars: 4 },
  { name: "単回帰分析", desc: "説明変数1つで予測。y = ax + b\n最も基本的な回帰", stars: 4 },
  { name: "重回帰分析", desc: "説明変数が複数。y = a1x1 + a2x2 + ... + b", stars: 4 },
  { name: "線形回帰", desc: "単回帰・重回帰の総称。最小二乗法で解く", stars: 5 },
  { name: "ロジスティック回帰", desc: "名前に回帰と付くが分類モデル\nシグモイド関数で0-1の確率を出力\n回帰なのに分類が最頻出ひっかけ", stars: 5 },
  { name: "決定木", desc: "木構造で条件分岐。解釈性が高い\n過学習しやすい。アンサンブルの部品", stars: 4 },
  { name: "SVM", desc: "マージン最大化で分離する超平面を求める\nカーネルトリックで非線形も可能", stars: 5 },
  { name: "カーネル / カーネルトリック", desc: "低次元で分離できないデータを高次元に写像して線形分離\n高次元で直接計算せず内積だけで効率化", stars: 4 },
  { name: "マージン最大化", desc: "SVMの核心。境界のマージンを最大にして汎化性能向上", stars: 4 },
  { name: "自己回帰モデル(ARモデル)", desc: "過去の自分の値で未来を予測\nXt = c + φ1*Xt-1 + φ2*Xt-2 + ...", stars: 3 },
  { name: "ベクトル自己回帰(VARモデル)", desc: "ARの多変量版。複数の時系列が相互に影響", stars: 3 },
  { name: "アンサンブル学習", desc: "複数の弱い学習器を組み合わせて強い学習器を作る", stars: 5 },
  { name: "バギング", desc: "並列型。データを複製して並列学習して多数決\n分散を減らし過学習抑制", stars: 5 },
  { name: "ブートストラップサンプリング", desc: "重複を許してランダムにサンプリング\nバギングの核となる仕組み", stars: 4 },
  { name: "ランダムフォレスト", desc: "バギングの代表。決定木を多数作り多数決\n過学習しにくく高精度", stars: 5 },
  { name: "ブースティング", desc: "直列型。前の誤りを次が重点的に学習\nバイアスを減らす", stars: 5 },
  { name: "勾配ブースティング", desc: "ブースティングの代表。勾配で前の誤りを修正\nXGBoost, LightGBMが有名。Kaggle最強", stars: 5 },
  { name: "クラスタリング", desc: "教師なし学習の代表\n似たデータを自動でグループ分け\nラベルなし。顧客セグメント分け、異常検知", stars: 5 },
  { name: "k-means法", desc: "最も有名なクラスタリング\nk個のクラスタに分ける\n①k個の重心をランダム初期化\n②各データを最も近い重心に割当\n③重心を再計算 ②③を収束まで繰り返す\nシンプルで高速\n弱点：kを事前決定、初期値依存、球状のみ得意", stars: 5 },
  { name: "ウォード法", desc: "階層的クラスタリング 凝集型ボトムアップ\n最も分散増加が少ないクラスタ同士を併合\nk-meansと違いクラスタ数を後から決められる\nデンドログラムで可視化可能", stars: 4 },
  { name: "デンドログラム(樹形図)", desc: "階層的クラスタリングの結果を木構造で可視化\n縦軸が距離、横軸がデータ\nどの高さで切るかでクラスタ数が決まる\n「切断高さでクラスタ数が決まる」が試験ポイント", stars: 4 },
  { name: "次元削減", desc: "高次元データを低次元に圧縮しつつ情報は保持\n次元の呪い対策、可視化、計算量削減", stars: 5 },
  { name: "主成分分析(PCA)", desc: "線形の次元削減の王道\n分散が最大になる方向を見つける\n寄与率で情報保持量が分かる\n可視化で2次元に落とすのによく使う\n「線形変換」「分散最大」「寄与率」", stars: 5 },
  { name: "特異値分解(SVD)", desc: "行列を U Σ V^T に分解\nPCAの計算の中核\nレコメンデーションや次元削減の基礎\n「行列分解の一種」「PCAと密接に関連」", stars: 4 },
  { name: "t-SNE", desc: "非線形の次元削減・可視化手法\n高次元を2-3次元に落として可視化が得意\n局所的な構造を保持、クラスタが綺麗に分かれる\nPCAより可視化性能高いが計算コスト大\nあくまで可視化用", stars: 4 },
  { name: "多次元尺度構成法(MDS)", desc: "データ間の距離をなるべく保持したまま低次元に配置\n「距離を保持して次元削減」がキーワード", stars: 3 },
  { name: "トピックモデル", desc: "文書の潜在的なトピックを発見\n文書は複数トピックの混合と仮定\n例：ニュース記事が政治30%+経済70%に分解", stars: 4 },
  { name: "潜在的ディリクレ配分法(LDA)", desc: "トピックモデルの代表手法\n文書→トピック分布、トピック→単語分布をディリクレ分布でモデル化\n大量文書から自動でトピック抽出、ラベル不要", stars: 4 },
  { name: "協調フィルタリング", desc: "似たユーザーは似たものを好むに基づく推薦\n行動履歴から推薦 例：Amazon\n「この商品を買った人はこんな商品も買っています」\nSVDやk-NNが使われる G検定最頻出", stars: 5 },
  { name: "コンテンツベースフィルタリング", desc: "アイテムの特徴に基づく推薦\n例：アクション映画好きにアクション映画を推薦\n協調フィルタリングと対比「アイテムの特徴を使う」", stars: 4 },
  { name: "コールドスタート問題", desc: "協調フィルタリング最大の弱点\n新規ユーザーや新規アイテムは履歴がないため推薦不可\n対策：コンテンツベースと組み合わせるハイブリッド\n「履歴がないと推薦できない」", stars: 4 },
  { name: "マルコフ決定過程", desc: "強化学習を定式化する数学的枠組み MDP\n要素：状態S、行動A、報酬R、遷移確率P、割引率γ\n「次の状態は現在の状態と行動のみで決まるマルコフ性」が前提\nエージェントは環境と相互作用し報酬を最大化\n「S,A,R,P,γの5要素」が頻出", stars: 5 },
  { name: "状態価値関数", desc: "V(s)：状態sにいる時に得られる将来の報酬の期待値\n「その場所がどれだけ良いか」を表す\n良い状態なら価値が高い、ベルマン方程式で更新", stars: 5 },
  { name: "行動価値関数", desc: "Q(s,a)：状態sで行動aを取った時に得られる将来の報酬の期待値\nQ関数とも「その状態でその行動を取るのがどれだけ良いか」\nQ学習で学習する対象\n「Q(s,a)は状態と行動のペアの価値」がキーワード", stars: 5 },
  { name: "割引率", desc: "γ：将来の報酬をどれだけ割り引くか 0〜1の値\nγ=0 目先の報酬のみ重視、γ=1 将来も同等に重視\n「遠い将来の報酬は不確実なので割り引く」\nMDPの重要パラメータ", stars: 4 },
  { name: "方策勾配法", desc: "方策Policy πを直接学習するアプローチ\n方策＝状態から行動への確率分布\n価値関数を経由せず報酬が高くなるように勾配上昇で更新\n連続行動や確率的方策が扱いやすい\nREINFORCE, Actor-Criticの基礎", stars: 5 },
  { name: "REINFORCE", desc: "方策勾配法の最も基本的なアルゴリズム\nモンテカルロ法で方策勾配を推定\nエピソード終了後に得られた報酬で方策を更新\nシンプルだが分散が大きい\n「モンテカルロ方策勾配法」として出題", stars: 4 },
  { name: "Actor-Critic", desc: "方策勾配法 + 価値関数を組み合わせたハイブリッド\nActor：方策を担当 行動を決める役者\nCritic：価値関数を担当 評価する批評家\nREINFORCEの分散が大きい問題をCriticで低減\n現在の強化学習の主流アーキテクチャ", stars: 4 },
  { name: "Q学習", desc: "行動価値関数Qを学習する代表的手法 オフポリシー\nQ(s,a) ← Q(s,a) + α[r + γ max Q(s',a') - Q(s,a)]\n「maxを取る」ので実際に取った行動と関係なく最適Qを学習\nDQNの基礎、G検定最頻出の強化学習アルゴリズム", stars: 5 },
  { name: "SARSA", desc: "Q学習と似るがオン・ポリシー\nQ(s,a) ← Q(s,a) + α[r + γ Q(s',a') - Q(s,a)]\nmaxではなく実際に次の行動a'のQを使う\n名前の由来 S,A,R,S',A'の5つ組で更新\nQ学習(オフポリシー) vs SARSA(オン・ポリシー)がひっかけ最頻出", stars: 4 },
  { name: "バンディットアルゴリズム", desc: "多腕バンディット問題を解くアルゴリズム群の総称\n複数のスロットマシンからどれを引くか\n「探索(まだ試していない腕を試す)」と\n「活用(今一番良い腕を引き続ける)」のバランスが核心", stars: 4 },
  { name: "ε-greedy方策", desc: "最も基本的な探索手法\nεの確率でランダム行動(探索)、1-εで最良行動(活用)\n例：ε=0.1なら10%ランダム、90%貪欲に最良手\n「εでランダム探索」がキーワード", stars: 5 },
  { name: "UCB方策", desc: "Upper Confidence Bound\n不確実性が高い行動を優先的に探索\n「まだ試していない=不確実性が高い」行動にボーナスを与えて探索を促す\nε-greedyより賢い探索、理論的に優れた手法", stars: 4 },
  { name: "ホールドアウト検証", desc: "データを訓練:検証:テストに分割、例 6:2:2\n親：最も基本的な検証方法\n課題：データ量少ないと分割で偏りが生じる", stars: 5 },
  { name: "交差検証", desc: "定義：データを分割して複数回評価する方法の総称", stars: 5 },
  { name: "k-分割交差検証", desc: "定義：k個に分割し k-1個で学習1個で評価をk回繰り返し平均を取る\n例：5分割なら4:1で5回\n利点：データ効率的 小データで有効", stars: 5 },
  { name: "オッカムの剃刀", desc: "定義：同じ精度なら単純なモデルを選ぶべきという原則\n親：モデル複雑さ上げるメリットは表現力向上、デメリットは過学習リスク", stars: 4 },
  { name: "混同行列", desc: "定義：予測と正解の組み合わせ 2x2表で整理", stars: 5 },
  { name: "真陽性・真陰性", desc: "真陽性TP：正を正と予測\n真陰性TN：負を負と予測\n正解に該当", stars: 5 },
  { name: "偽陽性・偽陰性", desc: "偽陽性FP：負を正と誤予測 第一種過誤、空振り\n偽陰性FN：正を負と誤予測 第二種過誤、見逃し\n例：がん検診で偽陽性は健康な人を患者と誤診、偽陰性は患者を見逃す", stars: 5 },
  { name: "正解率・適合率・再現率・F値", desc: "正解率Accuracy：(TP+TN)/全体 全体でどれだけ正解か\n適合率Precision：TP/(TP+FP) 正と予測した中で本当に正の割合\n再現率Recall：TP/(TP+FN) 本当は正のうち正と予測できた割合\nF値：適合率と再現率の調和平均、両方考慮\n例：スパム検出は適合率重視、がん検診は再現率重視", stars: 5 },
  { name: "ROC曲線・AUC", desc: "ROC：横軸偽陽性率、縦軸真陽性率で閾値変化をプロット\nAUC：ROC曲線下面積 1に近いほど良いモデル\n親：閾値に依存しない評価", stars: 4 },
  { name: "平均二乗誤差 MSE", desc: "定義：(予測-正解)2乗の平均\n特徴：外れ値に弱い、大きく罰する", stars: 5 },
  { name: "二乗平均平方根誤差 RMSE", desc: "定義：MSEの平方根\n特徴：元の単位に戻る、解釈しやすい", stars: 4 },
  { name: "平均絶対値誤差 MAE", desc: "定義：(予測-正解)絶対値の平均\n特徴：外れ値に強い、中央値に対応", stars: 4 },
  { name: "赤池情報量規準 AIC", desc: "定義：-2*対数尤度+2*パラメータ数\n特徴：小さいほど良い、予測精度重視\n親：複雑さにペナルティ与える", stars: 4 },
  { name: "ベイズ情報量規準 BIC", desc: "定義：-2*対数尤度+log(n)*パラメータ数\n特徴：AICよりペナルティ大きい 単純なモデル選びやすい\n親：データ数nが増えるとペナルティ増", stars: 4 },
  { name: "過学習", desc: "定義：訓練データに適合しすぎて汎化性能が低下する現象\n原因：モデル複雑すぎ、データ少なすぎ\n具体例：訓練誤差0.01だがテスト誤差0.5のように乖離\n対策：正則化、交差検証、早期終了、データ拡張、ドロップアウト", stars: 5 },
  { name: "単純パーセプトロン", desc: "定義：入力層+出力層のみ 単層のニューラルネット\nできること：線形分離可能な問題のみ、AND ORは可\nできないこと：XORは不可 1969年Minsky指摘で冬の時代へ", stars: 3 },
  { name: "隠れ層・入力層・出力層", desc: "入力層：データ受け取る層\n隠れ層：中間層、特徴抽出を担う 層が増えると表現力向上\n出力層：結果を出力する層\n流れ：入力→隠れ→出力の順に情報伝達", stars: 5 },
  { name: "多層パーセプトロン MLP", desc: "定義：隠れ層を1層以上持つニューラルネット、3層以上でディープラーニングと呼ぶ\n特徴：非線形分離可能、XORも可 隠れ層増やすと複雑な関数近似可能\n関係：単純パーセプトロンに隠れ層追加", stars: 5 },
  { name: "CPU", desc: "特徴：汎用プロセッサ、逐次処理得意 制御が複雑な処理向け\n前処理などに使用", stars: 3 },
  { name: "GPU", desc: "特徴：並列処理得意、数千コア持つ 行列演算が高速\n理由：ニューラルネットは行列積大量 GPUが学習・推論に適する\n例：NVIDIA製、2012年AlexNetで使用し革命", stars: 5 },
  { name: "TPU", desc: "定義：Google開発、Tensor Processing Unit\n特徴：ディープラーニング専用、さらに高速 行列演算に特化\n関係：GPUよりさらに特化、クラウド提供", stars: 4 },

{ name: "シグモイド関数", desc: "定義：0-1に出力、S字カーブ\n式：1/(1+exp(-x))\n用途：二値分類の出力層で使用\n課題：勾配消失問題起きやすい\n出力が0か1付近で勾配ほぼ0になる", stars: 4 },
  { name: "tanh関数", desc: "定義：-1から1に出力、シグモイドの拡張\n特徴：0中心で学習しやすい\n課題：シグモイド同様勾配消失は起きる\n関係：シグモイドの改良版", stars: 4 },
  { name: "ReLU関数", desc: "定義：x>0ならx、0以下なら0\n最も使われる活性化関数\n利点：計算高速、勾配消失しにくい\n2012年AlexNetで使用され普及\n課題：負の領域で勾配0、死んだReLU問題\n関係：シグモイド・tanhの問題解決", stars: 5 },
  { name: "Leaky ReLU関数", desc: "定義：x>0はx、0以下は0.01xなど小さな勾配\n特徴：ReLUの改良、負でも勾配0にならない\n関係：ReLUの弱点解決、死んだReLU対策", stars: 3 },
  { name: "ソフトマックス関数", desc: "定義：出力を確率に変換、合計1になる\n用途：多クラス分類の出力層\n例：3クラスなら0.7,0.2,0.1のように出力", stars: 5 },
  { name: "勾配消失問題", desc: "定義：層が深くなると勾配が0に近づき学習進まなくなる現象\n原因：シグモイド・tanhは両端で勾配小さい\nそれが積み重なると消失\n対策：ReLU使用、バッチ正規化、ResNetのスキップ結合、適切な初期化", stars: 5 },
  { name: "平均二乗誤差関数 MSE", desc: "定義：(予測-正解)2乗平均\n用途：回帰問題で使用\n特徴：外れ値に弱い、微分可能", stars: 5 },
  { name: "交差エントロピー", desc: "定義：-Σ正解*log(予測)\n用途：分類問題で最も使用される\n特徴：確率分布のずれを測る\n予測が外れるほど大きく罰する\n例：正解1で予測0.1なら-log0.1=2.3で大", stars: 5 },
  { name: "カルバック・ライブラー情報量 KL", desc: "定義：2つの確率分布の違いを測る\n用途：VAE、情報理論で使用\n特徴：非対称、KL(P||Q)とKL(Q||P)は異なる\n関係：交差エントロピー=H(P)+KL(P||Q)", stars: 4 },
  { name: "Contrastive Loss", desc: "定義：似たペアは近く、異なるペアは遠く\n用途：顔認証、類似画像検索\n仕組み：同じ人は距離小さく、違う人はマージン以上離す", stars: 3 },
  { name: "Triplet Loss", desc: "定義：アンカー、ポジティブ、ネガティブの3つ組で学習\n用途：顔認証FaceNetで使用\n仕組み：アンカーとポジティブは近く、アンカーとネガティブは遠くする\n関係：Contrastive Lossの発展版", stars: 3 },
  { name: "正則化", desc: "定義：過学習防ぐための汎用手法総称", stars: 5 },
  { name: "L0正則化", desc: "定義：0でないパラメータ数を罰する\n特徴：最も直接的だが計算困難NP困難\n用途：理論的には理想だが実用少", stars: 2 },
  { name: "L1正則化", desc: "定義：重み絶対値和を罰する項追加\n特徴：スパースになる、不要な重み0になる", stars: 5 },
  { name: "ラッソ回帰", desc: "定義：L1正則化を用いた線形回帰\n特徴：特徴量選択効果、自動で不要特徴削除\n例：100特徴量→10特徴量のみ残る", stars: 4 },
  { name: "L2正則化", desc: "定義：重み2乗和を罰する項追加\n特徴：重みを小さくする、0にはならない", stars: 5 },
  { name: "リッジ回帰", desc: "定義：L2正則化を用いた線形回帰\n特徴：重みを小さく、多重共線性対策\n例：相関高い特徴量あっても安定\n比較：ラッソは0にする、リッジは小さくする", stars: 4 },
  { name: "ドロップアウト", desc: "定義：学習時にランダムにノードを無効化\n仕組み：例えば50%の確率でノード削除、毎回異なるネットワークで学習\n効果：アンサンブル効果、過学習防止\n推論時は全ノード使用、出力は確率で調整\n関係：ニューラルネット特有の正則化", stars: 5 },
  { name: "誤差逆伝播法", desc: "目的・役割：ニューラルネットの重みを効率的に更新するための手法\n順伝播で予測→誤差計算→逆伝播で勾配計算→重み更新という流れ", stars: 2 },
  { name: "連鎖律", desc: "定義：合成関数の微分法則 dy/dx = dy/du * du/dx\n役割：誤差逆伝播の数学的基礎 層が深くても微分を効率的に計算可能\n例：3層あれば各層の微分を掛け合わせて入力層までの勾配を求める", stars: 5 },
  { name: "信用割当問題", desc: "定義：出力の誤差に対して各隠れ層の責任がどれくらいかを割り当てる問題\n解決：誤差逆伝播法が解決、連鎖律で各層の寄与を計算\n例：出力が間違ったときどの隠れ層の重みが悪かったかを特定", stars: 4 },
  { name: "勾配爆発問題", desc: "定義：勾配が指数的に大きくなり発散する現象\n原因：重み初期値大きい、RNNで起きやすい\n対策：勾配クリッピング、適切な初期化、LSTM・GRU使用", stars: 4 },
  { name: "勾配降下法", desc: "定義：勾配の逆方向に重みを更新 w = w - η*勾配\n学習率η：更新幅、大きいと発散 小さいと学習遅い\n課題：局所最適解にハマる、鞍点で止まる 計算コスト高い", stars: 5 },
  { name: "学習率", desc: "定義：重み更新のステップ幅\n重要：大きすぎると発散、小さすぎると学習遅く局所解にハマる\n調整：最初大きく徐々に小さくするのが定石 学習率スケジューリング", stars: 5 },
  { name: "イテレーション", desc: "定義：1回の重み更新", stars: 3 },
  { name: "エポック", desc: "定義：全データを1回使い切ること\n関係：エポックは複数イテレーションから成る\n例：1000データ、バッチ100なら1エポック10イテレーション", stars: 4 },
  { name: "局所最適解", desc: "定義：近傍では最小だが全体では最小でない解\n問題：そこにハマると抜け出せない\n対策：モーメンタム、異なる初期値、SGDのノイズ", stars: 4 },
  { name: "大域最適解", desc: "定義：全体で最も小さい解、真の最適解\n特徴：ディープラーニングでは大域最適解でなくても良い解で十分なことが多い", stars: 4 },
  { name: "鞍点", desc: "定義：ある方向では極小、別方向では極大の点\n問題：勾配0だが最適解ではない、高次元で多数存在\n特徴：ディープラーニングでは局所最適解より鞍点が問題になること多い", stars: 4 },
  { name: "ハイパーパラメータ", desc: "定義：人間が設定するパラメータ、学習率やバッチサイズなど、重みはパラメータ", stars: 5 },
  { name: "グリッドサーチ", desc: "ハイパーパラメータの全組み合わせ試す 確実だが計算コスト大", stars: 3 },
  { name: "ランダムサーチ", desc: "ハイパーパラメータをランダムに試す 効率的、広い範囲探索可能\nその他：ベイズ最適化が効率的", stars: 4 },
  { name: "バッチ学習", desc: "定義：全データで勾配計算して更新\n特徴：安定だが計算コスト大、メモリ大", stars: 3 },
  { name: "確率的勾配降下法 SGD", desc: "定義：1データごとに勾配計算して更新\n特徴：高速、ノイズで局所解脱出可能 ただし収束不安定\n関係：バッチ学習の改良", stars: 5 },
  { name: "ミニバッチ学習", desc: "定義：数十〜数百データごとに更新 現在の主流、バッチとSGDの中間\n特徴：計算効率と安定性のバランス良い 例：バッチサイズ32,64,128がよく使われる\n関係：バッチとSGDの良いとこ取り", stars: 5 },
  { name: "オンライン学習", desc: "定義：データが逐次来るたびに学習\n用途：ストリーミングデータ、逐次更新必要\n関係：SGDと似るがデータが時間と共に来る", stars: 3 },
  { name: "モーメンタム", desc: "定義：過去の勾配の移動平均を考慮 慣性のように振る舞う\n効果：局所解脱出、収束加速、振動抑制\n式：v = μv - η*勾配、μは慣性係数0.9など", stars: 4 },
  { name: "AdaGrad", desc: "定義：パラメータごとに学習率自動調整 よく更新されるパラメータは小さく あまり更新されないパラメータは大きく\n課題：学習進むと学習率が0に近づき止まる", stars: 4 },
  { name: "RMSprop", desc: "定義：AdaGradの改良、勾配2乗の移動平均で調整\n特徴：学習率が小さくなりすぎない\n関係：AdaGradの課題解決", stars: 4 },
  { name: "AdaDelta", desc: "定義：AdaGradの改良、学習率設定不要\n特徴：ハイパーパラメータ少ない", stars: 3 },
  { name: "Adam", desc: "定義：モーメンタム+RMSpropの組み合わせ 現在最も使われる最適化手法\n特徴：学習速い、多くのタスクで良い性能\n関係：モーメンタムとRMSpropの良いとこ取り", stars: 5 },
  { name: "AMSBound", desc: "定義：Adamの改良版", stars: 2 },
  { name: "AdaBound", desc: "定義：AdamからSGDへ徐々に移行\n特徴：Adamの速さとSGDの最終精度の両立狙う", stars: 2 },
  { name: "早期終了", desc: "定義：検証誤差が悪化したら学習止める\n効果：過学習防止、計算コスト削減\n関係：正則化の1つと見なせる", stars: 4 },
  { name: "二重降下現象", desc: "定義：モデル複雑さ増すと一度汎化誤差上がるがさらに複雑にすると再び下がる現象\n特徴：古典的バイアス・バリアンストレードオフと異なる、過剰パラメータ領域", stars: 3 },
  { name: "ノーフリーランチの定理", desc: "定義：すべての問題で万能なアルゴリズムは存在しない\n意味：問題に応じて適切な手法選ぶ必要ある\n関係：ハイパーパラメータ調整や手法選択が重要", stars: 3 },
  { name: "全結合層", desc: "目的・役割：すべての入力と出力を結合 最終的な判断を担う層", stars: 2 },
  { name: "重み", desc: "定義：入力と出力を繋ぐパラメータ\n仕組み：重み*入力の総和を計算\n例：入力3出力2なら重みは3x2=6個\n学習：誤差逆伝播で更新される", stars: 5 },
  { name: "線形関数", desc: "定義：重み付き和、y=Wx+b\n役割：活性化関数と組み合わせて非線形に\n関係：線形関数+活性化関数で1層構成", stars: 3 },
  { name: "パラメータ数", desc: "計算：入力数×出力数+バイアス\n例：入力1000出力100なら100000+100=100100個\n課題：パラメータ数多く過学習しやすい 畳み込み層より多い", stars: 4 },
  { name: "畳み込み操作", desc: "定義：フィルタを画像上でスライドさせて内積を計算する操作\n効果：エッジや模様を検出\n例：3x3フィルタで縦線・横線検出", stars: 5 },
  { name: "フィルタ", desc: "定義：特徴検出する小さな重み行列\n別名：カーネル、カーネルとフィルタは同義\n例：32個のフィルタなら32種類の特徴抽出\n学習：誤差逆伝播でフィルタの中身学習", stars: 5 },
  { name: "カーネル", desc: "定義：フィルタと同義、畳み込みに使う重み\n関係：カーネル=フィルタ、同じもの", stars: 5 },
  { name: "特徴マップ", desc: "定義：畳み込み結果の2次元マップ\n仕組み：1フィルタで1特徴マップ生成 フィルタ32個なら特徴マップ32枚\n例：縦線検出フィルタなら縦線部分が強調されたマップ", stars: 5 },
  { name: "ストライド", desc: "定義：フィルタを動かす幅\n例：ストライド1なら1ピクセルずつ、2なら2ずつ\n効果：大きいと出力サイズ小さくなる、計算量削減", stars: 4 },
  { name: "パディング", desc: "定義：画像周囲を0で埋める操作\n目的：出力サイズ維持、端の情報保持\n例：1ピクセルパディングで3x3フィルタでもサイズ維持", stars: 4 },
  { name: "畳み込みニューラルネットワーク CNN", desc: "定義：畳み込み層を含むネットワーク\n構成：畳み込み→活性化→プーリング→全結合の繰り返し\n用途：画像認識で主流、AlexNet・VGG・ResNetなど", stars: 5 },
  { name: "Dilated Convolution", desc: "定義：フィルタ間に隙間を空ける畳み込み\n効果：パラメータ増やさず受容野広げる\n用途：セマンティックセグメンテーションで使用", stars: 2 },
  { name: "Atrous Convolution", desc: "定義：Dilated Convolutionと同義\n関係：Atrous=Dilated、同じもの別名", stars: 2 },
  { name: "Depthwise Separable Convolution", desc: "定義：Depthwise畳み込み+Pointwise畳み込みに分離\n効果：パラメータ大幅削減、高速化\n用途：MobileNetで使用、スマホ向け軽量化", stars: 3 },
  { name: "全結合と畳み込みの差異", desc: "全結合：全入力と全出力結合、パラメータ多い 位置情報失う、画像では非効率\n畳み込み：局所結合+重み共有、パラメータ少ない 位置情報保持、画像の空間性活用、並進不変性", stars: 2 },
  { name: "バッチ正規化", desc: "定義：ミニバッチごとに平均0分散1に正規化\n仕組み：バッチ内の平均・分散で正規化 学習時はバッチ統計、推論時は移動平均使用\n効果：学習高速化、初期値依存緩和、過学習抑制\n発表：2015年Ioffe&Szegedy、革命的手法\n課題：バッチサイズ小さいと統計不安定", stars: 5 },
  { name: "レイヤー正規化", desc: "定義：1サンプル内の全特徴で正規化\n特徴：バッチサイズに依存しない\n用途：RNN・Transformerで使用、バッチ正規化の欠点解決\n関係：バッチ正規化の代替", stars: 4 },
  { name: "インスタンス正規化", desc: "定義：1サンプル1チャネルごとに正規化\n特徴：チャネルごとに独立に正規化\n用途：スタイル変換で使用、画像のスタイル情報除去", stars: 3 },
  { name: "グループ正規化", desc: "定義：チャネルをグループ分けして正規化\n特徴：バッチ正規化とインスタンス正規化の中間\n用途：バッチサイズ小さい物体検出で有効\n発表：2018年Heら、バッチ正規化の代替として", stars: 3 },
  { name: "正規化の使い分け", desc: "画像分類でバッチ大→バッチ正規化\nRNN・Transformer→レイヤー正規化\nスタイル変換→インスタンス正規化\n物体検出でバッチ小→グループ正規化", stars: 2 },
  { name: "プーリング層", desc: "目的・役割：特徴マップを縮小、計算量削減 位置ずれに対する不変性獲得", stars: 2 },
  { name: "最大値プーリング", desc: "定義：領域内の最大値を取る\n特徴：最も使われる、エッジなど強い特徴保持\n例：2x2領域なら4つの中で最大値1つ残す", stars: 5 },
  { name: "平均値プーリング", desc: "定義：領域内の平均を取る\n特徴：全体の情報を保持、背景情報も残る\n例：2x2領域なら4つの平均を1つに", stars: 4 },
  { name: "グローバルアベレージプーリング GAP", desc: "定義：特徴マップ全体の平均を取る\n効果：全結合層の代わり、パラメータ削減\n用途：ResNetなどで最終層で使用、過学習抑制\n関係：平均値プーリングの全体版", stars: 4 },
  { name: "不変性の獲得", desc: "定義：少し位置ずれても同じ特徴と認識\n仕組み：プーリングで位置情報が曖昧になることで多少ずれても同じ出力\n例：猫が2ピクセルずれても猫と認識\n関係：畳み込みの並進不変性と合わせて重要", stars: 4 },
  { name: "スキップ結合", desc: "目的・役割：勾配消失問題解決、深いネットワーク学習可能に 情報のショートカット、直接伝達", stars: 2 },
  { name: "ResNet", desc: "発表：2015年Heら、ILSVRC優勝\n定義：スキップ結合を用いた152層の深いネットワーク\n特徴：152層でも学習可能、勾配消失解決\n効果：層を深くするほど精度向上、従来は深くすると劣化\n構造：残差ブロックの積み重ね、2-3層ごとにスキップ\n影響：以降のディープラーニングはResNetベースが主流", stars: 5 },
  { name: "回帰結合層", desc: "定義：出力が再び入力に戻る結合を持つ層\n特徴：過去の情報を保持可能、メモリ的役割", stars: 3 },
  { name: "リカレントニューラルネットワーク RNN", desc: "定義：回帰結合層を含むネットワークの総称\n仕組み：時刻tの出力が時刻t+1の入力に使われる 過去の情報を隠れ状態に保持\n用途：時系列データ、自然言語処理、音声認識\n例：「私は昨日〜」の後に「食べた」が来ると予測", stars: 5 },
  { name: "時系列データ", desc: "定義：時間順序に並んだデータ\n例：株価、気温、文章、音声、動画\n特徴：順序が重要、過去が未来に影響\nRNNが適する理由：過去の情報を活用できる", stars: 5 },
  { name: "教師強制", desc: "定義：学習時に正解を次の入力として使う手法\n効果：学習安定化、収束速くなる\n課題：推論時は正解使えないので性能差出る 暴露バイアスとも呼ぶ", stars: 3 },
  { name: "BPTT", desc: "定義：Backpropagation Through Time 時間方向に展開して誤差逆伝播\n仕組み：RNNを時間方向に展開して通常の誤差逆伝播を適用\n課題：長い時系列で勾配消失・爆発起きやすい", stars: 4 },
  { name: "エルマンネットワーク", desc: "定義：隠れ層の出力が次時刻の入力に戻る\n発表：1990年Elman、最も基本的なRNN\n構造：隠れ層→コンテキスト層→隠れ層というループ", stars: 3 },
  { name: "ジョルダンネットワーク", desc: "定義：出力層の出力が次時刻の入力に戻る\n発表：1986年Jordan\n違い：エルマンは隠れ層、ジョルダンは出力層が戻る", stars: 3 },
  { name: "双方向RNN Bidirectional RNN", desc: "定義：過去→未来と未来→過去の2方向から学習\n効果：前後の文脈両方活用、精度向上\n例：「銀行」という単語、前が「川の」なら土手 前が「お金の」なら金融機関と判断\n用途：自然言語処理、音声認識で有効", stars: 4 },
  { name: "ゲート機構", desc: "定義：情報の流れを制御する仕組み\n役割：覚えるべきか忘れるべきか制御\n効果：勾配消失解決、長期記憶可能", stars: 5 },
  { name: "LSTM", desc: "定義：Long Short‑Term Memory\n発表：1997年Hochreiter&Schmidhuber\n構造：入力ゲート：何を記憶するか制御 忘却ゲート：何を忘れるか制御 出力ゲート：何を出力するか制御\n特徴：長期記憶可能、RNNの課題解決\n用途：機械翻訳、音声認識で長年主流", stars: 5 },
  { name: "GRU", desc: "定義：Gated Recurrent Unit\n発表：2014年Choら、LSTMの簡略版\n構造：リセットゲートと更新ゲートの2つ LSTMよりパラメータ少ない\n特徴：LSTMと同等性能で計算効率良い\n関係：LSTMの改良・簡略版", stars: 4 },
  { name: "Attention", desc: "定義：入力のどこに注目すべきかを重み付け\n仕組み：注目度を確率で表現、重要な部分重み大\n例：翻訳で「私は」を訳すとき「I」に強く注目\n効果：長期依存関係の学習改善、解釈性向上", stars: 5 },
  { name: "キー・クエリ・バリュー", desc: "クエリ Query：検索したいもの、質問 例：翻訳で次に訳したい単語の情報\nキー Key：検索対象のラベル、照合用 例：原文の各単語の情報\nバリュー Value：実際の情報、取り出す内容 例：原文の各単語の意味内容\n仕組み：クエリとキーの類似度計算→重み→バリューの重み付き和がAttention出力", stars: 5 },
  { name: "Seq2Seq", desc: "定義：Sequence to Sequence、系列を系列に変換\n構造：エンコーダで入力をベクトル化→デコーダで出力生成\n課題：長い系列で情報圧縮がボトルネック 固定長ベクトルに全部詰め込むので情報損失\n解決：Attentionでこの課題解決 エンコーダの各時刻出力に直接注目可能に", stars: 4 },
  { name: "Source‑Target Attention", desc: "定義：Encoder‑Decoder Attentionとも呼ぶ\n仕組み：デコーダがエンコーダの出力に注目\n用途：機械翻訳で訳すときに原文のどこに注目か\n例：英訳生成時に日本語原文の対応単語に注目", stars: 4 },
  { name: "Self‑Attention", desc: "定義：同じ系列内で自分自身に注目する仕組み\n仕組み：系列内の各要素が他の要素との関係計算\n効果：並列処理可能、長期依存関係得意\n例：「彼は」という代名詞が「太郎」を指す関係学習", stars: 5 },
  { name: "Multi‑Head Attention", desc: "定義：複数のAttentionを並列に実行\n仕組み：異なる観点から注目を計算して統合\n効果：多様な関係性学習可能\n例：1つは文法関係、1つは意味関係など 複数観点で注目", stars: 5 },
  { name: "Transformer", desc: "発表：2017年Vaswaniら Attention Is All You Need\n定義：Attentionのみで構成されたモデル\n構造：エンコーダ：Self‑Attention+フィードフォワード デコーダ：Self‑Attention+Source‑Target Attention\n特徴：RNN使わず並列処理可能で高速学習 長期依存関係得意 現在の自然言語処理の主流、BERT・GPTの基礎\n影響：2017年以降自然言語処理革命", stars: 5 },
  { name: "位置エンコーディング", desc: "定義：単語の位置情報をベクトルに追加\n理由：TransformerはRNNと違い順序情報持たない 位置情報ないと「太郎は花子を」が「花子は太郎を」と同じになってしまう\n方法：sin・cos関数で位置を表現 学習可能な場合もあり", stars: 4 },
  { name: "オートエンコーダ", desc: "自分自身を正解にして学習\n構造：入力→Encoder（低次元化）→潜在空間→Decoder→出力\n狙い：潜在空間に重要な特徴だけを詰め込む\n例：784次元→10次元に圧縮して復元", stars: 5 },
  { name: "オートエンコーダによる次元削減", desc: "オートエンコーダの主な使い道\n従来：PCA 線形のみ\nAE：非線形な削減が可能\n可視化・クラスタリングに使える", stars: 4 },
  { name: "事前学習", desc: "2010年頃の裏技\n深いNNが学習できない時代に\nAEで層ごとに事前学習→重みを初期値に\n勾配消失を緩和に貢献\n本来のタスクの前に学習し、その学習済みの重みを利用すること", stars: 4 },
  { name: "積層オートエンコーダ", desc: "Stacked Autoencoder\nAEを積み重ねる\n1段目の潜在空間を入力に2段目を学習\n事前学習の主役だった歴史的モデル", stars: 3 },
  { name: "変分オートエンコーダ VAE", desc: "生成モデルとしてのAE\n通常AE：潜在空間はただの数値\nVAE：潜在空間を確率分布(正規分布)にする\n損失：再構成誤差 + KLダイバージェンス\n結果：連続補間・生成が可能", stars: 5 },
  { name: "β‑VAE", desc: "VAEの改良版 2017年\n損失：再構成誤差 + β*KLダイバージェンス\nβ>1で正規分布に強く近づける\n効果：Disentangled表現 獲得\n1次元=角度 2次元=太さ のように意味が分離", stars: 4 },
  { name: "VQ‑VAE・info VAE", desc: "VQ‑VAE：潜在空間を離散化 コードブック512個に量子化 高品質生成 DALL‑Eの根幹技術\ninfo VAE：相互情報量を最大化 VAEの情報が消える問題を防ぐ", stars: 4 },
  { name: "データ拡張とは", desc: "Data Augmentation\nデータを水増しして過学習を防ぐ\n画像とテキストで手法が違うのが試験ポイント", stars: 5 },
  { name: "Crop", desc: "切り抜き ズレに強く\n目的：不変性の獲得 最も基本", stars: 2 },
  { name: "Random Flip", desc: "左右反転 対称物体に有効\n目的：不変性の獲得 最も基本", stars: 2 },
  { name: "Rotate", desc: "回転 傾きに強く\n目的：不変性の獲得 最も基本", stars: 2 },
  { name: "Contrast", desc: "明暗の差を変える", stars: 2 },

 { name: "Brightness", desc: "明るさ自体を変える", stars: 1 },
  { name: "Cutout / Random Erasing", desc: "画像の一部を四角く塗りつぶす\nオクルージョン(隠蔽)に強くなる\nRandom Erasingはノイズで埋める亜種\n2017年提案 シンプルで効果高", stars: 4 },
  { name: "Mixup", desc: "2017年 2枚を混ぜる\n画像A0.7 + 画像B0.3 = 新画像\nラベルも0.7:0.3で混ぜる\n効果：決定境界が滑らか 過学習防止\n試験頻出「画像とラベル両方を混ぜる」", stars: 5 },
  { name: "CutMix", desc: "2019年 MixupとCutoutの良いとこ取り\n画像Aの一部を切り取ってBに貼付\nラベルは面積比で混ぜる 7:3\nMixup=画素ブレンド CutMix=領域置換", stars: 5 },
  { name: "Noising", desc: "画像にザラザラノイズを足す\nカメラノイズに強くなる\nテキストでは単語をランダム入れ替え/削除\nスペルミスに強くなる効果", stars: 4 },
  { name: "RandAugment", desc: "2020年 Google 自動最適化\nN個の拡張をMの強さでランダム適用\nパラメータはNとMだけ\n手動より高性能で探索が超簡単\nAutoAugmentの改良で計算コスト1/100", stars: 4 },
  { name: "Paraphrasing", desc: "言い換え\n自然言語のデータ拡張の定番\n同じ意味で違う表現に置き換え水増し\n例：この映画は面白い→この作品は楽しい\nBack Translationとセットで出題されやすい", stars: 4 },


 { name: "形態素解析", desc: "NLPの最初の関門\n文を単語に切るタスク\n例：私は学生です→私/は/学生/です\n日本語は英語と違い分かち書き\nスペース区切りなしのため必須処理\n仕組み：辞書と統計的モデルで最尤な分割を探索\n代表ツール：MeCab 形態素解析のデファクト\n京都大学由来 辞書はIPAdic, NEologd\n他：JUMAN, Sudachi, Janome\n形態素解析後は品詞タグ付与も行う\nビジネス：日本語検索 チャットボット前処理で必須\n試験鉄板：日本語は分かち書きなし→形態素解析必須 MeCab", stars: 4 },
  { name: "構文解析", desc: "文の構造を解析\n主語・述語・修飾関係・係り受けを解析\n文を木構造 構文木で表現\n例：私は公園で本を読む 読むが述語 主語は私 場所は公園で 目的語は本\n種類：①句構造解析：文を名詞句・動詞句など句に分解 ②依存関係解析：単語間の係り受け関係を解析 現在主流\n用途：機械翻訳・質問応答の前処理 意味解析の基礎\nキーワード：文を木構造で 係り受け", stars: 3 },
  { name: "機械翻訳", desc: "ある言語を別言語へ翻訳 NLPの代表的応用\n昔：統計的機械翻訳 SMT 単語や句の翻訳確率を統計的に学習 フレーズベース 大量の対訳コーパス必要 2000年代までの主流\n今：ニューラル機械翻訳 NMT Seq2Seq, Attention, Transformerで翻訳\n2014年 Seq2Seq登場で劇的改善 2017年 Transformer登場でSOTA達成\nGoogle翻訳は2016年からNMTへ完全移行\n評価指標：BLEUスコア\n試験：機械翻訳の代表タスク 統計的→ニューラルへ進化", stars: 5 },
  { name: "情報検索", desc: "大量文書から欲しい文書を探す\n例：Google検索 社内文書検索\n仕組み：クエリ検索語と文書の類似度を計算しランキング\n類似度計算にTF-IDF, BM25\n近年はBERTなど分散表現を使用\n評価指標：適合率Precision 再現率Recall MAP\nビジネス：検索エンジン FAQ検索 類似文書検索\nキーワード：欲しい文書を探す TF-IDF使う", stars: 3 },
  { name: "質問応答", desc: "質問に対して答えを返すAIタスク\n例：Q日本の首都は？→A東京です\n種類：①抽出型：文書中から答えの箇所を抽出 ②生成型：新たに文章を生成して回答\n歴史：BERT以降で激変 精度が人間超え\nSQuAD：Stanford Question Answering Dataset Wikipedia記事から質問応答を学習・評価 SQuAD1.1は抽出型 SQuAD2.0は答えなし問題も含む\nビジネス：チャットボット カスタマーサポート自動化\nポイント：BERT以降で激変 SQuADで評価", stars: 4 },
  { name: "感情分析", desc: "文のポジティブ/ネガティブを判定 別名：センチメント分析 評判分析\n例：この映画最高！→ポジ 最悪だった→ネガ\n3値：ポジ/ネガ/中立 5段階評価なども\n仕組み：辞書ベース 機械学習 近年はBERTで高精度\nビジネス：レビュー分析 アンケート分析 SNS炎上検知\n企業が顧客の声を自動集計\nG検定頻出のNLP応用例\nキーワード：ポジ/ネガ判定 レビュー分析", stars: 4 },
  { name: "文書要約", desc: "長い文書を短く要約\n種類：①抽出型要約：重要文を原文から抜き出し繋げる 例：10文から重要3文を抽出 比較的容易 文法破綻なし ②生成型要約：新たに文章を生成して要約 例：文章を読んで自分の言葉で要約 難易度高 近年Transformerで高精度化\nビジネス：ニュース要約 議事録要約 論文要約\n評価指標：ROUGEスコア\nポイント：抽出型と生成型 長い文を短く", stars: 3 },
  { name: "ワンホットベクトル", desc: "単語表現の最も原始的な方法\n仕組み：語彙数=ベクトルの次元数 1箇所だけ1 他は0\n例：語彙[私,は,学生,猫,犬] 5次元 私=[1,0,0,0,0] 学生=[0,0,1,0,0]\n欠点：①次元が語彙数依存で巨大 数万〜数十万次元で疎 ②意味の近さが分からない 猫と犬は意味近いがベクトルは直交 内積0 意味的類似度を全く表現できない致命的欠点\n現代では使われないが基礎として重要\n試験：1箇所だけ1 意味の近さ分からない", stars: 4 },
  { name: "BoW Bag of Words", desc: "文書表現の基礎 単語の出現回数で文書を表現\n仕組み：文書を単語の出現回数ベクトルで表現\n例：文書 猫が好き 犬が好き→猫:1 犬:1 好き:2\n特徴：単語の集合 袋として扱う 順序情報は無視 私は犬が好きと犬は私が好きが同じ表現になる\n欠点：順序無視 意味の近さ考慮なし 次元巨大\n改良版がTF-IDF\nキーワード：出現回数で表現 順序無視", stars: 3 },
  { name: "n-gram", desc: "BoWの順序無視欠点を緩和\nn個連続の単語を1単位として扱う\n例：文 私は学生です 1-gram：私/は/学生/です 2-gram bigram：私は/は学生/学生です 3-gram trigram：私は学生/は学生です\n特徴：順序をある程度保持可能\nn大きいほど文脈考慮だがデータ疎性増大\n用途：言語モデル 機械翻訳 スペルチェック\nポイント：n個連続を1単位 順序をある程度保持", stars: 3 },
  { name: "TF-IDF", desc: "情報検索・文書表現の最重要基礎 G検定最頻出\nTF-IDF = TF × IDF\nTF Term Frequency：単語の出現頻度 文書内でよく出るほど高い\nIDF Inverse Document Frequency：逆文書頻度 珍しい単語ほど高い\n数式：IDF = log 全文書数 / その単語を含む文書数\n例：the は など全ての文書に出る→IDF低 深層学習など特定文書のみ→IDF高\n効果：珍しい単語ほど高スコア 重要単語を強調\n単なる回数 BoWより文書特徴を的確に表現\n用途：情報検索のランキング 文書類似度 キーワード抽出\n試験鉄板：珍しい単語ほど高スコア→TF-IDF TFは出現頻度 IDFは逆文書頻度", stars: 5 },
  { name: "分散表現 / 単語埋め込み", desc: "現代NLPの土台 全ての基礎 2013年Word2Vecで革命\n旧手法ワンホットの欠点 意味の近さ分からないを解決\n仕組み：単語を低次元 例100〜300次元の密な実数ベクトルで表現\n特徴：意味近い単語はベクトル空間で距離近い\n例：猫と犬は近く 猫と机は遠い\n王 - 男性 + 女性 = 女王 などの類推も可能\n学習：周辺単語から予測する 分布仮説 似た文脈に現れる単語は似た意味\n代表手法：Word2Vec, GloVe, fastTextが基礎\nELMo, BERTで文脈考慮へ進化\n現代NLPは全て分散表現から始まる\n最重要：意味近いと距離近い 現代NLPの土台\nG検定で最も問われるNLP基礎概念", stars: 5 },
  { name: "Word2Vec", desc: "2013年 Google Mikolov\n分散表現の革命、現代NLPの出発点\n単語を低次元密ベクトル300次元へ\n分布仮説「似た文脈は似た意味」\nKing-Man+Woman=Queenが演算で成立\n2013年 Google 鉄板", stars: 5 },
  { name: "CBOW", desc: "Continuous Bag-of-Words\n周囲から中心を予測\n例：私 は です → 学生 を予測\n学習が速い、頻出単語で高精度\nキーワード：周囲から中心、速い", stars: 5 },
  { name: "スキップグラム", desc: "Word2Vec学習法2、CBOWの逆\n中心から周囲を予測\n例：学生 → 私 は です を予測\n精度はCBOWより高い、低頻出に強い\n現在主流 +Negative Sampling\nキーワード：中心から周囲、精度重視", stars: 5 },
  { name: "fastText", desc: "2016年 Facebook Bojanowski\nWord2Vecは未知語に弱い\n文字n-gramに分解\napple → <ap app ppl ple le>\n未知語 綴り間違いに強い\n走る 走った 走ればの類似性\nキーワード：文字n-gram 未知語に強い\n補足：Word2Vecの子、CBOW版とスキップグラム版あり スキップグラム版が有名", stars: 4 },
  { name: "ELMo", desc: "2018年 AllenNLP Peters\n単語1つにベクトル1つ固定の限界\nbank=銀行/土手で同じベクトルの問題\n文脈でベクトル変わる動的表現\n双方向LSTM BiLSTMで実現\n多義性解消、SOTA大幅更新\nRNN時代の最終形態、思想はBERTに影響を与えたが構造は別", stars: 4 },
  { name: "BERT", desc: "2018年 Google Devlin\n現在のNLPはほぼBERT系\nTransformer Encoderのみ\n事前学習：①Masked LM 15%を[MASK]で隠して当てる MLM 例：私は[MASK]です→学生 ②Next Sentence Prediction NSP 2文が連続しているかを判定\nファインチューニングで少量データ学習\nGLUEで人間超え SQuADでも人間超え\n検索エンジン チャットボットで標準\n試験：Masked LM Encoderのみ GLUE人間超え\n構造はELMoとは無関係、思想のみ継承", stars: 5 },
  { name: "LLM 大規模言語モデル", desc: "数百億〜数千億パラメータ規模\n2024年最重要追加 ChatGPTで必須\n①スケール則 パラメータ増で性能向上\n②創発的能力 ある規模超えると新能力獲得\n③Few-shot 例数個提示でタスク対応\nTransformer Decoder系の系統\nLLM共通のリスク・課題：ハルシネーション 嘘生成 バイアス 著作権 計算コスト\n全LLM共通 PaLMもGPTもLLaMAも同じ", stars: 5 },
  { name: "PaLM", desc: "Google 5400億パラメータ\nPathways LM PaLM2へ進化\nFew-shotで高性能 推論能力高い\n試験：PaLMはGoogle", stars: 3 },
  { name: "GPT-3/4", desc: "OpenAI 1750億〜 ChatGPT基盤\n試験：GPTはOpenAI", stars: 5 },
  { name: "LLaMA", desc: "Meta オープンソース\n試験：LLaMAはMeta", stars: 3 },
  { name: "GLUE", desc: "自然言語理解の評価ベンチマーク\n2018年 Wangら 9タスク総称\nSST-2 MRPC MNLIなど\nBERTが人間超えで話題\n後継SuperGLUE", stars: 3 },
  { name: "音声認識", desc: "音声→文字 ASR G検定王道 必ず出る\n例：Siri Alexa OK Google YouTube自動字幕 Zoom文字起こし\n評価：WER Word Error Rate 低いほど良い\n課題：雑音 方言 話者依存に弱い", stars: 5 },
  { name: "音声合成", desc: "文字→音声 TTS 文字を読み上げる\n例：VOICEVOX 初音ミク Googleマップ案内\n評価：MOS 5段階主観評価\nキーワード：文字→音声 読み上げ", stars: 4 },
  { name: "話者識別", desc: "誰が話しているか シラバス表記は話者識別=話者認識\n①識別：事前登録必須。複数人中誰か 会議発言者\n②照合/認証：本人の声を登録しておく。本人か判定 声紋認証\n仕組み：i-vector x-vector 登録声紋と比較\n試験：何を言ったか=音声認識 誰が言ったか=話者識別", stars: 4 },
  { name: "音声の感情分析", desc: "声から感情\n特徴：ピッチ パワー エネルギー 韻律特徴\nビジネス：コールセンター怒り検知 メンタルモニタリング", stars: 3 },
  { name: "音素", desc: "音声の最小単位 物理的な音 これ以上分割不可\n日本語約30個 英語約40個 言語で異なる\n例：「かさ」は/k//a//s//a/の4音素\n音響モデルで音声信号→音素へ変換が基礎\n試験：音声の最小単位 物理的な音 日30英40", stars: 4 },
  { name: "音韻", desc: "音素より抽象的 心理的な音の単位 意味を区別する単位\n音素は物理 音韻は心理的に同じと認識するグループ\n例：助詞「は」は/わ/と発音だが音韻的に同じ扱いも\n試験：音素は物理 音韻は心理 意味を区別", stars: 3 },
  { name: "スペクトル包絡", desc: "FFTスペクトルの外枠 声の個性 声道形状を表す\n詳細ギザギザを無視し大まかな形 外枠\n話者識別に使われる 包絡の違いで誰か判定\n試験：周波数の大まかな形 声の個性 話者識別に使用", stars: 3 },
  { name: "A-D変換", desc: "アナログ電圧変化を一定間隔でサンプリング量子化\nサンプリング周波数：1秒何回 CD44.1kHz 音声認識16kHz\n量子化ビット：振幅何段階 16bit=65536段階\nキーワード：アナログ→デジタル 最初のステップ", stars: 4 },
  { name: "PCM パルス符号変調器", desc: "Pulse Code Modulation 標本化→量子化→符号化 CDはPCM 非圧縮高音質\n試験：A-D変換の代表→PCM CDはPCM", stars: 3 },
  { name: "FFT 高速フーリエ変換", desc: "Fast Fourier Transform 1975年 Cooley-Tukey高速化\n時間軸波形→周波数成分に分解 25ms窓でスペクトログラム作成\n人の声は複数周波数の重ね合わせ FFTで分離\n試験鉄板：波形を周波数に分解 時間→周波数 基本中の基本", stars: 5 },
  { name: "フォルマント / フォルマント周波数", desc: "スペクトル包絡の中で特に強いピークの周波数 共鳴周波数\n第1第2フォルマント位置で母音決まる\nあ：800Hz/1200Hz い：300Hz/2300Hz う：300Hz/800Hz\n試験：母音を特徴付ける→フォルマント 共鳴周波数 ピーク", stars: 4 },
  { name: "メル尺度", desc: "人間の聴覚特性模倣 低周波強調 高周波圧縮\n1000Hzと2000Hz差は大きく感じるが10000と11000差は小さく感じる\nmel=2595*log10(1+f/700) 1000Hz以下線形以上対数\nキーワード：人間の聴覚 高音ほど鈍感", stars: 4 },
  { name: "MFCC メル周波数ケプストラム係数", desc: "一番出る特徴量の王様 G検定最頻出\nMel-Frequency Cepstrum Coefficients ほぼ100%これ使う\n生成5段階丸暗記：①波形→A-D変換 PCM ②窓掛け 25ms ハミング窓 ③FFT 周波数へ ④メルフィルタバンクでメルスペクトログラム+log 人間耳に近づける ⑤DCT離散コサイン変換で12-13次元圧縮→MFCC完成 39次元使用一般的\n試験：特徴量といえばMFCC 波形→FFT→メル→対数→DCT", stars: 5 },
  { name: "HMM（隠れマルコフモデル）", desc: "2010年まで主流\n音素遷移を確率モデル化\n/k/→/a/→/s/→/a/遷移確率+出力確率\n弱点：精度頭打ち\nディープラーニングに敗北 歴史として頻出\nキーワード：伝統的手法 2010年まで主流", stars: 4 },
  { name: "CTC", desc: "Connectionist Temporal Classification\n2014年 Graves\n課題：音声100フレーム vs 文字1文字 長さ不一致を学習可能に\n解決：blankラベル導入 ___あああ___ああ→あ に縮約 アライメント自動学習\n効果：RNN/Transformerでエンドツーエンド学習可能 DeepSpeech Whisper基礎\n試験：長さが違う系列→CTC blankラベル", stars: 4 },
  { name: "WaveNet", desc: "2016年 DeepMind van den Oord 音声合成で革命\n従来：波形連結型 ロボット声\n新：生波形直接生成 自己回帰\nDilated Causal Convolution\n因果：未来見ない\n拡張：1,2,4,8…指数的拡張で広い受容野を少層で実現\n成果：MOSで人間並み 区別困難\n音楽生成にも応用\n試験：音声合成といえばWaveNet 生波形直接生成 Dilated Causal", stars: 5 },


 { name: "DQN", desc: "深層強化学習ブームの火付け役 2013年 DeepMind Mnih\nQ学習+CNN融合 Q値=将来報酬期待値\n入力：ゲーム画面4枚 出力：各ボタンのQ値\n工夫1 経験再生：過去(s,a,r,s')数十万件保存 ランダムミニバッチ 時系列相関除去 データ再利用\n工夫2 ターゲットネットワーク：教師計算NWを固定 数千step毎同期 目標固定で学習安定化\n成果：Atari49中43で人間超え\n試験：DQNの工夫→経験再生とターゲット\nQ学習/行動価値関数Q(s,a)/状態価値関数V(s)：DQNの基礎\nε-greedy方策：DQN標準の探索手法\n割引率γ：Q_target計算で使用", stars: 5 },
  { name: "ダブルDQN", desc: "Q値過大評価対策 2015年 van Hasselt\n問題：max演算でノイズ拾い100点と勘違い\n解決：選択はメインNW 評価はターゲットNWに分離\nQ_target=r+γ Q_target(s', argmax_a Q_main(s',a))", stars: 4 },
  { name: "デュエリングネットワーク", desc: "Q(s,a)=V(s)+A(s,a)に分解 2015年 Wangら\nV：状態自体の良さ 敵いないとV高\nA：その行動が平均よりどれだけ良いか\n効果：Vを全行動で共有 効率UP\n優先度付き経験再生：TD誤差が大きい経験を優先して学習する", stars: 4 },
  { name: "ノイジーネットワーク", desc: "探索改良 2017年 Fortunato\n従来ε-greedyは状態関係なく10%ランダムで無駄\n重み W=μ+σ⊙ε ノイズ加えて賢い探索\n不確実な状態でノイズ大 確実でノイズ小\n重みにノイズを加えると、一貫性のある深い探索ができるから、効率が良い", stars: 3 },
  { name: "Rainbow", desc: "DQN改良7つ統合全部盛り 2017年 Hesselら\n①ダブル②デュエリング③ノイジー④優先度付き経験再生\n⑤多段階学習nステップ報酬⑥分布型Q値分布学習⑦優先度付きはTD誤差大を優先\n試験：全部盛り→Rainbow 7つ統合", stars: 4 },
  { name: "A3C", desc: "Asynchronous Advantage Actor-Critic 2016年 Mnih 非同期並列先駆け\n複数エージェント16個が別環境で同時プレイ 非同期でグローバルNW更新\n経験再生不要 CPUだけで高速\nActor：方策π(a|s) Critic：状態価値V(s) Advantage=Q-Vで分散減少\nAPE-X：A3Cの大規模分散版 2018年 Horganら 360個Actorがデータ収集 1つLearnerが優先度付き経験再生で学習 学習速度数倍高速化", stars: 4 },
  { name: "Agent57", desc: "Atari全57で人間超え初 2020年 DeepMind\n探索困難ゲーム対策 モンテズマの復讐など報酬0問題\n①好奇心探索：珍しい状態に内発的報酬 ②長期短期2方策分離", stars: 3 },
  { name: "PPO", desc: "Proximal Policy Optimization 2017年 SchulmanらOpenAI 現主流\n安定 実装簡単 ハイパラ頑健 初心者でも動く\n方策急変すると崩壊→比率r=π_new/π_oldを[0.8,1.2]にクリッピングで制限\nOpenAI標準 ChatGPTのRLHFでもPPO使用\n試験：現在主流→PPO クリッピングで安定\nPPO：離散も連続もOK（汎用性が高い）\n方策勾配法/Actor-Critic\nDDPG/SAC：連続値制御代表 DDPG=決定論的 SAC=エントロピー正則化で現主流", stars: 5 },
  { name: "AlphaStar", desc: "スタクラ2でプロ超え 2019年 DeepMind\nリアルタイム 不完全情報 広大マップ 長期戦略\n自己対戦を数千TPUで数ヶ月 リーグ学習で多様戦略\n成果：プロ10戦10勝 Top0.2%グランドマスター", stars: 5 },
  { name: "RLHF", desc: "人間フィードバックからの強化学習 ChatGPT核心 2022年 InstructGPT確立\n流れ3ステップ：①人間が2回答見て良い方選ぶランキングデータ収集 ②人間の好み予測する報酬モデル作成 ③その報酬モデルでLLMをPPOで強化学習し高得点回答へ\n結果：有害回答減少 丁寧な回答に\n試験：ChatGPT学習方法→RLHF 人間選好→報酬モデル→PPO\nInstructGPT/ChatGPT：RLHFとセットで試験頻出", stars: 5 },
  { name: "MARL 複数エージェント", desc: "Multi-Agent RL 複数エージェント環境\n協力：共通報酬 OpenAI Five 5人協力\n競争：ゼロサム AlphaStar 1対1\n混合：自動運転複数台協調\n難しさ：相手も学習する非定常環境 定常仮定崩れる→MARL最大の課題\nCTDE：集中学習分散実行 学習時は全員見て 実行時は各々\n手法：MADDPG（連続値向け）/QMIX（協力の報酬分解向け）\nOpenAI Five：Dota2 5対5で世界王者OGに勝利 2019年 OpenAI MARL代表例", stars: 4 },
  { name: "連続値制御", desc: "ロボット制御必須\n離散：上下左右4択 Atari\n連続：ハンドル13.5度 アクセル0.7 関節0.3rad\nDQNは離散のみ 連続対応：DDPG PPO SACエントロピー正則化で主流\n試験：ロボット制御→連続値 DQNは離散のみ", stars: 4 },
  { name: "報酬成形", desc: "Reward Shaping 報酬設計工夫\nゴール100点他0点のスパース報酬では学べない\nゴール近づいたら1点 壁で-1点の密報酬で促進\n注意：報酬ハッキング ゴール手前ウロウロで稼ぎ\n対策：ポテンシャルベース F(s)=γΦ(s')-Φ(s)なら最適不変", stars: 4 },
  { name: "状態表現学習", desc: "生状態を良い表現に変換して効率化\nロボットカメラ84x84x3=21168次元は高次元すぎ→物体位置10次元など低次元に圧縮してから学習\n手法：オートエンコーダ VAE Contrastiveで事前学習 生画像→潜在z", stars: 3 },
  { name: "オフライン強化学習", desc: "2024年注目 環境と相互作用せずログだけで学習\n従来オンラインは試行錯誤失敗しながら\n問題：自動運転で事故りながら学べない 工場ロボット壊れる\n解決：人間運転ログ100万件で学習 環境相互作用なし\n課題：分布シフト 外挿誤差 手法：CQL IQL保守的Q学習\n試験頻出 CQL/IQL：オフラインの外挿誤差対策 保守的Q学習", stars: 4 },
  { name: "残差強化学習", desc: "シラバス明記 追加\n従来制御+強化学習の残差を学習\n既存の良い制御器あり その誤差をRLで補正\n例：PID制御で大まか制御 残りの微調整をRLで学習\n効果：学習高速 安全 ロボット応用で現実的", stars: 3 },
  { name: "sim2real", desc: "Simulation to Real シミュで学習→現実で動かす ロボット必須\n現実1万回転ばせたら壊れる時間かかる危険 シミュなら1秒100回並列化可能\nMuJoCo Isaac Simで学習→現実転移\n課題：Reality Gap シミュ摩擦0.5現実0.3で失敗\nドメインランダマイゼーション：sim2realギャップ対策 2017年 OpenAI シミュ条件を毎回ランダムに変える いろんな条件で学習→現実初見にも頑健", stars: 4 },
  { name: "画像生成", desc: "風景 人物 欠損補完 超解像 データ拡張", stars: 1 },
  { name: "音声生成", desc: "TTS WaveNet 音楽生成", stars: 1 },
  { name: "文章生成", desc: "GPT要約 対話 生成AI核", stars: 1 },
  { name: "AutoEncoder オートエンコーダ", desc: "教師なし代表 入力自身が正解 Encoder x→z圧縮 Decoder z→x'復元\n再構成誤差||x-x'||最小化 zが本質特徴\n用途：次元削減 特徴抽出 異常検知 正常のみ学習 誤差大で異常判定", stars: 4 },
  { name: "自己回帰", desc: "p(x)=Πp(x_i|x_<i) 1要素ずつ順番生成\n長所尤度正確高品質 短所逐次で遅い並列化困難\nPixelCNN WaveNet GPT全て自己回帰\nキーワード：順番に 逐次生成", stars: 4 },
  { name: "GAN", desc: "2014年 Goodfellow G検定最頻出\nGenerator ノイズz→偽G(z) 識別器欺く\nDiscriminator 真xと偽G(z)真偽判定 警察\nmin max E[logD(x)]+E[log(1-D(G(z)))] 区別不能に\nキーワード：生成器と識別器 敵対的学習\nDCGAN：GANにCNN 2015年 Radford 全結合→畳み込み バッチ正規化 ReLU/LeakyReLU 初めて安定64x64高解像度", stars: 5 },
  { name: "pix2pix", desc: "条件付きGAN paired 2016年 Isola\n学習時にペア必須 線画とカラーのペア必要\n線画→カラー 白黒→カラー セグマップ→風景\nGはU-Net スキップ結合で細部保持 DはPatchGAN局所判定\n長所高精度 短所ペア収集コスト高", stars: 4 },
  { name: "CycleGAN", desc: "2017年 Zhu ペア不要 馬群とシマウマ群のみで学習\n核心：サイクル一貫性 x→G(x)→F(G(x))≈x L_cyc=||F(G(x))-x||\n行って戻って元に戻る制約で対応保持\n馬↔シマウマ 夏↔冬 写真↔絵画 2G+2D構成\nキーワード：ペアなし サイクル一貫性 pix2pixと対比頻出", stars: 5 },
  { name: "Diffusion Model", desc: "2020年以降生成AI現主流 Stable Diffusion根幹 GAN超え\n①拡散：画像に徐々にノイズ付加 x0→xT完全ノイズ\n②逆拡散：ノイズから徐々に除去し画像生成 U-Netで予測\n長所：安定 高品質 多様 モード崩壊なし 短所：数十ステップで遅い\n試験：現主流はDiffusion", stars: 5 },
  { name: "NeRF", desc: "Neural Radiance Fields 2020年 3D革命\n2D数枚→3Dシーン 新視点合成\n5D入力 位置x,y,z+視線θ,φ→色密度出力 MLP学習 ボリュームレンダリング\n応用：3D復元 VR AR 自動運転3D地図\nキーワード：2D→3D 新視点合成", stars: 4 },
  { name: "事前学習", desc: "定義：本番タスクの前に大規模データで汎用特徴を先に学習\n例：ImageNet100万枚で「エッジ・目・耳・形」を先に覚える\n流れ：事前学習 → 転移 → ファインチューニング が定石\nキーワード：汎用特徴 先に学習", stars: 5 },
  { name: "事前学習済みモデル", desc: "定義：事前学習済みの使える状態のモデル\n例：画像=ResNet VGG EfficientNet / NLP=BERT GPT / 音声=Wav2Vec\n今の常識：HuggingFaceからDLして使う 自分で0から学習はしない\nキーワード：ResNet BERT ダウンロードして使う", stars: 5 },
  { name: "転移学習・ファインチューニング", desc: "転移学習：別タスクへの知識の流用という考え方全体\nファインチューニング：その実行方法 新データで追加学習\n特徴抽出型：最終層だけ学習 他層は凍結 データ極小時に有効\n全体再学習型：全層を小さい学習率(1/10)で学習 データある程度ある時\n試験：転移学習が概念、ファインチューニングが手法", stars: 5 },
  { name: "自己教師あり学習", desc: "定義：ラベルなしデータから自分で教師信号を作って学ぶ\n仕組み：①マスク言語モデル 文章の一部を隠して当てる ②画像の穴埋め\nなぜ主流？：ラベル付け不要 ネット上の無限データをそのまま使える\n例：BERT=文章15%隠して当てる / GPT=次の単語当てる / MAE=画像75%隠して復元\nキーワード：ラベルなし 自分で問題作る BERT GPT 現主流", stars: 5 },
  { name: "半教師あり学習", desc: "定義：少量のラベルあり + 大量のラベルなしを混ぜて学ぶ\n使い所：ラベル付けコスト高の医療画像など\n違い：自己教師あり=ラベル0 半教師あり=ラベル少し使う\n手法：Pseudo-Labeling Consistency Regularization\nキーワード：少量ラベル + 大量ラベルなし", stars: 4 },
  { name: "Few-shot / One-shot / Zero-shot", desc: "Few-shot：数例(2-5例)で新タスク適応 プロンプトに例を2個入れるだけ\nOne-shot：1例だけで適応\nZero-shot：例0で適応 指示だけでできる CLIPが代表\n試験：GPTのIn-Context LearningはFew-shotの例", stars: 5 },
  { name: "破滅的忘却", desc: "定義：新タスクを学習すると旧タスクの知識を忘れる\n構造：重みが新しいタスク用に上書きされるから\n人間でいう：フランス語勉強したら英語忘れた\n対策：①学習率小 ②一部層凍結 ③Elastic Weight Consolidation\nキーワード：忘れる 上書き 対策は学習率小・凍結", stars: 5 },
  { name: "基盤モデル", desc: "定義：大量データで事前学習された大規模で汎用的なモデル 多タスクに転用可能\n特徴：①大規模 ②汎用的 ③適応性高い Few-shot Zero-shot可能\n例：GPT-3 CLIP DALL-E Flamingo 全て基盤モデル\nキーワード：大規模 汎用的 1つで何でも", stars: 5 },
  { name: "Zero-shot", desc: "定義：学習していない未知タスク・未知カテゴリでも推論できる\n仕組み：大量の画像-テキスト対応を事前学習 意味空間で近いものを探す\n例：CLIPは「カピバラ」を学習してなくても「カピバラという動物」とテキストで言えば画像を当てられる\n違い：Few-shot=数例見る One-shot=1例 Zero-shot=0例で当てる\nキーワード：未知でも推論 例0 CLIP代表", stars: 5 },
  { name: "マルチタスク学習", desc: "定義：1モデルで複数異なるタスクを同時に学習\n仕組み：共通のEncoder + タスク別Head 知識共有で効率化\n利点：①データ効率良い ②汎化性能向上 ③計算効率良い\n例：1モデルで物体検出とキャプション生成とVQAを同時にやる\nUnified-IOはこの究極形\nキーワード：1モデルで複数タスク 知識共有", stars: 4 },
  { name: "Unified-IO", desc: "定義：全タスクを「テキスト生成」に統一する構造 2022年 AllenAI\n仕組み：画像も音声も深度も全部トークン化→同じTransformerで処理→テキストで出力\n凄さ：90以上のタスクを1モデルで扱える 画像認識もNLPも同じモデル\n位置づけ：マルチモーダル×マルチタスクの最終形\nキーワード：全てトークン化 90タスク 1モデル", stars: 4 },
  { name: "CLIP", desc: "Contrastive Language-Image Pre-training\n学習：4億枚の画像とテキストペアで対比学習 近いペアは近づけ 違うペアは離す\n構造：画像Encoder + テキストEncoder 2つの塔\nできること：①Zero-shot画像分類 ②画像検索 ③DALL-Eの部品\n試験：CLIPといえばZero-shot CLIPといえば4億ペア\nキーワード：4億ペア 対比学習 Zero-shot 画像とテキスト対応", stars: 5 },
  { name: "DALL-E / DALL-E 2", desc: "定義：テキストから画像を生成\n構造：DALL-E 1= VQ-VAE + GPT / DALL-E 2= CLIP + Diffusion\n進化：DALL-E→GLIDE→DALL-E 2→DALL-E 3と高画質化\n試験：CLIPが理解担当 DALL-Eが生成担当 兄弟関係\nキーワード：テキスト→画像 CLIP+Diffusion", stars: 5 },
  { name: "Flamingo", desc: "定義：画像数枚とテキストから対話できる視覚言語モデル 80億パラメータ\n特徴：Few-shotでVQA Image Captioningができる\n例：画像2枚見せて「これは何の共通点？」と聞くと答えられる\n違い：CLIP=対応付け DALL-E=生成 Flamingo=対話理解\nキーワード：画像+テキストで対話 Few-shot DeepMind", stars: 4 },
  { name: "Image Captioning キャプション生成", desc: "定義：画像に説明文を付けるタスク\n例：犬の写真→「芝生で走るゴールデンレトリバー」と自動生成\n構造：CNNで画像特徴抽出→RNN/Transformerで文章生成\n応用：視覚障害者支援 画像検索\nキーワード：画像→テキスト 説明文生成", stars: 5 },
  { name: "Text-To-Image", desc: "定義：テキストから画像を生成\n例：「宇宙服を着た猫の油絵」→画像生成\nモデル：DALL-E Stable Diffusion Midjourney Imagen 全てここ\n応用：クリエイティブ広告 デザイン\nキーワード：テキスト→画像 生成AI核", stars: 5 },
  { name: "Visual Question Answering (VQA)", desc: "定義：画像についての質問に答えるタスク\n例：画像を見せて「何匹の犬がいる？」「左の人は何してる？」→「2匹」「スマホを見ている」\n難易度：画像理解+言語理解+推論が必要 最も人間に近いタスク\nモデル：Flamingo BLIP GPT-4Vが得意\nキーワード：画像+質問→答え 推論必要", stars: 5 },

 { name: "なぜブラックボックスを解釈する必要があるか", desc: "①医療・金融・司法など責任が重い分野で「なぜその判断？」を説明必要\n②AI Actなど法律で説明義務化 ③バグ・バイアス発見 ④ユーザー信頼獲得\nブラックボックスのままでは社会実装できない → XAIが必須", stars: 1 },
  { name: "説明可能AI (XAI)", desc: "Explainable AI\n定義：AIの判断根拠を人間が理解できる形で説明する技術・思想の総称\n2つのアプローチ：①透明なモデルを使う ②ブラックボックスを後から説明\nキーワード：ブラックボックスを開く 信頼性 透明性", stars: 5 },
  { name: "CAM", desc: "Class Activation Mapping\n仕組み：GAP層の重みを使って「どこを見て判断したか」をヒートマップ化\n欠点：アーキテクチャ制約あり GAP層必須\nキーワード：GAP必須 ヒートマップ 元祖", stars: 4 },
  { name: "Grad-CAM", desc: "Gradient-weighted CAM\n仕組み：最終畳み込み層の勾配を使ってヒートマップ生成\n利点：①GAP不要 どんなCNNでも使える ②クラス判別的\n試験：CAMとの違いは？→ Grad-CAMはGAP不要で汎用的\nキーワード：勾配でヒートマップ どんなCNNでもOK CAM上位互換", stars: 5 },
  { name: "LIME", desc: "Local Interpretable Model-agnostic Explanations\n仕組み：解釈したい1つの予測の周辺でデータをわざと攪乱させ、単純な線形モデルで近似\n特徴：①モデル非依存 どんなモデルでもOK ②局所的 1個の予測だけを説明\nキーワード：局所的 周辺を攪乱 1個の予測を説明", stars: 5 },
  { name: "Permutation Importance", desc: "定義：ある特徴量をわざとシャッフルして精度がどれだけ下がるかで重要度を測る\n利点：シンプル モデル非依存 大局的 全体傾向がわかる\n欠点：相関ある特徴量があると過小評価される\nキーワード：シャッフルして精度低下で測る 全体的 シンプル", stars: 4 },
  { name: "SHAP", desc: "SHapley Additive exPlanations ゲーム理論のシャープレイ値が理論的裏付け\n仕組み：各特徴量が予測にどれだけ貢献したかを公平に分配して計算\n強み：①理論的根拠が完璧 ②加法性 ③大局的にも局所的にも使える\nLIMEとの違い：LIME=近似で速いが不安定 SHAP=理論的に正確で安定 現場ではSHAPが標準\n試験：SHAPといえばシャープレイ値 加法性\nキーワード：シャープレイ値 理論的に最も正しい 現主流 加法性", stars: 5 },
  { name: "蒸留", desc: "Knowledge Distillation\n仕組み：大きい教師モデル(Teacher)の出力を、小さい生徒モデル(Student)が真似て学習\nポイント：正解ラベルだけでなく「教師の迷い(ソフトターゲット)」も学ぶ\n例：BERT(3億)→DistilBERT(6600万) 精度97%維持で速度60%向上\nキーワード：教師→生徒 ソフトターゲット 大きいモデルから小さいモデルへ", stars: 5 },
  { name: "プルーニング", desc: "Pruning\n仕組み：重みの絶対値が小さい(重要でない)ニューロンや結合を削除\n2種：①非構造化プルーニング 重み単位で削除 ②構造化プルーニング チャネル単位で削除 実用は②\n例：90%の重みを削除しても精度ほぼ維持できることが多い\nキーワード：不要な重み削除 スパース化 枝刈り", stars: 5 },
  { name: "量子化", desc: "Quantization\n仕組み：32bit浮動小数点(float32)→8bit整数(int8)に変換\n効果：サイズ1/4 速度2-4倍 メモリ大幅削減\n2種：①学習後量子化(PTQ) 簡単だが少し精度低下 ②量子化-aware学習(QAT) 学習中に量子化考慮 高精度\n例：スマホで動く全てのAIはint8量子化されている\nキーワード：32bit→8bit サイズ1/4 スマホで動く理由", stars: 5 },
  { name: "宝くじ仮説", desc: "定義：ランダムな巨大ネットワークの中に、最初から高精度な小さい部分ネットワーク(当たり券)が存在する\n衝撃：当たり券だけ取り出して最初から学習すれば、巨大モデルと同等の精度が高速に得られる\n意味：プルーニングの理論的裏付け\nキーワード：当たり券 最初から高精度な部分ネットワークが存在 プルーニングの根拠", stars: 4 },
  { name: "エッジAI", desc: "定義：クラウドではなくスマホ・カメラ・車など端末側でAI推論する\nなぜ必要？：①低遅延 自動運転は0.1秒が命 ②プライバシー 画像をクラウドに送らない ③オフラインでも動く\n要件：軽量化必須 蒸留+量子化+プルーニング全部盛りが基本\n例：iPhone Face ID Tesla自動運転 工場の異常検知カメラ\nキーワード：端末で推論 低遅延 プライバシー 軽量化のゴール", stars: 5 },
  { name: "CRISP-DM", desc: "Cross Industry Standard Process for Data Mining\n①ビジネス理解→②データ理解→③データ準備→④モデリング→⑤評価→⑥展開\n特徴：汎用的 ただしAI本番運用の話がない\nキーワード：6フェーズ ビジネス理解から始まる データマイニング標準", stars: 5 },
  { name: "CRISP-ML", desc: "CRISP-DM + ML + 運用 + 監視\n違い：CRISP-DMに「MLOps・監視・保守」を追加 AIのライフサイクル全体をカバー\n試験：CRISP-DMとの違いは？→ CRISP-MLは運用・監視まで含む\nキーワード：CRISP-DMの進化版 MLOps含む AI版", stars: 5 },
  { name: "PoC", desc: "定義：本格開発の前に小さく試して「本当にできるか」を検証\n流れ：PoCで精度確認→Goなら本開発 PoCで失敗→撤退で損失最小\n失敗パターン：PoC止まり 本番化できない PoCと本番は別物と理解する\nキーワード：小さく試す 本格前の検証 PoC止まりに注意", stars: 5 },
  { name: "MLOps", desc: "Machine Learning Operations DevOpsのML版\n定義：モデルの開発→デプロイ→監視→再学習を自動化・継続的に回す仕組み\nなぜ必要？：モデルは腐る ドリフトする 監視しないと精度劣化して事故る\n要素：CI/CD モデル監視 自動再学習 実験管理\n試験：MLOpsとは？→運用・監視・継続的改善\nキーワード：運用自動化 モデルは腐る 監視・再学習 DevOpsのML版", stars: 5 },
  { name: "ウォーターフォール", desc: "要件定義→設計→実装→テスト→運用と順番に滝のように進む 古典的\n長所：計画明確 短所：変更に弱い AIには不向き AIは試行錯誤多いため", stars: 3 },
  { name: "アジャイル", desc: "小さく作って→試して→直してを高速で繰り返す スクラムが代表\nなぜAIに向く？：AIは不確実性高い 最初に完璧な要件作れない アジャイルでPoCを回す\nキーワード：反復的 高速で回す AIはアジャイルが基本", stars: 5 },
  { name: "Python", desc: "AI開発の標準言語\n理由：ライブラリ豊富 NumPy Pandas Scikit-learn PyTorch TensorFlow全てPython", stars: 5 },
  { name: "Jupyter Notebook", desc: "コードと結果とグラフを1画面で試せる データサイエンティストの必須ツール", stars: 4 },
  { name: "Docker", desc: "「私のPCでは動くのに…」を解決 環境をコンテナで丸ごと配布 再現性確保", stars: 4 },
  { name: "Web API", desc: "作ったAIモデルをWeb経由で他システムから呼べるようにする REST APIが主流", stars: 4 },
  { name: "クラウド", desc: "AWS GCP Azure GPUを従量課金で借りられる 自前でGPU買う時代は終わり", stars: 5 },
  { name: "AIのビジネス活用", desc: "定義：AIを業務改善・新規事業に使うこと\nポイント：AIありきでなく課題ありき 「何を解決するか」から始める", stars: 5 },
  { name: "BPR", desc: "定義：AI導入を機に業務プロセス自体を根本的に作り直す\n例：AIチャットボット導入→単に置き換えでなく 問い合わせフロー自体を再設計\nキーワード：業務自体を作り直す AI導入とセット", stars: 4 },
  { name: "ステークホルダーのニーズ", desc: "AIプロジェクトは関係者が多い 現場・経営・顧客・法務 全員のニーズ把握が必須", stars: 4 },
  { name: "データサイエンティスト", desc: "データ分析・モデル構築の専門家 ただしビジネス理解・エンジニアリングも求められる", stars: 3 },
  { name: "産学連携", desc: "企業と大学が共同でAI研究 最新論文をビジネスに活かす", stars: 3 },
  { name: "オープン・イノベーション", desc: "自社だけでなく他社・スタートアップ・大学の技術を組み合わせて革新", stars: 4 },
  { name: "他企業や他業種との連携", desc: "1社ではデータも人材も足りない 複数社でデータ共有・共同開発が主流に", stars: 3 },
  { name: "アノテーション", desc: "定義：生データにラベル付けする作業 教師データ作成\n課題：①コスト莫大 ②人によってブレる ③品質が精度を決める\n対策：アノテーションツール クラウドソーシング ガイドライン整備\nキーワード：ラベル付け 教師データ作成 コスト大 品質が命", stars: 5 },
  { name: "コーパス", desc: "Corpus 大量の文章を集めたデータベース\n例：Wikipediaコーパス 青空文庫コーパス 対訳コーパス(日英ペア)\n違い：オープンデータセットよりテキスト特化 コーパスといえば言語\nキーワード：言語データの集まり NLPの燃料", stars: 4 },
  { name: "オープンデータセット", desc: "定義：誰でも使える公開データセット\n例：ImageNet COCO MNIST GLUE Wikipedia\n利点：①すぐ試せる ②再現性確保 ③ベンチマークとして比較可能\n注意：商用利用可否 ライセンス確認必須 CC BYなど\nキーワード：公開データ すぐ使える ライセンス確認", stars: 4 },
  { name: "データリーケージ", desc: "Data Leakage 情報漏洩\n定義：本来知り得ない未来の情報やテストデータの情報が訓練データに混入\n例1：テストデータを混ぜて学習→精度100%に見えるが本番でボロ負け\n例2：患者IDが訓練とテストに重複→モデルがIDを覚えてしまう\n結果：過大評価 本番で全く動かない 最悪のバグ\n対策：時系列は時間で分割 IDでグループ分割 特徴量生成のタイミング注意\nキーワード：テスト情報混入 過大評価 本番で失敗 最悪のミス", stars: 5 },
  { name: "平均", desc: "算術平均 全データ足して割る 外れ値に弱い", stars: 5 },
  { name: "中央値", desc: "Median 真ん中の値 外れ値に強い", stars: 4 },
  { name: "最頻値", desc: "Mode 最も頻出する値", stars: 3 },
  { name: "分散", desc: "データのばらつき 平均からの二乗差の平均 大きいほどバラバラ", stars: 5 },
  { name: "標準偏差", desc: "√分散 単位が元と同じで直感的 68-95-99.7%ルール", stars: 5 },
  { name: "度数分布", desc: "ヒストグラムのこと どの値が何回出たか", stars: 3 },
  { name: "外れ値", desc: "平均を歪ませる異常値 中央値やロバストな手法で対処", stars: 4 },
  { name: "移動平均", desc: "時系列を平滑化 株価チャートの基本 ノイズ除去", stars: 3 },
  { name: "確率変数", desc: "偶然で値が決まる変数 サイコロの出目など", stars: 4 },
  { name: "確率分布", desc: "確率変数がどう分布するかの法則全体", stars: 5 },
  { name: "確率密度", desc: "連続値の分布の濃さ 正規分布の曲線の高さ", stars: 3 },
  { name: "条件付き確率", desc: "P(A|B) Bが起きた時のAの確率 ベイズの基本", stars: 5 },
  { name: "期待値", desc: "平均の理論値 サイコロなら3.5", stars: 4 },
  { name: "正規分布", desc: "ガウス分布 山形 平均±σに68%が入る\n自然界の多くがこれ 身長 テストの点数 AIの初期重みも正規分布から", stars: 5 },
  { name: "ベルヌーイ分布", desc: "0/1が1回 コイン投げ1回", stars: 4 },
  { name: "二項分布", desc: "ベルヌーイをn回 コインn回の表の回数", stars: 4 },
  { name: "ポアソン分布", desc: "まれな事象の回数 1時間のアクセス数 地震の回数", stars: 3 },
  { name: "最小二乗法", desc: "回帰の基本 誤差の二乗和を最小に 線形回帰の解法", stars: 5 },
  { name: "最尤法", desc: "尤度を最大にするパラメータを探す 現代MLの基本理念", stars: 5 },
  { name: "帰無仮説", desc: "H0 棄却したい仮説 「差がない」という仮説", stars: 4 },
  { name: "対立仮説", desc: "H1 主張したい仮説 「差がある」\np値<0.05で帰無仮説棄却→対立仮説採択が有意差あり", stars: 4 },
  { name: "相互情報量", desc: "2変数の関連度 相関係数より非線形も捉える", stars: 4 },
  { name: "共分散", desc: "2変数が一緒に増えるか 符号だけでは強さ不明", stars: 4 },
  { name: "相関係数", desc: "共分散を正規化 -1〜1 0.8なら強い正の相関 線形のみ", stars: 5 },
  { name: "偏相関係数", desc: "第3変数の影響を除いた相関 疑似相関を見破る\nアイス売上と溺死数は相関あるが真の原因は気温 気温を除くと相関消える", stars: 4 },
  { name: "疑似相関", desc: "因果がないのに相関あるように見える 気温が隠れた原因\n試験：「相関は因果を意味しない」これが頻出", stars: 5 },
  { name: "ユークリッド距離", desc: "直線距離 √((x1-x2)^2...) k-meansの標準", stars: 5 },
  { name: "マハラノビス距離", desc: "分散を考慮した距離 外れ値検出に強い 単位違ってもOK", stars: 4 },
  { name: "コサイン類似度", desc: "ベクトルの向きの近さ 文書類似度・推薦で主流 -1〜1\n例：TF-IDFベクトルの類似度はコサインで測る 長さでなく方向が大事", stars: 5 },
  { name: "個人情報", desc: "定義：生存個人に関する情報で特定個人を識別できるもの\n事例：氏名+住所、顔写真、メールアドレス、位置情報、Cookieでも他と組み合わせて個人特定できれば個人情報\n試験：防犯カメラの顔は個人情報か→はい", stars: 1 },
  { name: "個人識別符号", desc: "定義：個人を識別する符号\n事例：運転免許証番号、マイナンバー、指紋・顔認証データ、パスポート番号\n個人情報との違い：個人情報は広い概念、個人識別符号は符号に限定", stars: 1 },
  { name: "要配慮個人情報", desc: "定義：差別・偏見を生む恐れがあり特に配慮が必要な情報\n事例：病歴、犯罪歴、人種、信条、性的指向、健康診断結果\nルール：原則本人の同意が必要、オプトアウト不可\n試験：健康アプリの病歴データを取得→要配慮なので同意必須", stars: 1 },
  { name: "個人データ", desc: "定義：個人情報DBを構成する個人情報\n例：Excelの顧客リストで検索できる状態のもの\n個人情報との違い：紙のメモは個人情報だが個人データではない場合も", stars: 1 },
  { name: "保有個人データ", desc: "定義：開示請求等の対象になる個人データ\n要件：6ヶ月以上保有など\n試験：開示請求が来たら→保有個人データなら開示義務あり", stars: 1 },
  { name: "利用目的", desc: "ルール：取得時に特定・公表・通知が必要\n事例：ECサイトで「商品発送のため」と特定→その後マーケティングに使うのは目的外利用でNG、再同意必要", stars: 1 },
  { name: "第三者提供", desc: "ルール：原則本人同意必要\n例外：委託、事業承継、共同利用、オプトアウト手続き\n試験：AI開発会社に顧客データを提供→第三者提供に当たる、同意必要か？", stars: 1 },
  { name: "委託", desc: "定義：業務を外部に委託すること\n特徴：第三者提供には当たらないが監督義務あり\n事例：クラウドサーバーに顧客データを預ける→委託、委託先の安全管理を監督する必要あり、契約書に安全管理措置明記", stars: 1 },
  { name: "匿名加工情報", desc: "定義：特定個人を復元できないように加工した情報\n特徴：公表すれば第三者提供に本人の同意不要\n加工基準：氏名削除、住所は都道府県まで、特異な記述削除、IDは削除\n事例：病院が患者データを匿名加工して製薬会社に提供→同意不要で可能", stars: 1 },
  { name: "仮名加工情報", desc: "定義：他の情報と照合しない限り個人特定できないように加工\n特徴：2022年改正で新設、内部分析・利用は同意不要で可能だが第三者提供は原則禁止、連絡先等の削除必要\n違い：匿名加工は第三者提供OK、仮名加工は内部利用OKというすみ分け\n事例：ECの購買履歴を仮名加工して社内でレコメンドAI学習→同意不要でOK", stars: 1 },
  { name: "GDPR", desc: "定義：EU一般データ保護規則\n特徴：域外適用あり、日本企業でもEU住民のデータを扱えば適用、制裁金は最大2000万ユーロまたは全世界売上4%\n日本法との違い：同意の要件が厳格、データポータビリティ権、忘れられる権利あり\n試験：EU向けサービスで個人情報取得→GDPRも意識する必要あり", stars: 1 },
  { name: "著作物", desc: "定義：思想・感情を創作的に表現したもの\nAIとの関係：AIが自律的に生成したものは著作物ではない、人間が創作的寄与すれば著作物になる可能性\n事例：Midjourneyに「猫」とだけ打って出た絵→創作性なしで著作物ではない可能性、細かくプロンプト工夫・加筆修正すれば著作物になる可能性", stars: 1 },
  { name: "創作性", desc: "定義：個性が表れていること、誰がやっても同じにならない程度の個性\n試験：他人の写真をそのまま学習→創作性なし、自分のアイデアで構図を工夫→創作性あり", stars: 1 },
  { name: "著作権", desc: "定義：著作物を独占できる権利\nAI生成物論点：誰が著作権者か？プロンプトを考えた人？AI開発者？学習データ提供者？→現在は人間の創作的寄与が重要と解釈\n事例：AI生成画像を無断で商用利用→もし著作物なら著作権侵害、著作物でなければ侵害ではない", stars: 1 },
  { name: "AI生成物", desc: "定義：AIが生成した画像・文章・音楽\n論点：著作権の有無、学習元の著作権侵害、生成物が既存著作物に類似した場合の侵害\n試験：AI生成画像が既存の漫画キャラにそっくり→類似性・依拠性あれば著作権侵害になる可能性", stars: 1 },
  { name: "著作権侵害", desc: "要件：類似性+依拠性\nAI学習：学習段階では30条の4で適法になりやすいが、生成段階で既存著作物に類似すれば侵害になる可能性", stars: 1 },
  { name: "利用規約", desc: "定義：データセットやWebサイトの利用条件\n注意：著作権法上適法でも利用規約違反は契約違反になる\n事例：Twitterの利用規約でスクレイピング禁止→著作権はOKでも契約違反で訴えられる可能性", stars: 1 },
  { name: "著作権法30条の4", desc: "条文：著作物に表現された思想・感情を自ら享受しない目的の利用は著作権侵害にならない\n制度趣旨：AI学習・情報解析を促進するため2018年改正\n事例：大量の画像を集めてAIに学習させる→人間が楽しむためではなくAI学習のためなので30条の4で適法\nただし：学習データに海賊版が含まれる場合や、生成物が著作物に類似する場合は別途侵害の可能性\n試験で頻出：AI開発のための情報解析は30条の4で適法か→はい原則適法", stars: 4 },
  { name: "発明", desc: "定義：自然法則を利用した技術的思想の創作\nAI関係：AI自体は発明者になれない、AIを使った発明は人間の発明として特許になる可能性\n事例：AIで新薬候補を発見→人間が課題設定・データ選択していれば発明に該当", stars: 1 },
  { name: "発明者", desc: "ルール：人間に限る、米国でもAIは発明者になれない判決\n試験：AIが発明者と出願→拒絶される", stars: 1 },
  { name: "新規性", desc: "定義：公知でないこと、世界で初めてであること\n注意：学会発表・論文公開前に出願が必要、公開後だと新規性喪失\n事例：学会で発表した翌日に特許出願→新規性なしで拒絶", stars: 1 },
  { name: "進歩性", desc: "定義：当業者が容易に発明できないこと\n事例：既存技術A+Bを単に組み合わせただけ→進歩性なし、AIで最適化しただけ→進歩性なしと判断されることも", stars: 1 },
  { name: "特許権", desc: "特徴：20年独占、アイデアではなく実施を独占、登録が必要\n著作権との違い：著作権は創作で自動発生、特許は出願・審査必要、保護期間も違う\n試験：アルゴリズム自体は特許になるか→ビジネスモデルは特許になりにくいが技術的工夫があれば可能性", stars: 1 },
  { name: "職務発明", desc: "定義：従業員が職務で行った発明\nルール：契約で会社帰属可能、ただし相当の対価・報奨金が必要\n事例：社員が業務中にAIアルゴリズム発明→就業規則で会社帰属と定めていれば会社帰属、報奨金支払い必要", stars: 1 },
  { name: "知的財産権", desc: "総称：特許・著作権・商標・意匠などの総称\nすみ分け：特許=技術、著作権=表現、営業秘密=秘密管理", stars: 1 },
  { name: "営業秘密", desc: "3要件：①秘密管理性（秘密として管理している）②有用性（事業に有用）③非公知性（公知でない）\n事例：顧客リストにパスワードかけてアクセス制限→秘密管理性あり営業秘密に該当、ウェブサイトで公開している顧客リスト→非公知性なしで営業秘密ではない\n効果：不正取得・不正使用は差止・損害賠償請求可能\nAIとの関係：学習データ・モデルは営業秘密に該当することが多い", stars: 1 },
  { name: "限定提供データ", desc: "定義：ID・パスワード等で限定提供されるデータ\n制度趣旨：2018年新設、ビッグデータ保護のため、営業秘密ほど厳格な秘密管理不要だが限定提供されていることが要件\n事例：有料でAPI提供している気象データ→限定提供データ、無料で公開している気象データ→該当しない\n効果：不正取得は違法", stars: 1 },
  { name: "競争制限", desc: "論点：AIによる価格カルテル、アルゴリズムが勝手に談合\n事例：競合のEC2社が同じ価格最適化AIを導入、AIが自動的に高値で協調→人間が意図しなくても独禁法違反の可能性", stars: 1 },
  { name: "公正競争阻害性", desc: "論点：プラットフォームの優越的地位濫用、抱き合わせ\n事例：OS提供会社が自社AIアシスタントを抱き合わせ→公正競争阻害の可能性", stars: 1 },
  { name: "AI・データの利用に関する契約ガイドライン", desc: "概要：経産省が公表、AI開発は4段階（①導入検討②PoC③本開発④運用）に分けて契約すべきと提言\n試験：AI開発の進め方はウォーターフォールではなくPoCを挟むのが推奨", stars: 1 },
  { name: "PoC（契約）", desc: "定義：Proof of Concept 実現可能性検証\n目的：本開発前に精度が出るか、小規模データで試す\n契約：PoCは準委任、失敗しても報酬発生が一般的", stars: 1 },
  { name: "請負契約 vs 準委任契約", desc: "請負：完成責任あり、成果物完成で報酬、瑕疵担保責任あり\n準委任：完成責任なし、努力義務、善管注意義務、AI開発は不確実なので準委任が多い\n事例：精度90%のモデルを作る契約→請負なら90%未達で債務不履行、準委任なら最善尽くせば債務不履行ではない\n試験：AI開発は請負か準委任か→原則準委任が推奨", stars: 1 },
  { name: "NDA", desc: "定義：秘密保持契約\nポイント：秘密情報の定義、目的外使用禁止、期間、漏洩時の措置を明記\nAIでは学習データ・モデルが秘密情報", stars: 1 },
  { name: "精度保証", desc: "論点：AIは100%精度保証できない\n契約実務：精度保証しない、目標精度は努力目標とする、と明記することが多い\n試験：精度100%保証する契約は危険", stars: 1 },
  { name: "保守契約", desc: "定義：運用後のバグ修正・再学習・ドリフト対応の契約\nAI特有：データドリフトで精度低下するので保守が重要", stars: 1 },
  { name: "SaaS", desc: "定義：クラウド経由でAIサービス提供\n特徴：利用規約で提供、SLAで可用性保証、精度保証はしないことが多い", stars: 4 },
  { name: "利用規約（SaaS）", desc: "SaaSでは個別契約ではなく利用規約で提供されることが多い、ユーザーは規約に同意して利用", stars: 1 },
  { name: "データ利用権", desc: "論点：顧客が入力したデータでAIが再学習する場合、そのデータの利用権は誰か\n契約で：顧客データは顧客帰属、匿名化して再学習に使う場合はサービス提供者利用可能、など明記必要", stars: 1 },
  { name: "精度保証（SaaS）", desc: "SaaSでも精度は保証しない、誤認識の責任は負わない、と免責条項を入れることが多い、可用性はSLAで保証", stars: 1 },
  { name: "AI倫理", desc: "定義：AIが守るべき倫理原則\n代表例：OECD AI原則（人間中心、公平性、透明性、頑健性、説明責任）、日本のAI利活用ガイドライン\n試験：AI倫理で共通して議論される事項は？→人間中心、公平性、プライバシー、安全性、透明性、説明責任", stars: 1 },
  { name: "AIガバナンス", desc: "定義：倫理を実現するための組織体制・プロセス・ルール\n例：倫理委員会設置、倫理アセスメント実施、モニタリング体制\n倫理との違い：倫理=原則、ガバナンス=それを実現する仕組み", stars: 1 },
  { name: "価値原則", desc: "定義：AIが尊重すべき根本価値\n例：人間中心、人間の尊厳、持続可能性、多様性・包摂性\nOECD5原則：①包括的成長②人間中心③透明性④頑健性・安全性⑤説明責任", stars: 1 },
  { name: "ハードロー", desc: "定義：法律、罰則あり、強制力あり\n例：個人情報保護法、GDPR、著作権法、EU AI Act\n特徴：違反すると罰金・制裁金", stars: 1 },
  { name: "ソフトロー", desc: "定義：ガイドライン・倫理指針・業界自主規制、罰則なし\n例：総務省AI利活用ガイドライン、経産省契約ガイドライン、企業のAIポリシー\n特徴：強制力はないが事実上の規範、取引先から遵守求められることも\n試験：ソフトローとハードローの違いは？→罰則の有無", stars: 1 },
  { name: "リスクベースアプローチ", desc: "定義：リスクの高低で規制の強弱を変える考え方\nEU AI Actの核：①許容できないリスク（禁止）②高リスク（厳格規制）③限定的リスク（透明性義務）④最小リスク（規制なし）\n事例：採用AIは高リスク→学習データの品質管理、ログ保存、人間の監視義務あり、チャットボットは限定的リスク→AIであることを明示すればOK\n試験頻出：EU AI Actはリスクベースアプローチを採用", stars: 5 },
  { name: "プライバシー・バイ・デザイン", desc: "定義：設計段階からプライバシー配慮を組み込む考え方 7原則\n7原則：①事前対策②デフォルトでプライバシー保護③設計に組み込む④全機能性⑤全ライフサイクル保護⑥透明性⑦ユーザ中心\n事例：カメラ画像AIを開発する時に、最初から顔をぼかす処理を入れる、取得前にプライバシー影響評価を行う\n試験：後付けではなく設計段階から配慮するのがPbD", stars: 1 },

 { name: "カメラ画像利活用ガイドブック", desc: "定義：総務省・経産省が公表、防犯カメラ・AIカメラのプライバシー配慮\n内容：①事前に利用目的を掲示②顔の特定を避ける措置③第三者提供時は配慮④問い合わせ窓口設置\n事例：商店街の防犯カメラで来店者分析AI→入口に「カメラで分析しています」と掲示、顔は特定せず人数カウントのみ\n試験：カメラ画像でプライバシー配慮すべき事項は？→掲示、特定回避", stars: 1 },
  { name: "アルゴリズムバイアス", desc: "定義：AIが差別的な結果を出すこと\n代表事例：①米Amazon採用AIが女性を低評価 ②COMPAS再犯予測AIが黒人を高リスク判定 ③顔認識AIが有色人種の認識精度低い\n原因：学習データの偏り、代理変数の使用、目的関数の偏り\n試験頻出：バイアスの具体例を説明できるか", stars: 1 },
  { name: "データの偏り", desc: "定義：学習データが特定属性に偏っている\n例：医師画像データが男性ばかり→女性医師を認識できない、英語データばかりで学習→日本語の精度低い", stars: 1 },
  { name: "サンプリングバイアス", desc: "定義：収集過程での偏り\n例：昼間だけカメラでデータ収集→夜間のデータなし、スマホアプリ利用者だけアンケート→高齢者の意見なし", stars: 1 },
  { name: "センシティブ属性", desc: "定義：差別に繋がりやすい属性\n例：人種、性別、宗教、性的指向、政治信条、病歴\nルール：原則直接入力すべきでない、公平性配慮で削除・補正が必要\n試験：センシティブ属性をそのまま学習に使うのは公平性上NG", stars: 1 },
  { name: "代理変数", desc: "定義：センシティブ属性と相関する変数、直接センシティブ属性を使わなくても代理で差別してしまう\n代表例：①郵便番号→人種の代理（米国）②年収・学歴→性別の代理 ③顔写真→人種・性別の代理\n事例：性別を削除しても、趣味や職歴から性別を推測して差別してしまう\n対応：代理変数も特定して除去・補正が必要、相関分析で発見\n試験頻出：代理変数の例として郵便番号", stars: 4 },
  { name: "公平性の定義", desc: "定義：公平性には複数の定義があり両立不可能\n主要定義：①Demographic Parity（人口比で平等）②Equalized Odds（真陽性率が平等）③Equal Opportunity（機会の平等）\nジレンマ：Demographic Parityを満たすとEqualized Oddsが崩れることがある、どの定義を採用するかは社会合意が必要\n試験：公平性の定義は1つではない", stars: 1 },
  { name: "公平性対応技術", desc: "①前処理：データの偏り補正（アンダーサンプリング、オーバーサンプリング、重み付け）\n②学習時：公平性制約付き学習（公平性を目的関数に入れる）\n③後処理：閾値調整（グループごとに閾値を変える）\n事例：男女で採用閾値を変えて公平性確保", stars: 1 },
  { name: "Adversarial Attack / Adversarial Examples", desc: "定義：人間には分からない微小ノイズでAIを誤認識させる攻撃\n手口：画像に1ピクセルだけ変える、人間には同じに見えるがAIはパンダをテナガザルと誤認識\n種類：①白箱攻撃 ②黒箱攻撃\n事例：自動運転の停止標識にシールを貼る→AIが速度標識と誤認識、顔認証にメガネ→他人と誤認識\n対策：敵対的サンプルで再学習、入力の平滑化、検出モデル\n試験：Adversarial Examplesとは人間には分からない微小な摂動で誤認識させるサンプル", stars: 2 },
  { name: "データ汚染 Data Poisoning", desc: "定義：学習データに悪意あるデータを混入させて精度低下・バックドア仕込み\n手口：Wikipedia改ざん、大量の誤ラベルデータを混入\n違い：Adversarial Attackは推論時攻撃、データ汚染は学習時攻撃\n事例：スパムフィルタの学習データに正常メールをスパムとして混入→正常メールがスパム判定", stars: 1 },
  { name: "モデル汚染", desc: "定義：学習済みモデルにバックドアを仕込む\n手口：特定トリガーがあると誤動作するようにモデル改ざん\n事例：特定パターンのマスクをすると顔認証を突破できるモデルを配布", stars: 1 },
  { name: "データ窃取 Data Extraction", desc: "定義：APIを大量に叩いて学習データを復元する攻撃\n手口：プロンプトインジェクション、言語モデルから個人情報を引き出す\n事例：ChatGPTに住所を聞くと学習データの住所を答えてしまう", stars: 1 },
  { name: "モデル窃取 Model Stealing", desc: "定義：APIからモデルをコピーする攻撃\n手口：大量の入出力ペアを集めて類似モデルを学習\n事例：有料画像認識APIを大量に叩いて同じ性能の無料モデルを作成", stars: 1 },
  { name: "セキュリティ・バイ・デザイン", desc: "定義：設計段階からセキュリティ配慮を組み込む\n例：最初から入力バリデーション、ログ保存、権限管理を設計", stars: 1 },
  { name: "ディープフェイク", desc: "定義：AIで偽の動画・音声・画像生成\n悪用例：①フェイクポルノ ②なりすまし詐欺（社長の声で送金指示） ③政治的偽動画\n対策：検出AI、透かし技術、メディアリテラシー\n試験：ディープフェイクのリスクは肖像権・名誉毀損・詐欺", stars: 1 },
  { name: "フェイクニュース", desc: "定義：AIで大量の偽記事・偽レビュー生成\n悪用例：LLMで偽ニュース生成、SNSで自動拡散、選挙介入\n対策：ファクトチェック、生成AIの透かし、プラットフォームの規制\n民主主義への影響：フィルターバブルと組み合わさり世論操作", stars: 1 },
  { name: "説明可能性 Explainability", desc: "定義：なぜAIがその判断をしたか人間が理解できること\n必要性：①GDPRで自動決定の説明を求める権利 ②医療・金融・採用など高リスク領域で必須 ③ブラックボックスでは責任追及できない\n技術：LIME、SHAP、Grad-CAM\n事例：融資AIが否決した理由を「年収と勤続年数が基準未満」と説明\n試験：説明可能性が必要なユースケースは医療・金融・採用・司法など", stars: 1 },
  { name: "ブラックボックス", desc: "定義：内部が見えないAI\n例：ディープラーニングは数百万パラメータでなぜその出力になったか人間が追えない\n問題：責任所在不明、バイアス検出困難\n対策：説明可能AI（XAI）", stars: 1 },

];

// ★が1つでもある用語を抽出
const targetTerms = allTerms.filter(term => term.stars >= 1);

// DOM要素
const termDisplay = document.getElementById('termDisplay');
const starsDisplay = document.getElementById('starsDisplay');
const answerDisplay = document.getElementById('answerDisplay');
const termCount = document.getElementById('termCount');
const randomBtn = document.getElementById('randomBtn');
const answerBtn = document.getElementById('answerBtn');

let currentIndex = -1;

// 件数表示
termCount.textContent = `登録用語：${targetTerms.length} 件`;

// ★を表示用に変換
function getStars(count) {
  return '★'.repeat(count);
}

// ランダム選択
function showRandomTerm() {
  let newIndex;
  do {
    newIndex = Math.floor(Math.random() * targetTerms.length);
  } while (newIndex === currentIndex && targetTerms.length > 1);
  
  currentIndex = newIndex;
  const term = targetTerms[currentIndex];
  
  termDisplay.textContent = term.name;
  starsDisplay.textContent = getStars(term.stars);
  answerDisplay.classList.remove('show');
  answerDisplay.textContent = '';
  answerBtn.disabled = false;
}

// 回答表示/非表示
function toggleAnswer() {
  if (currentIndex === -1) return;
  answerDisplay.classList.toggle('show');
  answerDisplay.textContent = targetTerms[currentIndex].desc;
}

// イベント
randomBtn.addEventListener('click', showRandomTerm);
answerBtn.addEventListener('click', toggleAnswer);

</script>
