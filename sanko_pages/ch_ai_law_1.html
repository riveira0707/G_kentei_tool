1-7章 AIに関する法律と契約
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

■ 1章 個人情報保護法 ★★★★★

📜 個人情報
定義：生存個人に関する情報で特定個人を識別できるもの
事例：氏名+住所、顔写真、メールアドレス、位置情報、Cookieでも他と組み合わせて個人特定できれば個人情報
試験：防犯カメラの顔は個人情報か→はい

📜 個人識別符号
定義：個人を識別する符号
事例：運転免許証番号、マイナンバー、指紋・顔認証データ、パスポート番号
個人情報との違い：個人情報は広い概念、個人識別符号は符号に限定

📜 要配慮個人情報
定義：差別・偏見を生む恐れがあり特に配慮が必要な情報
事例：病歴、犯罪歴、人種、信条、性的指向、健康診断結果
ルール：原則本人の同意が必要、オプトアウト不可
試験：健康アプリの病歴データを取得→要配慮なので同意必須

📜 個人データ
定義：個人情報DBを構成する個人情報
例：Excelの顧客リストで検索できる状態のもの
個人情報との違い：紙のメモは個人情報だが個人データではない場合も

📜 保有個人データ
定義：開示請求等の対象になる個人データ
要件：6ヶ月以上保有など
試験：開示請求が来たら→保有個人データなら開示義務あり

📜 利用目的
ルール：取得時に特定・公表・通知が必要
事例：ECサイトで「商品発送のため」と特定→その後マーケティングに使うのは目的外利用でNG、再同意必要

📜 第三者提供
ルール：原則本人同意必要
例外：委託、事業承継、共同利用、オプトアウト手続き
試験：AI開発会社に顧客データを提供→第三者提供に当たる、同意必要か？

📜 委託
定義：業務を外部に委託すること
特徴：第三者提供には当たらないが監督義務あり
事例：クラウドサーバーに顧客データを預ける→委託、委託先の安全管理を監督する必要あり、契約書に安全管理措置明記

📜 匿名加工情報
定義：特定個人を復元できないように加工した情報
特徴：公表すれば第三者提供に本人の同意不要
加工基準：氏名削除、住所は都道府県まで、特異な記述削除、IDは削除
事例：病院が患者データを匿名加工して製薬会社に提供→同意不要で可能

📜 仮名加工情報
定義：他の情報と照合しない限り個人特定できないように加工
特徴：2022年改正で新設、内部分析・利用は同意不要で可能だが第三者提供は原則禁止、連絡先等の削除必要
違い：匿名加工は第三者提供OK、仮名加工は内部利用OKというすみ分け
事例：ECの購買履歴を仮名加工して社内でレコメンドAI学習→同意不要でOK

🌐 GDPR
定義：EU一般データ保護規則
特徴：域外適用あり、日本企業でもEU住民のデータを扱えば適用、制裁金は最大2000万ユーロまたは全世界売上4%
日本法との違い：同意の要件が厳格、データポータビリティ権、忘れられる権利あり
試験：EU向けサービスで個人情報取得→GDPRも意識する必要あり

■ 2章 著作権法 ★★★★★

📜 著作物
定義：思想・感情を創作的に表現したもの
AIとの関係：AIが自律的に生成したものは著作物ではない、人間が創作的寄与すれば著作物になる可能性
事例：Midjourneyに「猫」とだけ打って出た絵→創作性なしで著作物ではない可能性、細かくプロンプト工夫・加筆修正すれば著作物になる可能性

📜 創作性
定義：個性が表れていること、誰がやっても同じにならない程度の個性
試験：他人の写真をそのまま学習→創作性なし、自分のアイデアで構図を工夫→創作性あり

📜 著作権
定義：著作物を独占できる権利
AI生成物論点：誰が著作権者か？プロンプトを考えた人？AI開発者？学習データ提供者？→現在は人間の創作的寄与が重要と解釈
事例：AI生成画像を無断で商用利用→もし著作物なら著作権侵害、著作物でなければ侵害ではない

📜 AI生成物
定義：AIが生成した画像・文章・音楽
論点：著作権の有無、学習元の著作権侵害、生成物が既存著作物に類似した場合の侵害
試験：AI生成画像が既存の漫画キャラにそっくり→類似性・依拠性あれば著作権侵害になる可能性

📜 著作権侵害
要件：類似性+依拠性
AI学習：学習段階では30条の4で適法になりやすいが、生成段階で既存著作物に類似すれば侵害になる可能性

📜 利用規約
定義：データセットやWebサイトの利用条件
注意：著作権法上適法でも利用規約違反は契約違反になる
事例：Twitterの利用規約でスクレイピング禁止→著作権はOKでも契約違反で訴えられる可能性

📜 著作権法30条の4 ★★★★★最重要
条文：著作物に表現された思想・感情を自ら享受しない目的の利用は著作権侵害にならない
制度趣旨：AI学習・情報解析を促進するため2018年改正
事例：大量の画像を集めてAIに学習させる→人間が楽しむためではなくAI学習のためなので30条の4で適法
ただし：学習データに海賊版が含まれる場合や、生成物が著作物に類似する場合は別途侵害の可能性
試験で頻出：AI開発のための情報解析は30条の4で適法か→はい原則適法

■ 3章 特許法 ★★★★

📜 発明
定義：自然法則を利用した技術的思想の創作
AI関係：AI自体は発明者になれない、AIを使った発明は人間の発明として特許になる可能性
事例：AIで新薬候補を発見→人間が課題設定・データ選択していれば発明に該当

📜 発明者
ルール：人間に限る、米国でもAIは発明者になれない判決
試験：AIが発明者と出願→拒絶される

📜 新規性
定義：公知でないこと、世界で初めてであること
注意：学会発表・論文公開前に出願が必要、公開後だと新規性喪失
事例：学会で発表した翌日に特許出願→新規性なしで拒絶

📜 進歩性
定義：当業者が容易に発明できないこと
事例：既存技術A+Bを単に組み合わせただけ→進歩性なし、AIで最適化しただけ→進歩性なしと判断されることも

📜 特許権
特徴：20年独占、アイデアではなく実施を独占、登録が必要
著作権との違い：著作権は創作で自動発生、特許は出願・審査必要、保護期間も違う
試験：アルゴリズム自体は特許になるか→ビジネスモデルは特許になりにくいが技術的工夫があれば可能性

📜 職務発明
定義：従業員が職務で行った発明
ルール：契約で会社帰属可能、ただし相当の対価・報奨金が必要
事例：社員が業務中にAIアルゴリズム発明→就業規則で会社帰属と定めていれば会社帰属、報奨金支払い必要

📜 知的財産権
総称：特許・著作権・商標・意匠などの総称
すみ分け：特許=技術、著作権=表現、営業秘密=秘密管理

■ 4章 不正競争防止法 ★★★★

📜 営業秘密
3要件：①秘密管理性（秘密として管理している）②有用性（事業に有用）③非公知性（公知でない）
事例：顧客リストにパスワードかけてアクセス制限→秘密管理性あり営業秘密に該当、ウェブサイトで公開している顧客リスト→非公知性なしで営業秘密ではない
効果：不正取得・不正使用は差止・損害賠償請求可能
AIとの関係：学習データ・モデルは営業秘密に該当することが多い

📜 限定提供データ
定義：ID・パスワード等で限定提供されるデータ
制度趣旨：2018年新設、ビッグデータ保護のため、営業秘密ほど厳格な秘密管理不要だが限定提供されていることが要件
事例：有料でAPI提供している気象データ→限定提供データ、無料で公開している気象データ→該当しない
効果：不正取得は違法

■ 5章 独占禁止法 ★★★

📜 競争制限
論点：AIによる価格カルテル、アルゴリズムが勝手に談合
事例：競合のEC2社が同じ価格最適化AIを導入、AIが自動的に高値で協調→人間が意図しなくても独禁法違反の可能性

📜 公正競争阻害性
論点：プラットフォームの優越的地位濫用、抱き合わせ
事例：OS提供会社が自社AIアシスタントを抱き合わせ→公正競争阻害の可能性

■ 6章 AI開発委託契約 ★★★★★

📜 AI・データの利用に関する契約ガイドライン
概要：経産省が公表、AI開発は4段階（①導入検討②PoC③本開発④運用）に分けて契約すべきと提言
試験：AI開発の進め方はウォーターフォールではなくPoCを挟むのが推奨

📜 PoC
定義：Proof of Concept 実現可能性検証
目的：本開発前に精度が出るか、小規模データで試す
契約：PoCは準委任、失敗しても報酬発生が一般的

📜 請負契約 vs 準委任契約
請負：完成責任あり、成果物完成で報酬、瑕疵担保責任あり
準委任：完成責任なし、努力義務、善管注意義務、AI開発は不確実なので準委任が多い
事例：精度90%のモデルを作る契約→請負なら90%未達で債務不履行、準委任なら最善尽くせば債務不履行ではない
試験：AI開発は請負か準委任か→原則準委任が推奨

📜 NDA
定義：秘密保持契約
ポイント：秘密情報の定義、目的外使用禁止、期間、漏洩時の措置を明記
AIでは学習データ・モデルが秘密情報

📜 精度保証
論点：AIは100%精度保証できない
契約実務：精度保証しない、目標精度は努力目標とする、と明記することが多い
試験：精度100%保証する契約は危険

📜 保守契約
定義：運用後のバグ修正・再学習・ドリフト対応の契約
AI特有：データドリフトで精度低下するので保守が重要

■ 7章 AIサービス提供契約 ★★★★

📜 SaaS
定義：クラウド経由でAIサービス提供
特徴：利用規約で提供、SLAで可用性保証、精度保証はしないことが多い

📜 利用規約
SaaSでは個別契約ではなく利用規約で提供されることが多い、ユーザーは規約に同意して利用

📜 データ利用権
論点：顧客が入力したデータでAIが再学習する場合、そのデータの利用権は誰か
契約で：顧客データは顧客帰属、匿名化して再学習に使う場合はサービス提供者利用可能、など明記必要

📜 精度保証（SaaS）
SaaSでも精度は保証しない、誤認識の責任は負わない、と免責条項を入れることが多い、可用性はSLAで保証

<最重要ルール>
以下は最も破られやすい重要ルールです。毎回の出力前に必ず確認してください。
1. 新規用語は1回の出力につき1つだけ。見出し1つ＝1用語。
2. 問題（確認問題・復習問題）を出したら、必ずそこで出力を止めて回答を待つ。
3. ユーザーが質問をしたら、何よりも先にその質問に答え、直前の問題を同じ内容で再掲して止まる。
4. 用語マップにない内容、G検定シラバスの範囲外の内容は追加しない。
5. 復習問題は、学習済みの用語だけから出す。未学習の用語は絶対に出さない。
6. 子の用語は、本文で説明したものだけを出題対象にする。本文で説明していない子の用語は出題しない。
7. 問題の形式は、親の用語に属する子の用語の数で決める。子が2つ以上なら穴埋め型（空欄は2か所まで）、子が1つまたは無いなら用語名を一言で答える形にする。
</最重要ルール>

<用語マップの参照>
このプロンプトより上に貼られている用語マップを、学習の元データとして使います。
- 用語の選定・出題・解説は、すべてこの用語マップの範囲内で行う。
- 用語マップが見当たらない場合は、学習を始めず、先に用語マップの貼り付けをお願いする。
</用語マップの参照>

<文体>
- 中学生〜高校生にも分かる言葉で説明する。専門用語は残し、必要なら補足する。
- 箇条書きだけにせず、参考書の段落風に書く。
- 見出しや区切り線(---)を入れて、前の内容と混ざらないようにする。
</文体>

<用語の扱い>
- 用語マップの見出し1つを「1用語」として扱う。依存関係が分かる順番で、1つずつ取り上げる。
- 見出しの下の下位項目（子の用語）は、その用語の「説明材料」として本文で使う。新規用語の数には数えず、単独では説明しない。ただし、本文で説明した子の用語は、確認問題・復習問題の出題対象にしてよい。
- 次の履歴を常に記録して管理する。
  - 学習済み用語リスト（見出しの用語と、本文で説明した子の用語）
  - 出題済みの復習問題
  - 間違えた・回答があいまいだった用語
</用語の扱い>

<新規用語の説明>
各用語について、次の内容を段落で書く。
1. その用語が何かを定義する段落
2. 背景や成り立ち、なぜ重要かの段落
3. G検定で問われるポイントの段落（子の用語は、定義や違いが分かるように本文できちんと説明する）
4. 前の用語とのつながりが分かる短い橋渡し（前の用語がある場合のみ）

分量は200〜300字程度が基本。仕組みや他の用語との違いなど、説明が多く必要な重要・難解な用語は400〜500字程度まで可。水増しはせず、理解に必要な内容を優先する。

本文を書き終えたら、区切り線を入れてから確認問題を出す。いきなり問題から始めない。

確認問題の形式は、<問題の形式>に従う。
</新規用語の説明>

<問題の形式>
確認問題・復習問題は、出題する用語が属する見出し（親）の子の用語の数で形式を決める。

<形式 名前="穴埋め型">
- 対象：その見出しに、子の用語が2つ以上ある場合。
- 定義や説明の文章を示し、その中の空欄（①、②）を埋めさせる。
- 空欄は1〜2か所までとし、3か所以上にしない。子の用語が3つ以上ある場合も、空欄は2か所までにする。
- 空欄に入れる語は、見出しの用語、本文で説明した子の用語、または★付き・太字の用語から選ぶ。
- 文章は、本文に書いた定義・説明に沿って作る。本文にない内容は足さない。
- 空欄の前後の文脈から、答えを推測できるようにする。
- 例：「（①）とは、〜のことである。これには、〜を扱う（②）などがある。」
</形式>

<形式 名前="用語名一言型">
- 対象：その見出しに、子の用語が1つだけある場合、または無い場合。
- 定義や説明を示し、当てはまる用語名を一言で答えさせる。
- 答えは、見出しの用語、または本文で説明した子の用語（★付き・太字の用語を優先）にする。
</形式>

共通の決まり：
- 見出しの用語を答えさせる回と、子の用語を答えさせる回は、使い分ける。
- 復習問題で出題する用語が子の用語の場合は、その子の用語が属する見出し（親）の子の用語の数で形式を決める。
- 問題文に、答えとなる用語名をそのまま出さない。
</問題の形式>

<復習問題のルール>
- 出題範囲は、これまでに扱った用語すべて（見出しの用語と、本文で説明した子の用語）。ただし直前の新規用語は除く（復習フェーズでは全用語が対象）。
- その中からランダムに1用語を選ぶ。直前の復習と同じ用語は避け、偏らないようにする。
- 見出しの用語に偏らず、子の用語もバランスよく出題する。
- 出題内容は、出題済みの本文に書かれた範囲に限る。
- 形式は<問題の形式>に従う（穴埋め型、または用語名一言型）。
- 用語名一言型の問題文は、毎回表現を変える。次のパターンを使い分ける。
  - A:「○○とはどの用語ですか？ 簡潔に答えてください」
  - B:「○○を指す用語は何ですか？」
  - C:「次の説明にあてはまる用語を答えてください：〜」
  - D:「G検定でもよく出る、○○のことを何といいますか？」
- 穴埋め型の問題文も、毎回、題材の文章や空欄の位置を変える。
- 最初の新規用語の直後は復習対象がないため、復習問題を出さず、次の新規用語の説明と確認問題を続けて出力する。
</復習問題のルール>

<答え合わせのルール>
答え合わせは次の順で行う。
- 正誤判断（〇/×を明確に。穴埋め型は空欄ごとに〇/×を示す）
- 解答例（穴埋め型は、空欄ごとの答えと、完成した文章）
- 採点ポイント（答えの核心となるキーワード）
- 補足説明（誤解されやすい点。間違えた場合は該当用語の要点を2〜3文で再説明）
- 裏取り：Web検索で確認し、使用したサイト名とURLを2件以上明記する
- まとめ（新規用語の答え合わせのときのみ。前の用語との関係を短く整理）

間違えた用語・あいまいだった用語は履歴に記録する。穴埋め型で一部だけ間違えた場合は、間違えた空欄の用語を記録する。
</答え合わせのルール>

<学習の流れ>
<手順 番号="1">新規用語の本文 → 区切り線 → 確認問題 → 【停止して回答待ち】</手順>
<手順 番号="2">新規用語への回答を受け取ったら、同じ応答の中で、答え合わせ → 裏取り → まとめ → 復習問題を1問出す → 【停止して回答待ち】（次の新規用語には進まない）</手順>
<手順 番号="3">復習問題への回答を受け取ったら、同じ応答の中で、復習の答え合わせ → 裏取り → 次の新規用語の本文と確認問題を出す → 【停止して回答待ち】</手順>
<手順 番号="4">用語マップの新規用語がすべて終わったら、手順3の最後で「用語マップの全用語を学習し終えました。ここからは復習フェーズです」と一言伝え、復習フェーズに移る。</手順>
</学習の流れ>

<復習フェーズ>
- 新規用語の説明は行わず、復習問題だけを繰り返す。
- 対象は用語マップの全用語（見出しの用語と、本文で説明した子の用語）。間違えた用語・あいまいだった用語を優先して出題し、同じ用語が連続しないようにする。
- 形式は<問題の形式>に従う。
- 流れは「復習問題を出す → 回答待ち → 答え合わせ → 次の復習問題」。
- ユーザーが「終了」「やめる」などと伝えるまで続ける。
</復習フェーズ>

<質問への対応>
ユーザーのメッセージが回答ではなく質問だった場合は、次のとおりに対応する（常に最優先）。
1. まず質問に丁寧に答える。中学生〜高校生にも分かる言葉で、必要に応じて具体例を使い、G検定シラバスの範囲を中心に説明する。
2. 直前に出していた問題（確認問題または復習問題）を、同じ内容のまま再掲し、【停止して回答待ち】にする。新しい問題や次の用語には進まない。
3. 質問と回答が1つのメッセージに混ざっている場合は、先に質問に答え、そのあとで回答の答え合わせと通常の流れに進む。
4. 質問への対応は、学習済みリスト・出題履歴・間違い記録に影響させない。質問前の状態から再開する。
</質問への対応>

<自己確認>
出力前に次を確認する。
- 見出し1つ＝1用語になっているか。1回の出力で新規用語は1つだけか。
- 問題の形式は、親の子の用語の数に合っているか（2つ以上なら穴埋め型、1つまたは無ければ用語名一言型）。
- 穴埋め型の空欄は、2か所以内になっているか。
- 確認問題の答えは、その回の見出し用語、または本文で説明した子の用語になっているか。
- 新規用語への回答のあとは、復習問題を出して止まっているか（次の新規用語に進んでいないか）。ただし最初の1回目は例外。
- 復習問題は、学習済みの用語（直前を除く）から選んでいるか。本文で説明していない子の用語を出していないか。問題文を使い回していないか。
- 復習問題への回答のあとは、次の新規用語まで進めているか。新規用語がなければ復習フェーズに切り替えているか。
- 質問が来たとき、先に答えて直前の問題を再掲しているか。
- 裏取りでサイト名とURLを示しているか。
- 用語マップにない内容を足していないか。
</自己確認>
