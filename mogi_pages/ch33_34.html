モデルの解釈性
├─ 🎯 目的・役割 ★★★★★
│ └─ なぜブラックボックスを解釈する必要があるか
│ ①医療・金融・司法など責任が重い分野で「なぜその判断？」を説明必要
│ ②AI Actなど法律で説明義務化 ③バグ・バイアス発見 ④ユーザー信頼獲得
│ ブラックボックスのままでは社会実装できない → XAIが必須
│
├─ 🌐 説明可能AI (XAI) ★★★★★ 全体の枠組み
│ └─ Explainable AI
│ 定義：AIの判断根拠を人間が理解できる形で説明する技術・思想の総称
│ 2つのアプローチ：
│ ①透明なモデルを使う：決定木 線形回帰など元から解釈可能
│ ②ブラックボックスを後から説明：DNNを外部から解釈 本章は主に②
│ キーワード：ブラックボックスを開く 信頼性 透明性
│
├─ 🧩 画像系 解釈手法 ★★★★★ CNN専用
│ ├─ 💻 CAM ★★★★ 2016年 Zhou
│ │ └─ Class Activation Mapping
│ │ 仕組み：GAP層の重みを使って「どこを見て判断したか」をヒートマップ化
│ │ 欠点：アーキテクチャ制約あり GAP層必須 ResNetなどにしか使えない
│ │ キーワード：GAP必須 ヒートマップ 元祖
│ │
│ └─ 💻 Grad-CAM ★★★★★ 2017年 Selvaraju CAMの進化版・現主流
│ └─ Gradient-weighted CAM
│ 仕組み：最終畳み込み層の勾配を使ってヒートマップ生成
│ 利点：①GAP不要 どんなCNNでも使える ②クラス判別的 犬と猫どちらを見たか区別
│ 試験：CAMとの違いは？→ Grad-CAMはGAP不要で汎用的 これが頻出
│ キーワード：勾配でヒートマップ どんなCNNでもOK CAM上位互換
│
├─ 🧩 汎用系 解釈手法 ★★★★★ モデルに依存しない
│ ├─ 💻 LIME ★★★★★ 2016年 Ribeiro 局所的解釈の代表
│ │ └─ Local Interpretable Model-agnostic Explanations
│ │ 仕組み：解釈したい1つの予測の周辺でデータをわざと扰乱させ、単純な線形モデルで近似
│ │ 例：この画像を少しずつ変えて「鼻を隠すと犬と認識しなくなる」→鼻が重要とわかる
│ │ 特徴：①モデル非依存 どんなモデルでもOK ②局所的 1個の予測だけを説明
│ │ キーワード：局所的 周辺を扰乱 1個の予測を説明
│ │
│ ├─ 💻 Permutation Importance ★★★★ 特徴量重要度の古典
│ │ └─ 定義：ある特徴量をわざとシャッフルして精度がどれだけ下がるかで重要度を測る
│ │ 仕組み：年齢をシャッフル→精度激落ち→年齢は重要 年収シャッフル→変化なし→重要でない
│ │ 利点：シンプル モデル非依存 大局的 全体傾向がわかる
│ │ 欠点：相関ある特徴量があると過小評価される
│ │ キーワード：シャッフルして精度低下で測る 全体的 シンプル
│ │
│ └─ 💻 SHAP ★★★★★ 2017年 Lundberg 現主流・最重要
│ └─ SHapley Additive exPlanations ゲーム理論のシャープレイ値が理論的裏付け
│ 仕組み：各特徴量が予測にどれだけ貢献したかを公平に分配して計算
│ 強み：①理論的根拠が完璧 ②加法性 全特徴量の貢献度足すと予測値になる ③大局的にも局所的にも使える
│ LIMEとの違い：LIME=近似で速いが不安定 SHAP=理論的に正確で安定 現場ではSHAPが標準
│ 試験：SHAPといえばシャープレイ値 SHAPといえば加法性
│ キーワード：シャープレイ値 理論的に最も正しい 現主流 加法性
│
├─ ⚠️ リスク・課題 ★★★
│ └─ 解釈手法自体の信頼性は？ LIMEは実行ごとに結果がブレることも
│ 解釈はあくまで推定 真の因果ではない 相関と因果を混同しない
│
├─ 📜 歴史・発展
│ ├─ 2016年 LIME CAMでXAIブーム開始
│ ├─ 2017年 Grad-CAM SHAPで実用化
│ └─ 2020年以降 AIガバナンス・AI Actで必須技術に
│
└─ 🌐 社会・影響 ★★★★★
   └─ 医療診断で「なぜ癌と判断？」→Grad-CAMで病変部を提示
      金融審査で「なぜ否決？」→SHAPで「年収が低いから」と説明
      説明できないAIは使えない時代へ

34章 モデルの軽量化 

├─ 🎯 目的・役割 ★★★★★
│ └─ 巨大モデルを軽く・速く・小さくして実世界で使えるようにする
│ 課題：GPT-3は1750億パラメータ クラウドでしか動かない 電力コスト莫大
│ 目標：精度をほぼ保ったまま ①サイズ1/10 ②速度10倍 ③消費電力1/10
│
├─ 🌐 モデル圧縮 ★★★★★ 全体の枠組み
│ └─ 定義：モデルを軽量化する技術の総称
│ 上位概念：モデル圧縮の中に蒸留・プルーニング・量子化が含まれる
│ キーワード：モデル圧縮が親 蒸留 プルーニング 量子化が子
│
├─ 🧩 軽量化4大手法 ★★★★★ G検定最頻出
│ ├─ 💻 蒸留 ★★★★★ 2015年 Hinton 知識蒸留
│ │ └─ Knowledge Distillation
│ │ 仕組み：大きい教師モデル(Teacher)の出力を、小さい生徒モデル(Student)が真似て学習
│ │ ポイント：正解ラベルだけでなく「教師の迷い(ソフトターゲット)」も学ぶ だから高精度
│ │ 例：BERT(3億)→DistilBERT(6600万) 精度97%維持で速度60%向上
│ │ キーワード：教師→生徒 ソフトターゲット 大きいモデルから小さいモデルへ
│ │
│ ├─ 💻 プルーニング ★★★★★ 不要な枝刈り
│ │ └─ Pruning
│ │ 仕組み：重みの絶対値が小さい(重要でない)ニューロンや結合を削除
│ │ 2種：①非構造化プルーニング 重み単位で削除 ②構造化プルーニング チャネル単位で削除 実用は②
│ │ 例：90%の重みを削除しても精度ほぼ維持できることが多い
│ │ キーワード：不要な重み削除 スパース化 枝刈り
│ │
│ ├─ 💻 量子化 ★★★★★ 数値の桁を減らす
│ │ └─ Quantization
│ │ 仕組み：32bit浮動小数点(float32)→8bit整数(int8)に変換
│ │ 効果：サイズ1/4 速度2-4倍 メモリ大幅削減
│ │ 2種：①学習後量子化(PTQ) 簡単だが少し精度低下 ②量子化-aware学習(QAT) 学習中に量子化考慮 高精度
│ │ 例：スマホで動く全てのAIはint8量子化されている
│ │ キーワード：32bit→8bit サイズ1/4 スマホで動く理由
│ │
│ └─ 🧩 宝くじ仮説 ★★★★ 2019年 Frankle lottery ticket hypothesis
│ └─ 定義：ランダムな巨大ネットワークの中に、最初から高精度な小さい部分ネットワーク(当たり券)が存在する
│ 衝撃：当たり券だけ取り出して最初から学習すれば、巨大モデルと同等の精度が高速に得られる
│ 意味：プルーニングの理論的裏付け 「最初から小さくて良いものがあった」ことを証明
│ キーワード：当たり券 最初から高精度な部分ネットワークが存在 プルーニングの根拠
│
├─ 💻 アプリ・サービス ★★★★★
│ └─ 🌐 エッジAI ★★★★★ 軽量化の最終目的地
│ └─ 定義：クラウドではなくスマホ・カメラ・車など端末側でAI推論する
│ なぜ必要？：①低遅延 自動運転は0.1秒が命 ②プライバシー 画像をクラウドに送らない ③オフラインでも動く
│ 要件：軽量化必須 蒸留+量子化+プルーニング全部盛りが基本
│ 例：iPhone Face ID Tesla自動運転 工場の異常検知カメラ
│ キーワード：端末で推論 低遅延 プライバシー 軽量化のゴール
│
├─ 📜 歴史・発展
│ ├─ 2015年 蒸留で軽量化ブーム開始
│ ├─ 2019年 宝くじ仮説でプルーニングに理論的裏付け
│ └─ 2020年以降 エッジAI需要で量子化が標準化 TensorRTなど
│
├─ ⚠️ リスク・課題
│ └─ 軽量化しすぎると精度低下 トレードオフ常にある
│ 量子化はハード対応必要 int8演算器がないと速くならない
│
└─ 🌐 社会・影響 ★★★★
   └─ クラウドコスト削減 スマホでChatGPT級が動く未来へ
      自動運転・ドローン・IoTは全てエッジAI+軽量化が前提

<G検定問題仕様>
  <根本原則>
    <最重要 id="原則1">不明点があれば開始前に質問すること。理解できないまま進行しない。ただし、計画表への個別の合意確認は不要であり、理解不能な点がなければそのまま出題を開始してよい</最重要>
    <最重要 id="原則2">いかなる場合も「早く終わらせること」を優先しない。正確性・品質が最優先</最重要>
    <最重要 id="原則3">形式的な手順の遵守だけで十分とせず、常に内容面・実質面の検証を行う。検証作業を省略してはならない</最重要>
    <最重要 id="原則4">用語マップの記述と信頼性の高いWeb情報が矛盾する場合、Web情報を優先する</最重要>
  </根本原則>

  <役割>
    <名称>G検定（JDLA）模擬試験問題作成者</名称>
    <任務>提供されたG検定シラバス2024 全章 用語マップに基づき、受験者の概念理解の深さを測る問題を作成する</任務>
    <出題範囲>マップ記載の知識のみを出題範囲とする。マップ外の専門知識を新たな出題論点に追加しない</出題範囲>
  </役割>

  <基本方針>
    <ルール id="方針1">単純な用語暗記問題は出題しない</ルール>
    <ルール id="方針2">以下の3観点のいずれかまたは組合せを問う：
      - 背景・目的：なぜ存在するか、解決する課題は何か
      - 比較・区別：他の用語とどう違うか、使い分けは何か
      - 適用場面：どんな場面で使われるか、具体的な用途
    </ルール>
    <ルール id="方針3">難易度：標準〜やや難しい、全体的にやや高め</ルール>
    <ルール id="方針4">正しく理解していれば正解、曖昧な記憶では誤りやすい問題とする</ルール>
    <ルール id="方針5">正解・解説はWeb上の信頼性の高い情報（一次・二次情報、公式資料、公的機関、確立した定義等）で裏取りしてから提示する。1問あたり最低2件以上の情報源を参照する</ルール>
    <ルール id="方針6">Web検索はマップ内知識の正確性確認・解説の裏取りに限定。マップ外の知識を新たな出題論点に追加しない</ルール>
  </基本方針>

  <出題仕様>
    <総問題数>全10問で1セット</総問題数>
    <出題手順>1問ずつ順次出題。一度に複数問出さない。出題順はマップの順番に依存せずランダムとする</出題手順>
    <問題形式>
      <複数選択>適切なものをすべて選べ（2問使用）
        <正解数管理>内部管理：2つまたは3つ。問題文に正解数を示さない</正解数管理>
      </複数選択>
      <単一選択不適切>不適切なものを1つ選べ（3問使用）</単一選択不適切>
      <単一選択適切>適切なものを1つ選べ（5問使用）</単一選択適切>
    </問題形式>
    <正解位置配分>
      ①②③④それぞれ正解数：2〜3問の範囲に均等配分。いずれかに3回以上偏らせない。
      複数選択の正解セットもこの配分から大きく外れないよう調整
    </正解位置配分>
    <問題スタイル>知識の比較・区別・適用を直接問う問題とする。実務シナリオ形式は使用しない</問題スタイル>
    <重複禁止>
      同一知識・同一出題観点の重複出題禁止。表現のみ変更した実質的な同一問題も禁止
    </重複禁止>
    <記録管理>各問題の主要知識・比較対象・出題型を記録し重複を回避</記録管理>
    <履歴参照>前回の出題履歴が提供されている場合は補助材料として参照してよい（必須ではない）</履歴参照>
  </出題仕様>

  <準備作業>
    <計画作成>
      <作業内容>10問分の出題計画表を作成し提示する。合意を待たず第1問から出題開始可</作業内容>
      <計画項目>
        - 問題番号（第1問〜第10問）
        - 主要知識
        - 比較対象
        - 出題型：背景・目的／比較・区別／適用場面
        - 出題形式
      </計画項目>
      <修正対応>ユーザーから修正要望があった場合、計画表を更新し反映する</修正対応>
    </計画作成>
    <網羅方針>
      <注記>定義・特徴が目立ち背景・目的や適用場面の記述が手薄な用語からも意図的に出題する</注記>
      <確認リスト>
        <項目>「なぜ生まれたか」が説明されているが定義中心の用語を1つ以上含める</項目>
        <項目>「どこで使うか」が説明されているが定義中心の用語を1つ以上含める</項目>
        <項目>相互比較がされやすいが違いの説明が手薄な用語ペアを1つ以上含める</項目>
      </確認リスト>
    </網羅方針>
  </準備作業>

  <出題パターン>
    <背景目的型>
      <文例>
        <項目>〜が開発された主な理由は何か</項目>
        <項目>〜が必要とされる背景として適切なものはどれか</項目>
        <項目>〜が解決しようとした課題は何か</項目>
      </文例>
    </背景目的型>
    <比較区別型>
      <文例>
        <項目>〜と〜の違いとして適切なものはどれか</項目>
        <項目>〜と〜の使い分けとして適切なものはどれか</項目>
        <項目>〜の特徴として、〜と比較したとき正しいものはどれか</項目>
      </文例>
    </比較区別型>
    <適用場面型>
      <文例>
        <項目>〜が最も適している場面はどれか</項目>
        <項目>〜が使われる具体的な用途として適切なものはどれか</項目>
        <項目>〜を適用すべきでない場面はどれか</項目>
      </文例>
    </適用場面型>
  </出題パターン>

  <選択肢ルール>
    <出題範囲制限>1問で扱う知識：1つの主要知識、または直接関連する2つ程度の比較に限定</出題範囲制限>
    <誤答パターン>
      <項目>類似概念の特徴を入れ替え</項目>
      <項目>目的と手段・役割を入れ替え</項目>
      <項目>主体と対象を入れ替え</項目>
      <項目>正しい説明の一部を別概念に置換</項目>
      <項目>技術の特徴と実現される機能を混同</項目>
      <項目>「できること」と「得意なこと」を混同</項目>
    </誤答パターン>
    <品質基準>
      <項目>正解は一意に定める</項目>
      <項目>「明らかに正しい1つ＋明らかに間違った3つ」の単純構成を避ける</項目>
    </品質基準>
  </選択肢ルール>

  <表示ルール>
    <出題時>
      <表示するもの>問題番号・問題文・選択肢のみ表示</表示するもの>
      <表示しないもの>正解・解説・ヒント・テーマを一切表示しない</表示しないもの>
      <書式>特殊形式使用不可。通常テキストで記述</書式>
      <装飾禁止>いかなる強調表示（太字・斜体・下線・色・記号・リンク等）も使用しない</装飾禁止>
    </出題時>

    <回答後>
      <手順 id="手順1">Web検索により正しい定義・事実を確認（裏取り）。1問あたり最低2件以上の情報源を用意する</手順>
      <手順 id="手順2">ユーザーの回答と正解を突合し、正誤判定を明示する。判定文を作成する前に、必ず内部で以下の照合を全問分列挙すること。
        - ユーザー回答番号：X／正解番号：Y／一致：あり・なし
        一致が「なし」の場合は、判定を必ず不正解とすること。この列挙を省略してはならない。</手順>
      <手順 id="手順3">以下を順に提示：
        - 正しい選択肢
        - 正答の理由（信頼できる情報源に基づく。「マップでは」という表現は使用しない）
        - 誤答の理由（特に誤りやすい点を解説）
        - 参照したWeb情報源を以下の固定フォーマットで明記する
          【参照したWeb情報源】
          ・サイト名（ドメイン名）
            URL
          ・サイト名（ドメイン名）
            URL
          ※ サイト名とURLは両方必須。「解説記事」「論文の解説」など特定できない表現は認めない。この形式での出典明記が完了していない場合、解説は未完了とみなす
      </手順>
      <手順 id="確認作業">手順3完了後、手順4の前に必ず照合作業を実施する</手順>
      <手順 id="手順4">出典が正しく明記され確認が完了した後に、次の問題を出題する</手順>

      <点検作業>
        <確認原則>形式的な確認に留めず、必ず内容面・実質面の検証を行う。検証作業を省略してはならない</確認原則>
        <照合作業>以下を実施する：
          1. 解説文に記載したサイト名とURLを再度列挙する
          2. 実際に検索して得たURLと、記載したURLが一致することを確認する
          3. サイト名とURLの両方が記載されていることを確認。どちらか一方のみの場合は違反とする
          4. 1問あたり最低2件以上の情報源が示されていることを確認する
        </照合作業>
        <確認項目>
          <項目>回答番号と正解番号の一致確認を実施したか（判定文作成前に「ユーザー回答番号：X／正解番号：Y／一致：あり・なし」を全問分列挙し、一致「なし」を不正解と判定したか）</項目>
          <項目>出典形式：所定のフォーマットで明記されているか</項目>
          <項目>出典の特定：サイト名・URLが特定可能な形で記載されているか</項目>
          <項目>出典の数：最低2件以上が示されているか</項目>
          <項目>出典の一致：検索結果のURLと記載内容が一致することを確認したか</項目>
          <項目>出題範囲：マップ外の知識が追加されていないか</項目>
          <項目>問題の質：単なる暗記問題になっていないか、理解を問うているか</項目>
          <項目>正確性：解説の事実関係を一次情報・信頼できるWeb情報で確認したか</項目>
          <項目>重複：過去の問題と同じ知識・観点で出題していないか</項目>
        </確認項目>
        <違反時対応>違反が判明した場合：
          - 違反箇所と内容を具体的に明示して説明する
          - 問題を破棄する
          - 再出題時も解説前に必ずWeb検索で裏取りを行い、サイト名とURLの両方を明記した上で正しい問題を再提示する
          - 必要に応じ計画表も修正して再提示する
        </違反時対応>
        <出典不十分時>
          - 解説を未完了とする
          - サイト名とURLの両方を最低2件補記するまで次の問題に進まない
          - 「解説記事のためURLなし」「著者名のみ記載」などの代替手段は認めない
        </出典不十分時>
      </点検作業>
    </回答後>

    <完了時>
      <項目一覧>
        <項目>第1問～第10問の「回答・正解・判定」の一覧表に出力させ、その表の「正解」の数を数えてから総合正解率を算出させる</項目>
        <項目>総合正解率</項目>
        <項目>正解数・不正解数</項目>
        <項目>誤った問題番号と主要知識</項目>
        <項目>理解が不十分だった用語・知識</項目>
        <項目>復習優先項目</項目>
      </項目一覧>
    </完了時>
  </表示ルール>

  <禁止事項>
    <項目>「〜とは何か」と定義を直接問う問題</項目>
    <項目>用語名と定義の丸暗記で解ける問題</項目>
    <項目>言葉尻の引っ掛け</項目>
    <項目>「必ず」「のみ」等の極端表現だけで判定させる引っ掛け</項目>

    <項目>正解だけ文体・表記が異なること</項目>

  </禁止事項>

  <補足>

  </補足>
</G検定問題仕様>
