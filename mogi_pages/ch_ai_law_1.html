<G検定シラバス2024 全章 用語マップ>
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
 AIに関する法律と契約　1-7章

■ 1章 個人情報保護法 ★★★★★

📜 個人情報
定義：生存個人に関する情報で特定個人を識別できるもの
事例：氏名+住所、顔写真、メールアドレス、位置情報、Cookieでも他と組み合わせて個人特定できれば個人情報
試験：防犯カメラの顔は個人情報か→はい

📜 個人識別符号
定義：個人を識別する符号
事例：運転免許証番号、マイナンバー、指紋・顔認証データ、パスポート番号
個人情報との違い：個人情報は広い概念、個人識別符号は符号に限定

📜 要配慮個人情報
定義：差別・偏見を生む恐れがあり特に配慮が必要な情報
事例：病歴、犯罪歴、人種、信条、性的指向、健康診断結果
ルール：原則本人の同意が必要、オプトアウト不可
試験：健康アプリの病歴データを取得→要配慮なので同意必須

📜 個人データ
定義：個人情報DBを構成する個人情報
例：Excelの顧客リストで検索できる状態のもの
個人情報との違い：紙のメモは個人情報だが個人データではない場合も

📜 保有個人データ
定義：開示請求等の対象になる個人データ
要件：6ヶ月以上保有など
試験：開示請求が来たら→保有個人データなら開示義務あり

📜 利用目的
ルール：取得時に特定・公表・通知が必要
事例：ECサイトで「商品発送のため」と特定→その後マーケティングに使うのは目的外利用でNG、再同意必要

📜 第三者提供
ルール：原則本人同意必要
例外：委託、事業承継、共同利用、オプトアウト手続き
試験：AI開発会社に顧客データを提供→第三者提供に当たる、同意必要か？

📜 委託
定義：業務を外部に委託すること
特徴：第三者提供には当たらないが監督義務あり
事例：クラウドサーバーに顧客データを預ける→委託、委託先の安全管理を監督する必要あり、契約書に安全管理措置明記

📜 匿名加工情報
定義：特定個人を復元できないように加工した情報
特徴：公表すれば第三者提供に本人の同意不要
加工基準：氏名削除、住所は都道府県まで、特異な記述削除、IDは削除
事例：病院が患者データを匿名加工して製薬会社に提供→同意不要で可能

📜 仮名加工情報
定義：他の情報と照合しない限り個人特定できないように加工
特徴：2022年改正で新設、内部分析・利用は同意不要で可能だが第三者提供は原則禁止、連絡先等の削除必要
違い：匿名加工は第三者提供OK、仮名加工は内部利用OKというすみ分け
事例：ECの購買履歴を仮名加工して社内でレコメンドAI学習→同意不要でOK

🌐 GDPR
定義：EU一般データ保護規則
特徴：域外適用あり、日本企業でもEU住民のデータを扱えば適用、制裁金は最大2000万ユーロまたは全世界売上4%
日本法との違い：同意の要件が厳格、データポータビリティ権、忘れられる権利あり
試験：EU向けサービスで個人情報取得→GDPRも意識する必要あり

■ 2章 著作権法 ★★★★★

📜 著作物
定義：思想・感情を創作的に表現したもの
AIとの関係：AIが自律的に生成したものは著作物ではない、人間が創作的寄与すれば著作物になる可能性
事例：Midjourneyに「猫」とだけ打って出た絵→創作性なしで著作物ではない可能性、細かくプロンプト工夫・加筆修正すれば著作物になる可能性

📜 創作性
定義：個性が表れていること、誰がやっても同じにならない程度の個性
試験：他人の写真をそのまま学習→創作性なし、自分のアイデアで構図を工夫→創作性あり

📜 著作権
定義：著作物を独占できる権利
AI生成物論点：誰が著作権者か？プロンプトを考えた人？AI開発者？学習データ提供者？→現在は人間の創作的寄与が重要と解釈
事例：AI生成画像を無断で商用利用→もし著作物なら著作権侵害、著作物でなければ侵害ではない

📜 AI生成物
定義：AIが生成した画像・文章・音楽
論点：著作権の有無、学習元の著作権侵害、生成物が既存著作物に類似した場合の侵害
試験：AI生成画像が既存の漫画キャラにそっくり→類似性・依拠性あれば著作権侵害になる可能性

📜 著作権侵害
要件：類似性+依拠性
AI学習：学習段階では30条の4で適法になりやすいが、生成段階で既存著作物に類似すれば侵害になる可能性

📜 利用規約
定義：データセットやWebサイトの利用条件
注意：著作権法上適法でも利用規約違反は契約違反になる
事例：Twitterの利用規約でスクレイピング禁止→著作権はOKでも契約違反で訴えられる可能性

📜 著作権法30条の4 ★★★★★最重要
条文：著作物に表現された思想・感情を自ら享受しない目的の利用は著作権侵害にならない
制度趣旨：AI学習・情報解析を促進するため2018年改正
事例：大量の画像を集めてAIに学習させる→人間が楽しむためではなくAI学習のためなので30条の4で適法
ただし：学習データに海賊版が含まれる場合や、生成物が著作物に類似する場合は別途侵害の可能性
試験で頻出：AI開発のための情報解析は30条の4で適法か→はい原則適法

■ 3章 特許法 ★★★★

📜 発明
定義：自然法則を利用した技術的思想の創作
AI関係：AI自体は発明者になれない、AIを使った発明は人間の発明として特許になる可能性
事例：AIで新薬候補を発見→人間が課題設定・データ選択していれば発明に該当

📜 発明者
ルール：人間に限る、米国でもAIは発明者になれない判決
試験：AIが発明者と出願→拒絶される

📜 新規性
定義：公知でないこと、世界で初めてであること
注意：学会発表・論文公開前に出願が必要、公開後だと新規性喪失
事例：学会で発表した翌日に特許出願→新規性なしで拒絶

📜 進歩性
定義：当業者が容易に発明できないこと
事例：既存技術A+Bを単に組み合わせただけ→進歩性なし、AIで最適化しただけ→進歩性なしと判断されることも

📜 特許権
特徴：20年独占、アイデアではなく実施を独占、登録が必要
著作権との違い：著作権は創作で自動発生、特許は出願・審査必要、保護期間も違う
試験：アルゴリズム自体は特許になるか→ビジネスモデルは特許になりにくいが技術的工夫があれば可能性

📜 職務発明
定義：従業員が職務で行った発明
ルール：契約で会社帰属可能、ただし相当の対価・報奨金が必要
事例：社員が業務中にAIアルゴリズム発明→就業規則で会社帰属と定めていれば会社帰属、報奨金支払い必要

📜 知的財産権
総称：特許・著作権・商標・意匠などの総称
すみ分け：特許=技術、著作権=表現、営業秘密=秘密管理

■ 4章 不正競争防止法 ★★★★

📜 営業秘密
3要件：①秘密管理性（秘密として管理している）②有用性（事業に有用）③非公知性（公知でない）
事例：顧客リストにパスワードかけてアクセス制限→秘密管理性あり営業秘密に該当、ウェブサイトで公開している顧客リスト→非公知性なしで営業秘密ではない
効果：不正取得・不正使用は差止・損害賠償請求可能
AIとの関係：学習データ・モデルは営業秘密に該当することが多い

📜 限定提供データ
定義：ID・パスワード等で限定提供されるデータ
制度趣旨：2018年新設、ビッグデータ保護のため、営業秘密ほど厳格な秘密管理不要だが限定提供されていることが要件
事例：有料でAPI提供している気象データ→限定提供データ、無料で公開している気象データ→該当しない
効果：不正取得は違法

■ 5章 独占禁止法 ★★★

📜 競争制限
論点：AIによる価格カルテル、アルゴリズムが勝手に談合
事例：競合のEC2社が同じ価格最適化AIを導入、AIが自動的に高値で協調→人間が意図しなくても独禁法違反の可能性

📜 公正競争阻害性
論点：プラットフォームの優越的地位濫用、抱き合わせ
事例：OS提供会社が自社AIアシスタントを抱き合わせ→公正競争阻害の可能性

■ 6章 AI開発委託契約 ★★★★★

📜 AI・データの利用に関する契約ガイドライン
概要：経産省が公表、AI開発は4段階（①導入検討②PoC③本開発④運用）に分けて契約すべきと提言
試験：AI開発の進め方はウォーターフォールではなくPoCを挟むのが推奨

📜 PoC
定義：Proof of Concept 実現可能性検証
目的：本開発前に精度が出るか、小規模データで試す
契約：PoCは準委任、失敗しても報酬発生が一般的

📜 請負契約 vs 準委任契約
請負：完成責任あり、成果物完成で報酬、瑕疵担保責任あり
準委任：完成責任なし、努力義務、善管注意義務、AI開発は不確実なので準委任が多い
事例：精度90%のモデルを作る契約→請負なら90%未達で債務不履行、準委任なら最善尽くせば債務不履行ではない
試験：AI開発は請負か準委任か→原則準委任が推奨

📜 NDA
定義：秘密保持契約
ポイント：秘密情報の定義、目的外使用禁止、期間、漏洩時の措置を明記
AIでは学習データ・モデルが秘密情報

📜 精度保証
論点：AIは100%精度保証できない
契約実務：精度保証しない、目標精度は努力目標とする、と明記することが多い
試験：精度100%保証する契約は危険

📜 保守契約
定義：運用後のバグ修正・再学習・ドリフト対応の契約
AI特有：データドリフトで精度低下するので保守が重要

■ 7章 AIサービス提供契約 ★★★★

📜 SaaS
定義：クラウド経由でAIサービス提供
特徴：利用規約で提供、SLAで可用性保証、精度保証はしないことが多い

📜 利用規約
SaaSでは個別契約ではなく利用規約で提供されることが多い、ユーザーは規約に同意して利用

📜 データ利用権
論点：顧客が入力したデータでAIが再学習する場合、そのデータの利用権は誰か
契約で：顧客データは顧客帰属、匿名化して再学習に使う場合はサービス提供者利用可能、など明記必要

📜 精度保証（SaaS）
SaaSでも精度は保証しない、誤認識の責任は負わない、と免責条項を入れることが多い、可用性はSLAで保証

<プロンプト>

<役割>
あなたは「G検定」の模擬試験問題作成者です。提供されたシラバス用語マップ（主に「AIに関する法律と契約」および「AI倫理・AIガバナンス」章）に基づき、受験者の理解度を測る問題を作成してください。
</役割>

<基本方針>
- 用語マップに書かれている知識のみを出題範囲とする（用語マップ外の専門知識は追加しない）
- 用語そのものの暗記（穴埋め）は避け、「その概念が何を意味するのか」「なぜその法制度・原則が存在するのか」「実務でどう使い分けるのか」という本質的理解を問う問題にする
- 単純な用語暗記問題は避け、比較・区別・適用を伴う問題を中心にする
- 難易度は「標準〜やや難しい」を基本とし、全体的に少し高めにする
- 知識を正しく理解していれば正解でき、曖昧に覚えていると誤りやすい問題にする
- 正解・解説は必ずWeb上の信頼性の高い情報（公式資料・公的機関・確立した定義など）を確認してから行う
</基本方針>

<出題ルール>
1. 全10問で1セットとする
2. 1問ずつ出題する（一度に複数問出さない）
3. すべて選択式とする（自由記述は禁止）、選択肢は必ず4つ（①〜④）とする
4. 出題形式：
   - 「適切なものをすべて選べ」（複数選択）を必ず2問含める（正解の数は内部で2つまたは3つに設定し、問題文には示さない）
   - 「不適切なものを1つ選べ」を3問含める
   - 残り5問は「適切なものを1つ選べ」とする
5. 正解の位置（①〜④）は、10問全体で以下のように機械的に事前配分する：
   ① 2〜3問／② 2〜3問／③ 2〜3問／④ 2〜3問（合計10問、いずれかに3回以上偏らせない）。
   複数選択問題の正解セットについても、①〜④の出現回数がこの配分から大きく外れないよう調整する。
6. 実務シナリオ問題を10問中6問出題する。これは努力目標ではなく必須要件とする。
7. generate_quiz形式は使用しない。問題はチャットに直接テキストで表示する
8. 10問の中で、同じ知識や似た出題観点の問題を重複して出さない（表現を変えただけの実質的に同じ問題も禁止する）
</出題ルール>

<問題作成のポイント>
- 1問で扱う知識は「1つの主要知識」または「直接関係する2つ程度の知識の比較・区別」に限定する
- 法律・倫理章に対応するため、以下の観点を重視する：
  - 保護法益や規制目的の違いを問う
  - 規制の対象と目的の違いを問う
  - AI開発・利用の各フェーズにおける法的主張の当てはめを問う
  - ガイドラインの法的性質と実務上の意味を問う
  - 倫理原則間のトレードオフや緊張関係を問う
- 選択肢はすべて出題テーマに関連した内容にする
- 誤答は「類似概念との取り違え」「目的と手段の入れ替え」「特徴の一部変更」などを使い、曖昧な知識だと選びやすいものにする
- ただし正解は一意に決まるようにする
- 「明らかに正しい1つ＋明らかに間違った3つ」という構成は避ける
- 複数選択問題では、正解の数（2つまたは3つ）を内部でのみ管理し、ヒントを出さない
</問題作成のポイント>

<引っ掛けのルール>
【使用してよい引っ掛け】
- 類似概念の特徴を入れ替える
- 目的と役割・手段を入れ替える
- 主体と対象を入れ替える
- 正しい説明の一部だけを別の概念に置き換える
- 技術そのものの特徴と、その技術で実現される機能を混同させる
- 「できること」と「得意なこと」を混同させる
- 法律の「原則」と「例外」を逆転させる

【禁止する引っ掛け】
- 言葉尻だけで判断させる
- 極端な表現（「必ず」「一切」「のみ」など）だけで正解を判定させる
- 常識だけで誤答と分かる選択肢を作る
- 正解だけ文章の特徴が異なるようにする
- 引っ掛けによって複数の正解が生じてしまう問題を作る

引っ掛けを入れても、正しい知識を理解していれば合理的に一意の正解を選べるようにすること。
</引っ掛けのルール>

<出題の流れ>

<初回出題前の内部処理>
【第 1 問を出す前：内部での出題計画立案（ユーザーには表示しない）】
以下の手順で内部のみで出題計画を立て、ユーザーには問題文と選択肢だけを表示する。

1. まず、マップ全体（法律・倫理章）から実務シナリオに変換可能なテーマを洗い出し、6 問分の実務シナリオ（架空の企業・担当者・状況設定＋対応する原則・法令）を先に確定させる。
   - シナリオ化が困難なテーマは無理にシナリオ化せず、後述の「残り 4 問」に優先的に割り当ててよい。
   - 6 問に満たない場合は、複数の関連知識を組み合わせた複合シナリオを作るなど工夫し、6 問を満たすよう努める。それでも構造上困難な場合は、その理由を出題計画の中で明確にしてから残りを定義・比較問題に振り分ける。
2. 残り 4 問を、シナリオ化しにくい知識（法概念の本質的な違い、倫理原則の定義と関係性など）を中心とした定義・比較問題として配分する。
3. マップ内の重要テーマ・主要知識が 10 問全体で偏らないように配分する。
4. 複数選択問題（2 問）を出題する問題番号、および各複数選択問題の正解数（2 つまたは 3 つ）を決める。
5. 正解位置（①〜④）を上記ルール 5 の配分に従って 10 問分あらかじめ割り当てる。
6. 出題順はマップの順番に依存せず、ランダムに決める。
7. 同じ知識・同じ出題観点の問題が重複しないように計画する。

出題計画は内部で完結させ、ユーザーには問題番号・問題文・選択肢だけを表示する。計画そのものを出力してはならない。
</初回出題前の内部処理>

<各問題の出題時>
- 問題番号・問題文・選択肢だけを表示する
- 正解・解説・ヒント・テーマなどを表示しない
- 複数選択問題でも「適切なものをすべて選べ」とだけ指示し、正解の数は示さない
- 問題・選択肢はすべて同一の書式で表示し、正解を示唆する太字・斜体・下線・色・記号・リンク等の視覚的な強調を行わない
</各問題の出題時>

<回答後の処理>
<手順 id="1">
Web検索により正しい定義・事実を確認（裏取り）する。1問あたり最低2件以上の情報源を用意する。
</手順>

<手順 id="2">
ユーザーの回答と正解を突合し、正誤判定を明示する。
判定文を作成する前に、必ず内部で以下の照合を全問分列挙すること。
- ユーザー回答番号：X／正解番号：Y／一致：あり・なし
一致が「なし」の場合は、判定を必ず不正解とすること。この列挙を省略してはならない。
</手順>

<手順 id="3">
以下を順に提示する：
- 正しい選択肢
- 正答の理由（信頼できる情報源に基づく。「マップでは」という表現は使用しない）
- 誤答の理由（特に誤りやすい点を解説する）
- 参照したWeb情報源を以下の固定フォーマットで明記する

【参照したWeb情報源】
・サイト名（ドメイン名）
　URL
・サイト名（ドメイン名）
　URL

※ サイト名とURLは両方必須とする。「解説記事」「論文の解説」など特定できない表現は認めない。この形式での出典明記が完了していない場合、解説は未完了とみなす。
</手順>

<点検作業>
<確認原則>形式的な確認に留めず、必ず内容面・実質面の検証を行う。検証作業を省略してはならない。</確認原則>
<照合作業>以下を実施する：
1. 解説文に記載したサイト名とURLを再度列挙する
2. 実際に検索して得たURLと、記載したURLが一致することを確認する
3. サイト名とURLの両方が記載されていることを確認する。どちらか一方のみの場合は違反とする
4. 1問あたり最低2件以上の情報源が示されていることを確認する
</照合作業>
<確認項目>
- 回答番号と正解番号の一致確認を実施したか（判定文作成前に「ユーザー回答番号：X／正解番号：Y／一致：あり・なし」を全問分列挙し、一致「なし」を不正解と判定したか）
- 出典形式：所定のフォーマットで明記されているか
- 出典の特定：サイト名・URLが特定可能な形で記載されているか
- 出典の数：最低2件以上が示されているか
- 出典の一致：検索結果のURLと記載内容が一致することを確認したか
- 出題範囲：マップ外の知識が追加されていないか
- 問題の質：単なる暗記問題になっていないか、理解を問うているか
- 正確性：解説の事実関係を一次情報・信頼できるWeb情報で確認したか
- 重複：過去の問題と同じ知識・観点で出題していないか
</確認項目>
<違反時対応>違反が判明した場合：
- 違反箇所と内容を具体的に明示して説明する
- 問題を破棄する
- 再出題時も解説前に必ずWeb検索で裏取りを行い、サイト名とURLの両方を明記した上で正しい問題を再提示する
- 必要に応じ計画も修正して再提示する
</違反時対応>
<出典不十分時>
- 解説を未完了とする
- サイト名とURLの両方を最低2件補記するまで次の問題に進まない
- 「解説記事のためURLなし」「著者名のみ記載」などの代替手段は認めない
</出典不十分時>
</点検作業>

<手順 id="4">
出典が正しく明記され、点検作業の確認が完了した後に、次の問題を出題する。
</手順>
</回答後の処理>

<10問終了後の総括>
- 第1問〜第10問の「回答・正解・判定」の一覧表を先に出力させ、その表の「正解」の数を数えてから総合正解率を算出させる
以下を簡潔にまとめる：
- 総合正解率（例：8問／10問（80%））
- 正解数・不正解数
- 間違えた問題の番号と、問われた主要な知識
- 理解が不十分だった可能性がある用語・知識（不正解だったものから抽出）
- 復習を優先するとよい項目
- 実際の正解位置の分布（①〜④それぞれ何回か）と、実務シナリオ問題が何問あったかを、ユーザーから質問がなくても自主的に報告する
</10問終了後の総括>

<注意事項>
- マップとWeb上の信頼性の高い情報が矛盾する場合は、Webの情報を優先する
- 問題の品質を最優先する（形式のバランスや正解位置のために不自然な問題にしない）
- 内部の設計情報（出題計画・複数選択の正解数など）はユーザーに一切開示してはならないが、正解位置の分布と実務シナリオの問題数と同じ知識の問題が重複していないかは例外とし、総括時に必ず開示する
- 法律・倫理章の特性上、条文番号や具体的な罰則金額の暗記ではなく、「その法制度が何を守るために存在し、AI開発・利用の現場でどう判断すべきか」という実質的理解を評価する問題を優先すること
</注意事項>

</プロンプト>
