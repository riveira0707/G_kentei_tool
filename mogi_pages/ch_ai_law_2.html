 AI倫理・AIガバナンス 8-18章

■ 8章 国内外のガイドライン ★★★★★

📜 AI倫理
定義：AIが守るべき倫理原則
代表例：【entity-OECD¦canonical_name=OECD】 AI原則（人間中心、公平性、透明性、頑健性、説明責任）、日本のAI利活用ガイドライン
試験：AI倫理で共通して議論される事項は？→人間中心、公平性、プライバシー、安全性、透明性、説明責任

📜 AIガバナンス
定義：倫理を実現するための組織体制・プロセス・ルール
例：倫理委員会設置、倫理アセスメント実施、モニタリング体制
倫理との違い：倫理=原則、ガバナンス=それを実現する仕組み

📜 価値原則
定義：AIが尊重すべき根本価値
例：人間中心、人間の尊厳、持続可能性、多様性・包摂性
OECD5原則：①包括的成長②人間中心③透明性④頑健性・安全性⑤説明責任

📜 ハードロー
定義：法律、罰則あり、強制力あり
例：個人情報保護法、GDPR、著作権法、EU AI Act（2024年成立の世界初AI包括規制）
特徴：違反すると罰金・制裁金

📜 ソフトロー
定義：ガイドライン・倫理指針・業界自主規制、罰則なし
例：総務省AI利活用ガイドライン、経産省契約ガイドライン、企業のAIポリシー
特徴：強制力はないが事実上の規範、取引先から遵守求められることも
試験：ソフトローとハードローの違いは？→罰則の有無

📜 リスクベースアプローチ ★★★★★最重要
定義：リスクの高低で規制の強弱を変える考え方
EU AI Actの核：①許容できないリスク（禁止：人間の信用スコアで差別など）②高リスク（厳格規制：採用AI、信用審査AIなど）③限定的リスク（透明性義務：生成AIはAI生成と明示）④最小リスク（規制なし）
事例：採用AIは高リスク→学習データの品質管理、ログ保存、人間の監視義務あり、チャットボットは限定的リスク→AIであることを明示すればOK
試験頻出：EU AI Actはリスクベースアプローチを採用

■ 9章 プライバシー ★★★★

📜 プライバシー・バイ・デザイン
定義：設計段階からプライバシー配慮を組み込む考え方 7原則
7原則：①事前対策②デフォルトでプライバシー保護③設計に組み込む④全機能性（プライバシーと利便性の両立）⑤全ライフサイクル保護⑥透明性⑦ユーザ中心
事例：カメラ画像AIを開発する時に、最初から顔をぼかす処理を入れる、取得前にプライバシー影響評価を行う
試験：後付けではなく設計段階から配慮するのがPbD

📜 カメラ画像利活用ガイドブック
定義：総務省・経産省が公表、防犯カメラ・AIカメラのプライバシー配慮
内容：①事前に利用目的を掲示②顔の特定を避ける措置③第三者提供時は配慮④問い合わせ窓口設置
事例：商店街の防犯カメラで来店者分析AI→入口に「カメラで分析しています」と掲示、顔は特定せず人数カウントのみ
試験：カメラ画像でプライバシー配慮すべき事項は？→掲示、特定回避

■ 10章 公平性 ★★★★★

📜 アルゴリズムバイアス
定義：AIが差別的な結果を出すこと
代表事例：①米Amazon採用AIが女性を低評価（過去の採用データが男性偏重）②COMPAS再犯予測AIが黒人を高リスク判定③顔認識AIが有色人種の認識精度低い
原因：学習データの偏り、代理変数の使用、目的関数の偏り
試験頻出：バイアスの具体例を説明できるか

📜 データの偏り
定義：学習データが特定属性に偏っている
例：医師画像データが男性ばかり→女性医師を認識できない、英語データばかりで学習→日本語の精度低い

📜 サンプリングバイアス
定義：収集過程での偏り
例：昼間だけカメラでデータ収集→夜間のデータなし、スマホアプリ利用者だけアンケート→高齢者の意見なし

📜 センシティブ属性
定義：差別に繋がりやすい属性
例：人種、性別、宗教、性的指向、政治信条、病歴
ルール：原則直接入力すべきでない、公平性配慮で削除・補正が必要
試験：センシティブ属性をそのまま学習に使うのは公平性上NG

📜 代理変数 ★★★★最重要
定義：センシティブ属性と相関する変数、直接センシティブ属性を使わなくても代理で差別してしまう
代表例：①郵便番号→人種の代理（米国で特定人種が特定地域に住む）②年収・学歴→性別の代理③顔写真→人種・性別の代理
事例：性別を削除しても、趣味や職歴から性別を推測して差別してしまう
対応：代理変数も特定して除去・補正が必要、相関分析で発見
試験頻出：代理変数の例として郵便番号

📜 公平性の定義
定義：公平性には複数の定義があり両立不可能
主要定義：①Demographic Parity（人口比で平等、男女で採用率同じ）②Equalized Odds（真陽性率が平等）③Equal Opportunity（機会の平等）
ジレンマ：Demographic Parityを満たすとEqualized Oddsが崩れることがある、どの定義を採用するかは社会合意が必要
試験：公平性の定義は1つではない

📜 公平性対応技術
①前処理：データの偏り補正（アンダーサンプリング、オーバーサンプリング、重み付け）
②学習時：公平性制約付き学習（公平性を目的関数に入れる）
③後処理：閾値調整（グループごとに閾値変える）
事例：男女で採用閾値を変えて公平性確保

■ 11章 安全性とセキュリティ ★★★★★攻撃手法の区別が頻出

⚠️ Adversarial Attack / Adversarial Examples ★★★★★最重要
定義：人間には分からない微小ノイズでAIを誤認識させる攻撃
手口：画像に1ピクセルだけ変える、人間には同じに見えるがAIはパンダをテナガザルと誤認識
種類：①白箱攻撃（モデル内部を知っている）②黒箱攻撃（APIを叩いて推測）
事例：自動運転の停止標識にシールを貼る→AIが速度標識と誤認識して止まらない、顔認証にメガネをかける→他人と誤認識
対策：Adversarial Training（敵対的サンプルで再学習）、入力の平滑化、検出モデル
試験：Adversarial Examplesとは人間には分からない微小な摂動で誤認識させるサンプル

⚠️ データ汚染 Data Poisoning
定義：学習データに悪意あるデータを混入させて精度低下・バックドア仕込み
手口：Wikipediaを改ざんしてAIに誤った知識を学習させる、大量の誤ラベルデータを混入
違い：Adversarial Attackは推論時攻撃、データ汚染は学習時攻撃
事例：スパムフィルタの学習データに正常メールをスパムとして混入→正常メールがスパム判定される

⚠️ モデル汚染
定義：学習済みモデルにバックドアを仕込む
手口：特定トリガー（例：特定シール）があると誤動作するようにモデル改ざん
事例：特定パターンのマスクをすると顔認証を突破できるモデルを配布

⚠️ データ窃取 Data Extraction
定義：APIを大量に叩いて学習データを復元する攻撃
手口：生成AIに「学習データを教えて」とプロンプトインジェクション、言語モデルから個人情報を引き出す
事例：ChatGPTに住所を聞くと学習データの住所を答えてしまう

⚠️ モデル窃取 Model Stealing
定義：APIからモデルをコピーする攻撃
手口：大量の入力と出力のペアを集めて類似モデルを学習、モデル抽出攻撃
事例：有料画像認識APIを大量に叩いて同じ性能の無料モデルを作成

📜 セキュリティ・バイ・デザイン
定義：設計段階からセキュリティ配慮を組み込む
例：最初から入力バリデーション、ログ保存、権限管理を設計

■ 12章 悪用 ★★★★

⚠️ ディープフェイク
定義：AIで偽の動画・音声・画像生成
悪用例：①フェイクポルノ（有名人の顔をアダルト動画に合成）②なりすまし詐欺（社長の声をAI生成して送金指示）③政治的偽動画（選挙前に候補者の偽発言動画）
対策：検出AI、透かし技術、メディアリテラシー
試験：ディープフェイクのリスクは肖像権・名誉毀損・詐欺

⚠️ フェイクニュース
定義：AIで大量の偽記事・偽レビュー生成
悪用例：LLMで大量の偽ニュースサイト生成、SNSで自動拡散、選挙介入
対策：ファクトチェック、生成AIの透かし、プラットフォームの規制
民主主義への影響：フィルターバブルと組み合わさり世論操作

■ 13章 透明性 ★★★★

📜 説明可能性 Explainability
定義：なぜAIがその判断をしたか人間が理解できること
必要性：①GDPRで自動決定の説明を求める権利②医療・金融・採用など高リスク領域で必須③ブラックボックスでは責任追及できない
技術：LIME、SHAP、Grad-CAM（後述33章）
事例：融資AIが否決した理由を「年収と勤続年数が基準未満」と説明
試験：説明可能性が必要なユースケースは医療・金融・採用・司法など人命・人生に影響する領域

📜 ブラックボックス
定義：内部が見えないAI
例：ディープラーニングは数百万パラメータでなぜその出力になったか人間が追えない
問題：責任所在不明、バイアス検出困難
対策：説明可能AI（XAI）

📜 データの来歴 Data Provenance / Data Lineage
定義：データがどこから来たか追跡可能にすること
必要性：学習データに違法データ・偏りデータが混入していないか確認、著作権・プライバシー問題追跡
事例：学習データのURL・取得日・ライセンスを記録

■ 14章 民主主義 ★★★

📜 エコーチェンバー
定義：同じ意見ばかり聞いて先鋭化する現象
メカニズム：SNSで同じ思想の人同士がフォロー、反対意見をブロック→意見が極端化
AIとの関係：レコメンドAIが同じ意見を推薦して加速
事例：ワクチン反対派コミュニティで反対意見ばかり見てさらに反対が強まる

📜 フィルターバブル
定義：AIのレコメンドで自分好みだけ見て視野が狭くなる
提唱：Eli Pariser
違い：エコーチェンバーは人間が自ら同じ意見に閉じる、フィルターバブルはAIが自動的に好みだけ見せる
事例：YouTubeで陰謀論動画を見ると次々陰謀論が推薦される、Amazonで同じジャンルばかり推薦
問題：多様な意見に触れられず民主主義の健全な議論が阻害

📜 フェイクニュース（民主主義文脈）
定義：偽情報で世論操作
AIとの関係：生成AIで大量生成、レコメンドAIで拡散加速、フィルターバブルで信じやすくなる
事例：2016年米大統領選での偽ニュース拡散

■ 15章 環境保護 ★★★

📜 気候変動
論点：AIの電力消費がCO2排出に繋がる、持続可能なAIが求められる
OECD原則にも持続可能性あり

📜 モデル学習の電力消費 ★★★★
データ：GPT-3学習で約1300MWh、CO2約550トン（自動車1台の生涯排出に匹敵）、大規模モデルは学習だけでなく推論でも大量電力
対策：①モデル軽量化（蒸留・量子化・プルーニング）②効率的アーキテクチャ③再生可能エネルギー使用④学習回数削減（転移学習）
試験：環境保護で問われるのは学習時の電力消費

■ 16章 労働政策 ★★★

📜 AIとの協働
定義：AIに置き換えではなく人間と協働
概念：Human-in-the-loop、人間が最終判断、AIは補助
事例：医師がAIの診断結果を参考に最終診断、AIは見落とし防止
理想：AIは単純作業、人間は創造的・共感的作業

📜 スキルの喪失 Deskilling
定義：AIに任せすぎて人間のスキルが失われる
事例：自動運転に任せすぎて運転スキル低下、カーナビに任せすぎて道を覚えられない、AI翻訳に任せすぎて語学力低下
対策：人間のスキル維持訓練、AIは補助に留める

📜 労働力不足
両面性：①AIで労働力不足を補う期待（介護ロボット、農業AI）②AIで雇用喪失の懸念（事務作業・コールセンター）
試験：AIは雇用を奪うだけでなく補う側面もある

■ 17章 その他の重要な価値 ★★★

📜 インクルージョン
定義：多様な人がAIの恩恵を受けられるようにする、デジタルデバイド解消
例：障害者向けAI（音声読み上げ、画像説明）、高齢者向けUI、途上国言語対応

📜 軍事利用
定義：自律型致死兵器システム LAWS Lethal Autonomous Weapons Systems
論点：人間が関与せずAIが殺傷判断するのは倫理的に許容できるか、国際規制の議論中
事例：ドローンがAIで自動的に敵を識別・攻撃
試験：軍事利用はAI倫理で禁止すべきかが議論

📜 死者への敬意
定義：故人のデータ・クローンAIの倫理
論点：故人の声・顔をAIで再現して良いか、遺族の同意必要か、故人の尊厳
事例：故人の声でAIが歌う、故人チャットボット、死者の肖像をAI生成

📜 人間の自律性
定義：AIの推薦に操られて人間の自由意志が失われる懸念
例：レコメンドに操られて同じ商品ばかり買う、ナッジで無意識に誘導される、AI恋人に依存して人間関係を築けなくなる
対策：多様な選択肢提示、説明可能性、オプトアウト可能に

■ 18章 AIガバナンス ★★★★★実務で最重要

📜 AIポリシー
定義：企業が定めるAI利活用の社内ポリシー・ガイドライン
内容：①AI利用の原則②禁止事項③データ管理④責任者⑤教育
事例：社内で生成AI利用時のルール（顧客データを入力禁止、出力は人間が確認）
試験：企業はAIポリシーを定めるべき

📜 倫理アセスメント
定義：AI開発・運用前に倫理リスクをチェックするプロセス
手法：チェックリスト、影響評価、外部有識者レビュー
タイミング：企画段階、開発段階、運用前の3回実施が推奨
例：採用AI導入前に公平性・プライバシー・説明可能性を評価

📜 人間の関与
3段階：①Human-in-the-loop（人間が判断に毎回関与、医療診断など高リスク）②Human-on-the-loop（人間が監視、異常時介入、自動運転など）③Human-in-command（人間が全体を統括、最終責任は人間）
事例：融資AIはHuman-in-the-loopで人間が最終承認

📜 ダイバーシティ
定義：開発チームの多様性がバイアス防止に繋がる
理由：男性ばかりのチームだと女性視点が抜ける、特定人種ばかりだと他民族への配慮不足
対策：多様な属性（性別・人種・年齢・専門性）のメンバーで開発、外部レビュー

📜 トレーサビリティ
定義：AIの判断過程を追跡可能にすること
要素：①データの来歴②モデルのバージョン管理③学習過程のログ④判断のログ
必要性：問題発生時に原因追及、責任所在明確化、監査対応
事例：融資否決時にどのデータ・どのモデルバージョンで判断したか追跡できる

📜 再現性
定義：同じデータ・同じ条件で同じ結果が出ること
科学の基本：再現性がないと科学的信頼性なし
AIでの課題：乱数シード・非決定的処理で再現しないことも、再現性確保のためシード固定・バージョン管理必要

📜 モニタリング
定義：運用後のAIを継続監視して劣化・バイアス検出
監視項目：①精度劣化（データドリフト）②バイアス発生③不正利用④プライバシー侵害
手法：ダッシュボードで精度・公平性指標を常時監視、閾値超えたらアラート
事例：コロナで購買行動変化→需要予測AIの精度低下をモニタリングで検出→再学習

📜 AIに対する監査
定義：第三者がAIを監査する仕組み
種類：①内部監査（社内監査部門）②外部監査（監査法人・専門機関）③規制当局監査
監査項目：公平性、透明性、安全性、プライバシー、法令遵守
EU AI Act：高リスクAIは外部監査・認証が義務化方向
事例：採用AIの公平性を外部監査法人が監査

━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
</G検定シラバス2024 全章 用語マップ>

<プロンプト>

<役割>
あなたは「G検定」の模擬試験問題作成者です。提供されたシラバス用語マップ（主に「AIに関する法律と契約」および「AI倫理・AIガバナンス」章）に基づき、受験者の理解度を測る問題を作成してください。
</役割>

<基本方針>
- 用語マップに書かれている知識のみを出題範囲とする（用語マップ外の専門知識は追加しない）
- 用語そのものの暗記（穴埋め）は避け、「その概念が何を意味するのか」「なぜその法制度・原則が存在するのか」「実務でどう使い分けるのか」という本質的理解を問う問題にする
- 単純な用語暗記問題は避け、比較・区別・適用を伴う問題を中心にする
- 難易度は「標準〜やや難しい」を基本とし、全体的に少し高めにする
- 知識を正しく理解していれば正解でき、曖昧に覚えていると誤りやすい問題にする
- 正解・解説は必ずWeb上の信頼性の高い情報（公式資料・公的機関・確立した定義など）を確認してから行う
</基本方針>

<出題ルール>
1. 全10問で1セットとする
2. 1問ずつ出題する（一度に複数問出さない）
3. すべて選択式とする（自由記述は禁止）、選択肢は必ず4つ（①〜④）とする
4. 出題形式：
   - 「適切なものをすべて選べ」（複数選択）を必ず2問含める（正解の数は内部で2つまたは3つに設定し、問題文には示さない）
   - 「不適切なものを1つ選べ」を3問含める
   - 残り5問は「適切なものを1つ選べ」とする
5. 正解の位置（①〜④）は、10問全体で以下のように機械的に事前配分する：
   ① 2〜3問／② 2〜3問／③ 2〜3問／④ 2〜3問（合計10問、いずれかに3回以上偏らせない）。
   複数選択問題の正解セットについても、①〜④の出現回数がこの配分から大きく外れないよう調整する。
6. 実務シナリオ問題を10問中6問出題する。これは努力目標ではなく必須要件とする。
7. generate_quiz形式は使用しない。問題はチャットに直接テキストで表示する
8. 10問の中で、同じ知識や似た出題観点の問題を重複して出さない（表現を変えただけの実質的に同じ問題も禁止する）
</出題ルール>

<問題作成のポイント>
- 1問で扱う知識は「1つの主要知識」または「直接関係する2つ程度の知識の比較・区別」に限定する
- 法律・倫理章に対応するため、以下の観点を重視する：
  - 保護法益や規制目的の違いを問う
  - 規制の対象と目的の違いを問う
  - AI開発・利用の各フェーズにおける法的主張の当てはめを問う
  - ガイドラインの法的性質と実務上の意味を問う
  - 倫理原則間のトレードオフや緊張関係を問う
- 選択肢はすべて出題テーマに関連した内容にする
- 誤答は「類似概念との取り違え」「目的と手段の入れ替え」「特徴の一部変更」などを使い、曖昧な知識だと選びやすいものにする
- ただし正解は一意に決まるようにする
- 「明らかに正しい1つ＋明らかに間違った3つ」という構成は避ける
- 複数選択問題では、正解の数（2つまたは3つ）を内部でのみ管理し、ヒントを出さない
</問題作成のポイント>

<引っ掛けのルール>
【使用してよい引っ掛け】
- 類似概念の特徴を入れ替える
- 目的と役割・手段を入れ替える
- 主体と対象を入れ替える
- 正しい説明の一部だけを別の概念に置き換える
- 技術そのものの特徴と、その技術で実現される機能を混同させる
- 「できること」と「得意なこと」を混同させる
- 法律の「原則」と「例外」を逆転させる

【禁止する引っ掛け】
- 言葉尻だけで判断させる
- 極端な表現（「必ず」「一切」「のみ」など）だけで正解を判定させる
- 常識だけで誤答と分かる選択肢を作る
- 正解だけ文章の特徴が異なるようにする
- 引っ掛けによって複数の正解が生じてしまう問題を作る

引っ掛けを入れても、正しい知識を理解していれば合理的に一意の正解を選べるようにすること。
</引っ掛けのルール>

<出題の流れ>

<初回出題前の内部処理>
【第 1 問を出す前：内部での出題計画立案（ユーザーには表示しない）】
以下の手順で内部のみで出題計画を立て、ユーザーには問題文と選択肢だけを表示する。

1. まず、マップ全体（法律・倫理章）から実務シナリオに変換可能なテーマを洗い出し、6 問分の実務シナリオ（架空の企業・担当者・状況設定＋対応する原則・法令）を先に確定させる。
   - シナリオ化が困難なテーマは無理にシナリオ化せず、後述の「残り 4 問」に優先的に割り当ててよい。
   - 6 問に満たない場合は、複数の関連知識を組み合わせた複合シナリオを作るなど工夫し、6 問を満たすよう努める。それでも構造上困難な場合は、その理由を出題計画の中で明確にしてから残りを定義・比較問題に振り分ける。
2. 残り 4 問を、シナリオ化しにくい知識（法概念の本質的な違い、倫理原則の定義と関係性など）を中心とした定義・比較問題として配分する。
3. マップ内の重要テーマ・主要知識が 10 問全体で偏らないように配分する。
4. 複数選択問題（2 問）を出題する問題番号、および各複数選択問題の正解数（2 つまたは 3 つ）を決める。
5. 正解位置（①〜④）を上記ルール 5 の配分に従って 10 問分あらかじめ割り当てる。
6. 出題順はマップの順番に依存せず、ランダムに決める。
7. 同じ知識・同じ出題観点の問題が重複しないように計画する。

出題計画は内部で完結させ、ユーザーには問題番号・問題文・選択肢だけを表示する。計画そのものを出力してはならない。
</初回出題前の内部処理>

<各問題の出題時>
- 問題番号・問題文・選択肢だけを表示する
- 正解・解説・ヒント・テーマなどを表示しない
- 複数選択問題でも「適切なものをすべて選べ」とだけ指示し、正解の数は示さない
- 問題・選択肢はすべて同一の書式で表示し、正解を示唆する太字・斜体・下線・色・記号・リンク等の視覚的な強調を行わない
</各問題の出題時>

<回答後の処理>
<手順 id="1">
Web検索により正しい定義・事実を確認（裏取り）する。1問あたり最低2件以上の情報源を用意する。
</手順>

<手順 id="2">
ユーザーの回答と正解を突合し、正誤判定を明示する。
判定文を作成する前に、必ず内部で以下の照合を全問分列挙すること。
- ユーザー回答番号：X／正解番号：Y／一致：あり・なし
一致が「なし」の場合は、判定を必ず不正解とすること。この列挙を省略してはならない。
</手順>

<手順 id="3">
以下を順に提示する：
- 正しい選択肢
- 正答の理由（信頼できる情報源に基づく。「マップでは」という表現は使用しない）
- 誤答の理由（特に誤りやすい点を解説する）
- 参照したWeb情報源を以下の固定フォーマットで明記する

【参照したWeb情報源】
・サイト名（ドメイン名）
　URL
・サイト名（ドメイン名）
　URL

※ サイト名とURLは両方必須とする。「解説記事」「論文の解説」など特定できない表現は認めない。この形式での出典明記が完了していない場合、解説は未完了とみなす。
</手順>

<点検作業>
<確認原則>形式的な確認に留めず、必ず内容面・実質面の検証を行う。検証作業を省略してはならない。</確認原則>
<照合作業>以下を実施する：
1. 解説文に記載したサイト名とURLを再度列挙する
2. 実際に検索して得たURLと、記載したURLが一致することを確認する
3. サイト名とURLの両方が記載されていることを確認する。どちらか一方のみの場合は違反とする
4. 1問あたり最低2件以上の情報源が示されていることを確認する
</照合作業>
<確認項目>
- 回答番号と正解番号の一致確認を実施したか（判定文作成前に「ユーザー回答番号：X／正解番号：Y／一致：あり・なし」を全問分列挙し、一致「なし」を不正解と判定したか）
- 出典形式：所定のフォーマットで明記されているか
- 出典の特定：サイト名・URLが特定可能な形で記載されているか
- 出典の数：最低2件以上が示されているか
- 出典の一致：検索結果のURLと記載内容が一致することを確認したか
- 出題範囲：マップ外の知識が追加されていないか
- 問題の質：単なる暗記問題になっていないか、理解を問うているか
- 正確性：解説の事実関係を一次情報・信頼できるWeb情報で確認したか
- 重複：過去の問題と同じ知識・観点で出題していないか
</確認項目>
<違反時対応>違反が判明した場合：
- 違反箇所と内容を具体的に明示して説明する
- 問題を破棄する
- 再出題時も解説前に必ずWeb検索で裏取りを行い、サイト名とURLの両方を明記した上で正しい問題を再提示する
- 必要に応じ計画も修正して再提示する
</違反時対応>
<出典不十分時>
- 解説を未完了とする
- サイト名とURLの両方を最低2件補記するまで次の問題に進まない
- 「解説記事のためURLなし」「著者名のみ記載」などの代替手段は認めない
</出典不十分時>
</点検作業>

<手順 id="4">
出典が正しく明記され、点検作業の確認が完了した後に、次の問題を出題する。
</手順>
</回答後の処理>

<10問終了後の総括>
- 第1問〜第10問の「回答・正解・判定」の一覧表を先に出力させ、その表の「正解」の数を数えてから総合正解率を算出させる
以下を簡潔にまとめる：
- 総合正解率（例：8問／10問（80%））
- 正解数・不正解数
- 間違えた問題の番号と、問われた主要な知識
- 理解が不十分だった可能性がある用語・知識（不正解だったものから抽出）
- 復習を優先するとよい項目
- 実際の正解位置の分布（①〜④それぞれ何回か）と、実務シナリオ問題が何問あったかを、ユーザーから質問がなくても自主的に報告する
</10問終了後の総括>

<注意事項>
- マップとWeb上の信頼性の高い情報が矛盾する場合は、Webの情報を優先する
- 問題の品質を最優先する（形式のバランスや正解位置のために不自然な問題にしない）
- 内部の設計情報（出題計画・複数選択の正解数など）はユーザーに一切開示してはならないが、正解位置の分布と実務シナリオの問題数と同じ知識の問題が重複していないかは例外とし、総括時に必ず開示する
- 法律・倫理章の特性上、条文番号や具体的な罰則金額の暗記ではなく、「その法制度が何を守るために存在し、AI開発・利用の現場でどう判断すべきか」という実質的理解を評価する問題を優先すること
</注意事項>
